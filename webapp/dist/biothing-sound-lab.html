const formBandWeights = () => { const t = E.TARGETS[state.target], w = G.BANDS.map((b) => t[b] || 0), s = w.reduce((a, b) => a + b, 0) || 1; return w.map((x) => x / s); };
// Absorption per object per octave 125-4000 Hz. Only 250-1000 Hz are simulated; 125 Hz is taken as half
// of 250 Hz and the bands above 1 kHz as equal to 1 kHz (porous forms rarely absorb less up there).
const formOct = (f) => [f.area[0] * 0.5, f.area[0], f.area[1], f.area[2], f.area[2], f.area[2]];
const primsOf = (flat) => G.unpack(flat);
const flatPrims = (prims) => G.pack(prims);
const structureKey = () => (state.rigid.has("birch_plywood") ? "birch_plywood" : [...state.rigid][0]);
const baselineScore = (f) => (f.baseline ? f.baseline.reduce((a, x, i) => a + x * formBandWeights()[i], 0) : null);

// Simulations run in background workers so the page stays responsive; inline if workers are unavailable.
const Pool = (() => {
  let workers = null, idle = [], next = 1;
  const queue = [], pending = new Map();
  const glue = `
self.onmessage = (e) => {
  const { id, kind, job } = e.data;
  try {
    let r;
    if (kind === "baseline") r = { area: Growth.panelBaseline(job) };
    else { r = Growth.evaluate(job); r.prims = Growth.pack(r.prims); }
    postMessage({ id, r });
  } catch (err) { postMessage({ id, error: String((err && err.message) || err) }); }
};`;
  function init() {
    if (workers) return;
    workers = [];
    try {
      const url = URL.createObjectURL(new Blob([$("#growth-src").textContent, glue], { type: "text/javascript" }));
      const n = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1));
      for (let i = 0; i < n; i++) {
        const w = new Worker(url);
        w.onmessage = (e) => {
          const task = pending.get(e.data.id);
          pending.delete(e.data.id); w.job = null; idle.push(w);
          if (task) e.data.error ? task.reject(new Error(e.data.error)) : task.resolve(e.data.r);
          pump();
        };
        w.onerror = (ev) => {
          ev.preventDefault();
          workers = workers.filter((x) => x !== w); idle = idle.filter((x) => x !== w);
          if (w.job) { pending.delete(w.job.id); queue.unshift(w.job); w.job = null; }
          pump();
        };
        workers.push(w); idle.push(w);
      }
    } catch (e) { workers = []; }
  }
  function inline(task) {
    setTimeout(() => {
      try {
        let r;
        if (task.kind === "baseline") r = { area: G.panelBaseline(task.job) };
        else { r = G.evaluate(task.job); r.prims = flatPrims(r.prims); }
        task.resolve(r);
      } catch (err) { task.reject(err); }
    }, 0);
  }
  function pump() {
    while (queue.length) {
      if (!workers.length) { inline(queue.shift()); continue; }
      const w = idle.shift();
      if (!w) return;
      const task = queue.shift();
      w.job = task; pending.set(task.id, task);
      w.postMessage({ id: task.id, kind: task.kind, job: task.job });
    }
  }
  return { run(kind, job) { init(); return new Promise((resolve, reject) => { queue.push({ id: next++, kind, job, resolve, reject }); pump(); }); } };
})();

async function growForms() {
  if (state.fGrowing) return;
  if (!allowedSoft().length) { addMsg("note", "Pick at least one soft material in the Materials workspace first."); return; }
  state.fGrowing = true; state.fProgress = 0;
  renderOptbar(); renderStatus();
  const rules = rulesFor(state.fRule);
  const P = rules.length > 1 ? 10 : 14, GENS = rules.length > 1 ? 5 : 9, total = rules.length * (GENS + 1);
  const mats = allowedSoft(), weights = formBandWeights(), sKey = structureKey(), rand = G.rng(97 + state.fSeed++ * 7919), made = [];
  let steps = 0, field = null;
  if (rules.some(isSound)) {
    field = await computeField();
    if (!field) { state.fGrowing = false; renderOptbar(); renderStatus(); return; }
  }
  const job = field && { data: field.data, nx: field.nx, nz: field.nz, rhythm: field.rhythm || null };
  try {
    for (const rule of rules) {
      if (isSurf(rule)) {
        if (rule === "cloud" && state.fMount === "standing") { addMsg("note", "The hanging cloud only hangs: switch to Hanging to grow it."); steps += GENS + 1; continue; }
        const base = steps;
        const piece = await growSurface(rule, sKey, (live, prog) => {
          state.fLive = live; state.fProgress = (base + prog * (GENS + 1)) / total;
          if (gmode() === "forms") { renderFormsCanvas(); renderStatus(); }
        });
        steps += GENS + 1;
        made.push(addForm(piece));
        continue;
      }
      const n = G.geneCount(rule);
      // Genware's library of seeds: kept genomes (and slight variations) start the population.
      const seeds = (state.seeds[rule] || []).filter((g) => g.length === n), nSeed = Math.min(seeds.length * 2, Math.floor(P / 2));
      let pop = Array.from({ length: P }, (_, i) => (i < nSeed ? seeds[i % seeds.length].map((x) => (i < seeds.length ? x : Math.min(1, Math.max(0, x + (rand() - 0.5) * 0.2)))) : Array.from({ length: n }, rand))), best = null;
      for (let gen = 0; gen <= GENS; gen++) {
        // A cut-sheet must be a self-supporting sheet: only felts that can be cut and shaped.
        const ms = rule === "cutsheet" && mats.some((k) => E.FELTS[k].formable) ? mats.filter((k) => E.FELTS[k].formable) : mats;
        const res = await Promise.all(pop.map((genes) => {
          const material = ms[Math.min(ms.length - 1, Math.floor(genes[n - 1] * ms.length))], m = E.FELTS[material];
          return Pool.run("evaluate", { rule, genes, mount: state.fMount, size: state.fSize, material: { sigma: m.sigma, density: m.density }, budget: state.fBudget, weights,
            structureDensity: E.RIGIDS[sKey].density, field: isSound(rule) ? job : null })
            .then((r) => ({ ...r, material, structureMat: sKey, ...(isSound(rule) ? { srcField: job, sourceLabel: field.label } : {}) }));
        }));
        for (const r of res) if (!best || r.fitness > best.fitness) best = r;
        state.fLive = best; state.fProgress = ++steps / total;
        if (gmode() === "forms") { renderFormsCanvas(); renderStatus(); }
        if (gen < GENS) pop = G.nextGeneration(pop, res.map((r) => r.fitness), rand);
      }
      made.push(addForm(best));
    }
  } catch (err) {
    addMsg("note", "The simulation stopped: " + err.message);
  } finally {
    state.fGrowing = false; state.fLive = null;
  }
  if (made.length) {
    const top = made.sort((a, b) => b.fitness - a.fitness)[0];
    state.formSel = top.id;
    addMsg("note", `Grown. ${made.length > 1 ? `Best rule: ${top.name}` : top.name}: ${fix(top.score, 2)} m² of absorption per piece. Watch the sound under the 3D view.`);
  }
  renderAll();
}
function addForm(r, name) {
  const same = state.forms.filter((f) => f.rule === r.rule).length;
  const f = { ...r, id: state.fNext++, name: name || `${info(r.rule).name} ${same + 1}`, baseline: null };
  state.forms.push(f);
  if (f.kind === "surface") { f.baseline = surfBaseline(f); return f; }
  Pool.run("baseline", { material: { sigma: E.FELTS[f.material].sigma, density: E.FELTS[f.material].density }, mass: f.mass })
    .then((b) => { f.baseline = b.area; if (gmode() === "forms" && !state.fGrowing) { renderFormsCanvas(); renderDock(); } })
    .catch(() => {});
  return f;
}

function formBars(f) {
  const w = 460, h = 180, L = 40, B = 28, T = 10, base = f.baseline || [0, 0, 0], max = Math.max(0.1, ...f.area, ...base) * 1.15;
  const y = (v) => T + (1 - v / max) * (h - T - B), gw = (w - L - 10) / 3;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Absorption of the form and of a flat panel with the same material">`;
  for (let v = 0; v <= max; v += max > 2 ? 1 : max > 1 ? 0.5 : 0.25) s += `<line x1="${L}" x2="${w - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${v.toFixed(v < 1 && max <= 1 ? 2 : 1)}</text>`;
  G.BANDS.forEach((band, i) => {
    const x = L + gw * i;
    s += `<rect x="${x + gw * 0.15}" y="${y(f.area[i])}" width="${gw * 0.32}" height="${h - B - y(f.area[i])}" fill="var(--accent)"/>`;
    if (f.baseline) s += `<rect x="${x + gw * 0.53}" y="${y(base[i])}" width="${gw * 0.32}" height="${h - B - y(base[i])}" fill="#6a6e76"/>`;
    s += `<text x="${x + gw / 2}" y="${h - 10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">${hz(band)}</text>`;
  });
  return s + "</svg>";
}

// A light OBJ: 8-sided tubes for branches, low-poly balls for spheres and joints. Metres, z up.
function formOBJ(f) {
  const v = [], out = [];
  let faces = [];
  const tube = (a, b, r) => {
    const d = norm3(sub3(b, a)), u = Math.abs(d[2]) < 0.9 ? norm3(cross3(d, [0, 0, 1])) : norm3(cross3(d, [1, 0, 0])), w = cross3(d, u), base = v.length + 1;
    for (const c of [a, b]) for (let k = 0; k < 8; k++) { const t = (k / 8) * 2 * Math.PI; v.push(add3(c, add3(mul3(u, r * Math.cos(t)), mul3(w, r * Math.sin(t))))); }
    for (let k = 0; k < 8; k++) { const k2 = (k + 1) % 8; faces.push([base + k, base + k2, base + 8 + k2, base + 8 + k]); }
    faces.push([...Array(8).keys()].map((k) => base + 7 - k)); faces.push([...Array(8).keys()].map((k) => base + 8 + k));
  };
  const ball = (c, r) => {
    const base = v.length + 1, n = 8, m = 6;
    for (let i = 0; i <= m; i++) for (let j = 0; j < n; j++) {
      const th = (i / m) * Math.PI, ph = (j / n) * 2 * Math.PI;
      v.push([c[0] + r * Math.sin(th) * Math.cos(ph), c[1] + r * Math.sin(th) * Math.sin(ph), c[2] + r * Math.cos(th)]);
    }
    for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) { const j2 = (j + 1) % n; faces.push([base + i * n + j, base + (i + 1) * n + j, base + (i + 1) * n + j2, base + i * n + j2]); }
  };
  const sheet = (p) => {
    const nrm = mul3(norm3(cross3(p.u, p.v)), p.t / 2), base = v.length + 1;
    for (const sn of [-1, 1]) for (const [su, sv] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) v.push(add3(add3(p.c, mul3(nrm, sn)), add3(mul3(p.u, su), mul3(p.v, sv))));
    faces.push([base, base + 3, base + 2, base + 1], [base + 4, base + 5, base + 6, base + 7]);
    for (let k = 0; k < 4; k++) { const k2 = (k + 1) % 4; faces.push([base + k, base + k2, base + 4 + k2, base + 4 + k]); }
  };
  const parts = primsOf(f.prims);
  for (const [label, list] of [["felt", parts.filter((p) => !p.structure)], ["structure", parts.filter((p) => p.structure)]]) {
    if (!list.length) continue;
    faces = [];
    for (const p of list) {
      if (G.isSheet(p)) sheet(p);
      else if (Math.hypot(...sub3(p.b, p.a)) < 1e-6) ball(p.a, p.r);
      else { tube(p.a, p.b, p.r); if (p.r > 0.012 && !p.structure) ball(p.b, p.r); }
    }
    out.push({ label, faces });
  }
  return `# Biothing Sound Lab: ${f.name} (${info(f.rule).name}), ${f.mount}, metres, z up\n# felt: ${E.FELTS[f.material].name}, ${fix(f.mass, 2)} kg`
    + (f.stance ? `\n# structure: ${E.RIGIDS[f.structureMat || structureKey()].name}, ${fix(f.stance.structureMass, 2)} kg; tips at ${fix(f.stance.angle, 0)} degrees` : "") + "\n"
    + v.map((p) => `v ${p[0].toFixed(4)} ${p[1].toFixed(4)} ${p[2].toFixed(4)}`).join("\n") + "\n"
    + out.map((o) => `o ${o.label}\n` + o.faces.map((q) => "f " + q.join(" ")).join("\n")).join("\n") + "\n";
}
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm3 = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

// Instanced tubes and balls for a form, optionally repeated at several positions (Spaces).
function formInstances(f, positions, parent) {
  const parts = primsOf(f.prims), o = new T3.Object3D(), up = new T3.Vector3(0, 1, 0);
  const soft = new T3.MeshStandardMaterial({ color: SOFT_COLORS[f.material], roughness: 0.95 });
  const hard = new T3.MeshStandardMaterial({ color: HARD_COLORS[f.structureMat || structureKey()] || 0x8d9198, roughness: 0.7 });
  for (const [mat, list] of [[soft, parts.filter((p) => !p.structure)], [hard, parts.filter((p) => p.structure)]]) {
    const tubes = [], balls = [], sheets = [];
    for (const p of list) {
      if (G.isSheet(p)) sheets.push(p);
      else if (Math.hypot(...sub3(p.b, p.a)) < 1e-6) balls.push(p);
      else { tubes.push(p); if (p.r > 0.012) balls.push({ a: p.b, b: p.b, r: p.r }); }
    }
    if (tubes.length) {
      const inst = new T3.InstancedMesh(new T3.CylinderGeometry(1, 1, 1, 8), mat, tubes.length * positions.length);
      let i = 0;
      for (const off of positions) for (const p of tubes) {
        const a = new T3.Vector3(p.a[0] + off[0], p.a[1] + off[1], p.a[2] + off[2]), b = new T3.Vector3(p.b[0] + off[0], p.b[1] + off[1], p.b[2] + off[2]), d = b.clone().sub(a), L = d.length();
        o.position.copy(a).add(b).multiplyScalar(0.5); o.quaternion.setFromUnitVectors(up, d.normalize()); o.scale.set(p.r, L, p.r); o.updateMatrix(); inst.setMatrixAt(i++, o.matrix);
      }
      parent.add(inst);
    }
    if (balls.length) {
      const inst = new T3.InstancedMesh(new T3.SphereGeometry(1, 14, 10), mat, balls.length * positions.length);
      let i = 0;
      o.quaternion.identity();
      for (const off of positions) for (const p of balls) { o.position.set(p.a[0] + off[0], p.a[1] + off[1], p.a[2] + off[2]); o.scale.set(p.r, p.r, p.r); o.updateMatrix(); inst.setMatrixAt(i++, o.matrix); }
      parent.add(inst);
    }
    if (sheets.length) {
      const inst = new T3.InstancedMesh(new T3.BoxGeometry(1, 1, 1), mat, sheets.length * positions.length), m4 = new T3.Matrix4();
      let i = 0;
      for (const off of positions) for (const p of sheets) {
        const u = new T3.Vector3(...p.u), v = new T3.Vector3(...p.v), Lu = u.length(), Lv = v.length(), n = u.clone().cross(v).normalize();
        m4.makeBasis(u.clone().normalize(), v.clone().normalize(), n);
        m4.scale(new T3.Vector3(2 * Lu, 2 * Lv, p.t));
        m4.setPosition(p.c[0] + off[0], p.c[1] + off[1], p.c[2] + off[2]);
        inst.setMatrixAt(i++, m4);
      }
      parent.add(inst);
    }
  }
}

// 3D view of one form with its ceiling or floor, and a person for scale when it stands.
const FormView = (() => {
  let v = null, shown = null;
  function build(f) {
    v.clear();
    formInstances(f, [[0, 0, 0]], v.root);
    const S = f.size, H = G.envelope(S, f.mount).height, grey = new T3.MeshStandardMaterial({ color: 0x55585e, roughness: 1 });
    const slab = new T3.Mesh(new T3.BoxGeometry(S * 1.6, S * 1.6, 0.02), f.mount === "hanging" ? new T3.MeshStandardMaterial({ color: 0x55585e, roughness: 1, transparent: true, opacity: 0.55 }) : grey);
    slab.position.set(0, 0, f.mount === "hanging" ? 0.01 : -0.01);
    v.root.add(slab);
    if (f.mount === "standing") {
      const body = new T3.MeshStandardMaterial({ color: 0x8d9198, roughness: 1 }), x = S / 2 + 0.45;
      const part = (geo, z) => { const m = new T3.Mesh(geo, body); m.rotation.x = Math.PI / 2; m.position.set(x, 0, z); v.root.add(m); };
      part(new T3.CylinderGeometry(0.11, 0.09, 0.85, 12), 0.43);
      part(new T3.CylinderGeometry(0.16, 0.12, 0.65, 12), 1.18);
      const head = new T3.Mesh(new T3.SphereGeometry(0.11, 16, 12), body); head.position.set(x, 0, 1.62); v.root.add(head);
    }
    const midZ = f.mount === "hanging" ? -H / 2 : H / 2;
    Object.assign(v.orbit, { target: [f.mount === "standing" ? 0.25 : 0, 0, midZ], dist: Math.max(S, H) * 2.4, theta: -0.9, phi: f.mount === "hanging" ? 1.85 : 1.2 });
  }
  return {
    show(slot, f) {
      if (!v) v = makeViewer({ up: "z", cls: "viewport shape-view" });
      slot.replaceWith(v.el);
      if (!v.ok) return;
      const sig = f.id + ":" + f.fitness + ":" + f.prims.length;
      if (shown !== sig) { shown = sig; build(f); }
      v.draw();
    },
    detach() { if (v && v.el.isConnected) v.el.remove(); },
  };
})();

// Live wave animation: the same solver as the evaluation, on the slice through the middle of the form.
const FormWave = (() => {
  let sim = null, sig = "", raf = 0, cv = null, svg = null, ctx = null, img = null, peak = 0, curve = [], e0 = 0, tEnd = 0, room = null;
  function setup(f, band) {
    sig = f.id + ":" + band;
    const vox = G.voxelize(primsOf(f.prims), 343.2 / band / 6);
    room = G.roomFor(f.mount);
    sim = G.makeSim(G.slice(vox, 0, 0.5), E.FELTS[f.material].sigma, band, room, f.mount);
    peak = 0; curve = []; e0 = 0; tEnd = sim.burstEnd + 0.2;
  }
  function draw() {
    const { nx, nz, p, s } = sim, d = img.data;
    let frameMax = 0;
    for (let i = 0; i < p.length; i++) frameMax = Math.max(frameMax, Math.abs(p[i]));
    peak = Math.max(peak, frameMax, 1e-9); // fixed to the loudest moment, so the fading shows
    for (let k = 0; k < nz; k++) for (let i = 0; i < nx; i++) {
      const src = i + nx * k, dst = 4 * (i + nx * (nz - 1 - k)), val = p[src] / peak, a = Math.min(1, Math.sqrt(Math.abs(val)));
      let r = 16, g = 17, b = 20;
      if (val > 0) { r += (230 - r) * a; g += (162 - g) * a; b += (60 - b) * a; } else { r += (74 - r) * a; g += (144 - g) * a; b += (226 - b) * a; }
      const m = s[src] * 0.8;
      if (m > 0) { r += (91 - r) * m; g += (182 - g) * m; b += (124 - b) * m; }
      d[dst] = r; d[dst + 1] = g; d[dst + 2] = b; d[dst + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  function drawCurve() {
    if (!svg) return;
    const t0 = sim.burstEnd, X = (t) => 30 + ((t - t0) / (tEnd - t0)) * 262, Y = (db) => 10 + (-db / 30) * 110;
    let s = `<rect x="0" y="0" width="300" height="140" fill="var(--app)"/>`;
    for (const db of [0, -10, -20, -30]) s += `<line x1="30" x2="292" y1="${Y(db)}" y2="${Y(db)}" stroke="var(--line)"/><text x="26" y="${Y(db) + 4}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--mono)">${db}</text>`;
    s += `<line x1="30" x2="292" y1="${Y(0)}" y2="${Y(0)}" stroke="#8a8e96" stroke-dasharray="4 3"/><text x="290" y="${Y(0) - 4}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--sans)">empty room keeps ringing</text>`;
    if (curve.length > 1) s += `<polyline points="${curve.map(([t, db]) => `${X(t).toFixed(1)},${Y(Math.max(-30, db)).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--good)" stroke-width="2"/>`;
    s += `<text x="161" y="136" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--sans)">time → (dB below the start)</text>`;
    svg.innerHTML = s;
  }
  function loop() {
    if (!cv || !cv.isConnected || !sim) return;
    if (sim.t < tEnd) {
      sim.step(Math.max(1, Math.round(tEnd / sim.dt / 420)));
      if (sim.t > sim.burstEnd) {
        const e = sim.energy();
        if (!e0) e0 = e;
        curve.push([sim.t, 10 * Math.log10(Math.max(e / e0, 1e-9))]);
      }
    }
    draw(); drawCurve();
    if (sim.t < tEnd) raf = requestAnimationFrame(loop);
  }
  function bind() {
    cv = $("#wave-canvas"); svg = $("#wave-energy");
    if (!cv || !sim) return false;
    cv.width = sim.nx; cv.height = sim.nz; ctx = cv.getContext("2d"); img = ctx.createImageData(sim.nx, sim.nz);
    return true;
  }
  return {
    start(f, band) {
      if (f.id + ":" + band !== sig || !sim) setup(f, band);
      cancelAnimationFrame(raf);
      if (bind()) loop();
    },
    replay(f, band) { setup(f, band); cancelAnimationFrame(raf); if (bind()) loop(); },
    stop() { cancelAnimationFrame(raf); },
  };
})();

// --------------------------------------------------------------- genware ---
// Sound-grown membranes, after Biothing's Genware: a sound becomes a structural field that grows
// a cellular membrane. Three sources: the target sound, a sound file, or a room's own resonances.
ICONS.allsurf = '<rect x="2" y="4" width="16" height="4" rx="1"/><path d="M3 12 L6 16 L9 12 L12 16 L15 12 L17 15"/>';
ICONS.membrane = '<path d="M2 9 C4 3 6 3 8 9 S12 15 14 9 S18 3 18 9"/><path d="M3 16 H17"/>';
state.gw = { source: "target", spaceId: null, file: null, field: null, key: "", busy: false };
state.seeds = {}; // Genware's "library of seeds": genomes the designer keeps, per growth rule

function gwRoom() {
  const sp = state.spaces.find((s) => s.id === state.gw.spaceId) || curSpace();
  if (!sp) return { name: "a 6 m test room", L: 6, W: 5, H: 3.5, id: null };
  const { min, max } = sp.info, a = max[0] - min[0], b = max[1] - min[1];
  return { name: sp.name, L: Math.max(a, b), W: Math.min(a, b), H: max[2] - min[2], id: sp.id };
}
const gwKey = () => JSON.stringify([state.gw.source, gwRoom(), state.fSize, state.fMount, state.target, state.gw.file && state.gw.file.name]);
function gwLabel() {
  const room = gwRoom().name, f = state.gw.file;
  if (state.gw.source === "file") return `your recording “${f.name}”${f.bpm ? ` (${Math.round(f.bpm)} BPM)` : ""} in ${room}`;
  if (state.gw.source === "room") return `the resonances of ${room}`;
  return `${TARGET_INFO[state.target].label.toLowerCase()} in ${room}`;
}
const selMembrane = () => { const f = selForm(); return f && isSound(f.rule) && f.rule === state.fRule ? f : null; };

async function computeField() {
  if (state.gw.field && state.gw.key === gwKey()) return state.gw.field;
  if (state.gw.busy) return null;
  if (state.gw.source === "file" && !state.gw.file) { addMsg("note", "Choose a sound file first, or pick another sound source."); return null; }
  state.gw.busy = true;
  renderDock();
  await new Promise((r) => setTimeout(r, 30));
  try {
    const room = gwRoom(), env = G.envelope(state.fSize, state.fMount);
    const L = Math.min(16, Math.max(3, room.L)), H = Math.min(6, Math.max(2.4, room.H)), W = Math.max(2, room.W);

// Iterative radix-2 FFT (in place); N must be a power of two.
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (-2 * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ar = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, ai = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k + len / 2] = re[i + k] - ar; im[i + k + len / 2] = im[i + k] - ai; re[i + k] += ar; im[i + k] += ai;
        [cr, ci] = [cr * wr - ci * wi, cr * wi + ci * wr];
      }
    }
  }
}

// Reads a sound file: its rhythm (tempo and how strong the beat is), its loudest 0.3 s resampled
// to the wave solver's time step (that is what drives the field), and its octave-band balance.
async function loadSound(file) {
  if (!file) return;
  state.gw.busy = true;
  renderDock();
  try {
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const audio = await new Ctx(1, 2, 44100).decodeAudioData(await file.arrayBuffer());
    const sr = audio.sampleRate, n = Math.min(audio.length, sr * 60), x = new Float32Array(n);
    for (let c = 0; c < audio.numberOfChannels; c++) { const d = audio.getChannelData(c); for (let i = 0; i < n; i++) x[i] += d[i] / audio.numberOfChannels; }
    const hop = Math.round(sr * 0.02), frames = Math.max(1, Math.floor(n / hop)), env = new Float32Array(frames);
    for (let f = 0; f < frames; f++) { let e = 0; for (let i = f * hop; i < Math.min(n, (f + 1) * hop); i++) e += x[i] * x[i]; env[f] = Math.sqrt(e / hop); }
    const on = env.map((v, i) => Math.max(0, v - (i ? env[i - 1] : 0))), mean = on.reduce((a, b) => a + b, 0) / frames, oc = on.map((v) => v - mean);
    const ac = (lag) => { let s = 0; for (let i = lag; i < frames; i++) s += oc[i] * oc[i - lag]; return s; };
    const a0 = ac(0) || 1;
    let bestLag = 0, best = -Infinity;
    for (let lag = 15; lag <= 75 && lag < frames; lag++) { const v = ac(lag); if (v > best) { best = v; bestLag = lag; } }
    const strength = Math.max(0, Math.min(1, (best / a0) * 2)), bpm = bestLag && strength > 0.05 ? 60 / (bestLag * 0.02) : 0;
    const win = 15;
    let pk = -1, pkAt = 0;
    for (let f = 0; f + win <= frames; f++) { let s = 0; for (let k = 0; k < win; k++) s += env[f + k]; if (s > pk) { pk = s; pkAt = f; } }
    const dt = G.solverStep(), start = pkAt * hop, len = Math.round(0.3 / dt), sig = new Float32Array(len), stepS = sr * dt;
    for (let i = 0; i < len; i++) {
      const a = Math.floor(start + i * stepS), b = Math.min(n, Math.floor(start + (i + 1) * stepS));
      let s = 0;
      for (let j = a; j < b; j++) s += x[j];
      sig[i] = b > a ? s / (b - a) : 0;
    }
    let peak = 1e-9;
    for (const v of sig) peak = Math.max(peak, Math.abs(v));
    for (let i = 0; i < len; i++) sig[i] /= peak;
    const N = 8192, re = new Float32Array(N), im = new Float32Array(N);
    for (let i = 0; i < N; i++) { const j = start + i; re[i] = (j < n ? x[j] : 0) * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1))); }
    fft(re, im);
    const bands = [125, 250, 500, 1000, 2000, 4000].map((fc) => {
      let e = 0;
      for (let k = Math.floor((fc / Math.SQRT2 / sr) * N); k <= Math.ceil((fc * Math.SQRT2 / sr) * N) && k < N / 2; k++) e += re[k] * re[k] + im[k] * im[k];
      return e;
    });
    const bmax = Math.max(...bands) || 1;
    state.gw.file = { name: file.name, duration: audio.duration, signal: sig, bpm, strength, bands: bands.map((b) => b / bmax) };
    state.gw.source = "file"; state.gw.field = null;
    addMsg("note", `Listened to “${file.name}”: ${bpm ? `about ${Math.round(bpm)} beats per minute` : "no clear beat"}, loudest around ${hz([125, 250, 500, 1000, 2000, 4000][bands.indexOf(bmax)])}.`);
  } catch (err) {
    addMsg("note", "Could not read that sound file. Try a WAV or MP3 recording.");
  } finally {
    state.gw.busy = false;
  }
  renderDock();
  if (gmode() === "forms") renderFormsCanvas();
}

// Heat map of a field (dark = calm air, yellow = where the air moves most), with membrane cells on top.
function drawField(cv, field, parts, width, height, mount) {
  if (!cv || !field) return;
  const W = 240, Hp = Math.max(60, Math.round((240 * height) / width)), { nx, nz, data } = field;
  cv.width = W; cv.height = Hp;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(W, Hp), stops = [[20, 21, 24], [47, 125, 85], [230, 195, 74]];
  for (let y = 0; y < Hp; y++) for (let x = 0; x < W; x++) {
    const u = (x / (W - 1)) * (nx - 1), v = (1 - y / (Hp - 1)) * (nz - 1), i = Math.min(nx - 2, Math.floor(u)), k = Math.min(nz - 2, Math.floor(v)), fu = u - i, fv = v - k;
    const q = (a, b) => data[a + nx * b], f = (q(i, k) * (1 - fu) + q(i + 1, k) * fu) * (1 - fv) + (q(i, k + 1) * (1 - fu) + q(i + 1, k + 1) * fu) * fv;
    const t = Math.max(0, Math.min(1, f)) * 2, a = stops[Math.min(1, Math.floor(t))], b = stops[Math.min(2, Math.floor(t) + 1)], w = t - Math.floor(t), d = 4 * (x + W * y);
    img.data[d] = a[0] + (b[0] - a[0]) * w; img.data[d + 1] = a[1] + (b[1] - a[1]) * w; img.data[d + 2] = a[2] + (b[2] - a[2]) * w; img.data[d + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  if (!parts) return;
  ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 1;
  for (const p of parts) {
    if (!G.isSheet(p) || p.structure) continue;
    const z = p.c[2] + (mount === "hanging" ? height : 0), hu = Math.hypot(p.u[0], p.u[1]), hv = Math.hypot(...p.v);
    const px = (p.c[0] / width + 0.5) * W, py = (1 - z / height) * Hp, sx = (hu / width) * W, sy = (hv / height) * Hp;
    ctx.strokeRect(px - sx, py - sy, 2 * sx, 2 * sy);

}

// The cut-sheet's laser-cutter file: red lines cut, blue and green lines are scored hinges

function cutSVG(f, preview = false) {

  for (const c of P.cells) {

    const hinge = c.side ? `M${X(l)} ${Y(t)} L${X(l)} ${Y(b)} ` : `M${X(l)} ${Y(t)} L${X(r)} ${Y(t)} `;
    cuts += c.side ? `M${X(l)} ${Y(t)} L${X(r)} ${Y(t)} L${X(r)} ${Y(b)} L${X(l)} ${Y(b)} ` : `M${X(l)} ${Y(t)} L${X(l)} ${Y(b)} L${X(r)} ${Y(b)} L${X(r)} ${Y(t)} `;
    if (c.dir < 0) back += hinge; else front += hinge;
    if (preview) fills += `<rect x="${X(l)}" y="${Y(t)}" width="${(c.w * 1000).toFixed(1)}" height="${(c.h * 1000).toFixed(1)}" fill="#e6c34a" fill-opacity="${Math.min(0.85, 0.15 + c.open / 1.4).toFixed(2)}"/>`;
  }
  const sw = preview ? 5 : 0.2, dash = preview ? "14 8" : "4 2";
  const body = `${fills}<rect x="0" y="0" width="${W.toFixed(1)}" height="${Hh.toFixed(1)}" fill="${preview ? "var(--app)" : "none"}" fill-opacity="${preview ? 0.4 : 0}" stroke="#ff0000" stroke-width="${sw}"/>
<path d="${cuts}" fill="none" stroke="#ff0000" stroke-width="${sw}"/><path d="${front}" fill="none" stroke="#0000ff" stroke-width="${sw}" stroke-dasharray="${dash}"/><path d="${back}" fill="none" stroke="#00aa00" stroke-width="${sw}" stroke-dasharray="${dash}"/>`;
  if (preview) return `<svg viewBox="-10 -10 ${W + 20} ${Hh + 20}" class="cut-preview" role="img" aria-label="Cut pattern of the sheet">${body}</svg>`;
  return `<?xml version="1.0" encoding="UTF-8"?>
<!-- Biothing Sound Lab: ${esc(f.name)}. ${esc(E.FELTS[f.material].name)}, ${Math.round(P.t * 1000)} mm, sheet ${Math.round(W)} x ${Math.round(Hh)} mm laid flat (bend it to its plan curve after cutting).
     Red: cut (${fix(P.cutLength, 1)} m). Blue: score on the front, flap folds forward. Green: score on the back, flap folds backward. ${P.flaps} flaps. -->
<svg xmlns="http://www.w3.org/2000/svg" width="${W.toFixed(1)}mm" height="${Hh.toFixed(1)}mm" viewBox="0 0 ${W.toFixed(1)} ${Hh.toFixed(1)}">
${body}
</svg>
`;
}

// Growing one behaviour on another: a second, finer growth (felt tufts) on the surfaces of a form,
// drawn by the speech-band sound. The form itself may have come from the room's low resonances.
const SPEECH_W = [0.2, 0.4, 0.4];
function speechField(f) {
  const room = gwRoom(), env = G.envelope(f.size, f.mount), L = Math.min(16, Math.max(3, room.L)), H = Math.min(6, Math.max(2.4, room.H));
  const x0 = 0.62 * L, zBase = f.mount === "hanging" ? Math.max(0, H - env.height) : 0;
  const fl = G.fieldFromSound({ room: { w: L, h: H, cx: x0 }, weights: SPEECH_W, x0, width: f.size, height: env.height, src: [Math.max(0.5, x0 - 2), Math.min(H - 0.3, 1.5)], zBase });

const formJob = (f, extra) => {
  const m = E.FELTS[f.material], sKey = f.structureMat || structureKey();

    structureDensity: E.RIGIDS[sKey].density, field: f.srcField || null, skin: f.skin || null, ...extra };

      for (const r of res) if (!best || r.fitness > best.fitness) best = r;
      state.fProgress = (gen + 1) / (GENS + 2); renderStatus();

    }

// The seed library travels: save it after one exhibition, load it at the next venue.

// Surface textures as freestanding pieces: the texture grows on both faces of a thin rigid core

  const perPiece = [1, 2, 3].map((i) => oct[i] * area), w = formBandWeights(), score = perPiece.reduce((a, x, i) => a + x * w[i], 0), mass = r.mass * area;
  const vox = G.voxelize(parts, 0.05), feltMass = felt ? vox.volume * felt.density : 0;
  const stance = mount === "standing" && r.family !== "cloud" ? G.stability(parts, vox.com, mass, E.RIGIDS[sKey].density) : null;
  let fitness = r.fitness * area;
  if (stance && !stance.ok) fitness -= score * 0.8;
  return { kind: "surface", rule: r.family, family: r.family, engine: r, params: r.params, alpha18: r.alpha, genes: [], mount: r.family === "cloud" ? "hanging" : mount, size,
    prims: G.pack(parts), mass, area: perPiece, score, fitness, perKg: score / Math.max(mass, 1e-6), stance, holdfast: parts.label, material: r.params.porous || allowedSoft()[0],
    structureMat: sKey, faces, faceArea: face, felt: felt ? felt.name : null, feltMass };
}
// Same felt, same kg, as a flat 50 mm layer on a wall: the like-for-like comparison in this model.
function surfBaseline(f) {
  const felt = E.FELTS[f.material];
  const m = f.feltMass != null ? f.feltMass : f.mass;
  if (!felt || m <= 0.01) return null;
  const oct = R.thirdToOctave(E.flatLayer(f.material, 50).alpha), panel = m / (felt.density * 0.05);
  return [1, 2, 3].map((i) => oct[i] * panel);
}

async function growSurface(rule, sKey, onLive) {
  const fam = E.FAMILY[rule], b = surfBrief(rule);
  const br = E.breeder(fam, b, { population: 24, generations: 16, seed: state.fSeed * 31 + rule.length });
  while (!br.done) {
    br.step();
    if (br.best) onLive(surfPiece(br.best, sKey), br.generation / br.generations);
    await new Promise((res) => requestAnimationFrame(() => setTimeout(res, 0)));
  }
  return surfPiece(br.best, sKey);
}

const RULES = `You are the friendly guide inside "Biothing Sound Lab", a design tool laid out like a creative-suite app. It grows sound-absorbing shapes inspired by nature (after Alisa Andrasek's Biothing): all of them in one Structures workspace: surface textures (panel-like families) and free objects. The product must be freestanding: standing forms grow a holdfast (splayed roots or a plinth) and must lean 10 degrees before toppling. Forms come from natural rules (branching tree, snow crystal, folding coral, spiral shell, foam) or sheet hybrids (felt sheets arranged as a leaf canopy, mushroom gills, pine cone or twisted lamellae), or the Sound-grown membrane after Biothing's Genware (a sound source, either the target sound, an uploaded recording or a room's resonances, becomes a field of air motion; a cellular felt membrane grows denser where air moves most and the field is updated by what has grown over three rounds). A seed library keeps genomes the designer likes and starts new growth from them (after Malafouris's essay on Genware as a "library of seeds" changed by what grows); it can be saved and loaded at the next venue. Further ideas from Andrasek's AA lecture "Material Potency": the Interference cut-sheet (after her New Museum ceiling, where wave interference was cut into flat laser-cut sheets that gravity bent into 3D): one flat felt sheet with three-sided flap cuts, larger and more open where the room's sound field is strong; each flap sags under its own weight depending on the felt's density and thickness (top hinges sag, side hinges hold), and it exports an SVG cut file. "Grow a speech skin": a second, finer growth of felt tufts on a grown form, drawn by the speech-band sound (one behaviour grown on another, like her tower and its skin). "Grow 6 variants": a family whose genes move within brackets of elasticity around the parent, all different but one nature, like dunes in one desert. "Where pieces help most": a probability map of the room plan (low pitches: room standing waves at ear height, since felt works where air moves; speech: a band 0.4-1.6 m from the walls) from which layouts A, B, C are drawn by chance, after her tower project's probabilistic programme. Positions do not change the Sabine echo numbers. When asked about Biothing, explain simply: grow, don't draw; simple local rules give rich results; differentiation within one nature; material computation; the environment steers growth; a garden of seeds; the designer guides like a gardener. Everything is tested in a 2D wave simulator that reads about 25% conservative. Everything happens in one Studio mode around the selected room (a ready-made room or the user's OBJ model): it is shown in 3D, structures are grown and placed in it, and its echo and crowd noise update. The target "This room's needs" weights each pitch by how much the room rings too long there. A Materials tab compares materials. The person is a designer, not an acoustic engineer.
How to answer:
- Simple, everyday words; explain any technical word in a few words the first time.
- Short: at most about 120 words unless asked for more. Short paragraphs or a few bullets.
- Refer to what is on their screen (workspace, toolbar, options bar, panels: Properties, Layers, Materials, Spaces, Absorbers) and say which control to use.
- The numbers come from simplified physics (porous-material, resonator and tube models; Sabine reverberation). Good for comparing ideas; real objects and rooms should be tested. Mention this only when it matters.
- Answer in the language the person writes in.`;
function pageState() {
  const lines = [`Workspace: ${state.ws === "grow" ? `Studio (one mode: the selected room in 3D, generators, placement), tool ${state.gtool}` : state.ws}`, `Target: ${TARGET_INFO[state.target].label} (${TARGET_INFO[state.target].example})`,
    `Soft materials: ${[...state.porous].map((k) => E.FELTS[k].name).join(", ") || "none"}`,
    `Hard materials: ${[...state.rigid].map((k) => E.RIGIDS[k].name).join(", ")}`,
  ];
  if (gmode() === "shapes" && state.tool !== "all") lines.push(`Inspecting: ${E.FAMILY[state.tool].name}`);
  lines.push(`Sound source for membranes: ${gwLabel()}${state.gw.field ? " (field computed)" : ""}${state.gw.file ? `; file ${state.gw.file.name}, ${Math.round(state.gw.file.bpm)} BPM` : ""}; seed library: ${Object.entries(state.seeds).map(([k, l]) => `${l.length} ${k}`).join(", ") || "empty"}`);
  lines.push(`Forms settings: ${state.fMount === "standing" ? "freestanding" : "hanging"}, size ${state.fSize} m, material per piece ${state.fBudget} kg, rule ${state.fRule}; material choice: ${state.matPick === "auto" ? "best of the ticked materials" : E.FELTS[state.matPick].name}`);
  for (const f of state.forms) lines.push(`- ${f.kind === "surface" ? "Surface texture as a freestanding screen" : "Free form"} "${f.name}"${f.id === state.formSel ? " (selected)" : ""}: ${f.mount}, ${describeOf(f)} ${E.FELTS[f.material].name}, ${fix(f.mass, 1)} kg; absorption ${f.area.map((a) => fix(a, 2)).join("/")} m2 at 250/500/1000 Hz; ${fix(f.perKg, 2)} m2 per kg${f.stance ? `; freestanding on ${stanceText(f)}, tips at ${fix(f.stance.angle, 0)} degrees (${f.stance.ok ? "stable" : "unstable"})` : ""}${f.baseline ? `; flat panel with the same kg: ${f.baseline.map((a) => fix(a, 2)).join("/")} m2` : ""}`);
  for (const f of state.forms) {
    if (f.cutPlan) lines.push(`  "${f.name}" cut-sheet: ${f.cutPlan.flaps} flaps, ${fix(f.cutPlan.cutLength, 1)} m of cuts, ${Math.round(f.cutPlan.t * 1000)} mm felt, ${f.cutPlan.side ? "side" : "top"} hinges, flaps close ${pct(f.cutPlan.droop)} under their weight`);
    if (f.skin) lines.push(`  "${f.name}" has a speech skin of ${f.skinCount} felt tufts`);
    if (state.families[f.id]) lines.push(`  "${f.name}" has a family of ${state.families[f.id].ids.length} variants (±${Math.round(state.families[f.id].elasticity * 100)}%)`);
  }
  const lsp = curSpace(), lay = lsp && roomLayout(lsp);
  if (lay && lay.spots.length) lines.push(`Room layout ${"ABC"[lsp.layoutOpt || 0]} in ${lsp.name}: ${lay.spots.length} pieces placed from the probability map, ${fix(lay.gain, 2)}x better spots than an even spread`);
  if (state.ranking) lines.push(`Material ranking for ${E.FAMILY[state.ranking.family].name}: ${state.ranking.rows.map((r) => `${E.FELTS[r.params.porous].name} ${pct(r.score)}`).join(", ")}`);
  for (const s of state.spaces) {
    const { res } = spaceCalc(s);
    lines.push(`Space "${s.name}"${s.id === state.spaceId ? " (selected)" : ""}: ${fix(spaceVolume(s), 0)} m3, floor ${R.SURFACES[s.finishes.floor].name}, walls ${R.SURFACES[s.finishes.wall].name}, ceiling ${R.SURFACES[s.finishes.ceiling].name}, ${s.people} visitors; reverberation 500-1000 Hz now ${fix(res.speechRtBefore, 2)} s, with absorbers ${fix(res.speechRtAfter, 2)} s, recommended ${fix(res.target, 2)} s; absorbers: ${s.placements.map((p) => `${p.area} ${isForm(p.family) ? "pieces" : "m2"} ${plName(p.family)}`).join(", ") || "none"}; crowd noise drop ${fix(Math.max(0, res.noiseDrop), 1)} dB`);
  }
  return lines.join("\n");
}
let sample = null, turns = [], ctl = null;
const ERR = { not_granted: "The guide needs your permission to use Claude. Everything else keeps working.", sampling_disabled: "Claude is not available for this account here.",
  rate_limited: "Too many questions at once. Wait a moment, then ask again.", session_expired: "Please sign in to Claude again.", refused: "The guide could not answer that. Try asking differently.",
  empty_completion: "No answer came back. Try a simpler question.", prompt_too_large: "That was too much at once. Ask a shorter question." };
function addMsg(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls; el.textContent = text;
  $("#log").append(el); $("#log").scrollTop = $("#log").scrollHeight;
  return el;
}
async function ask(q) {
  q = (q || "").trim();
  if (!q) return;
  if (!sample) { addMsg("note", "The live guide is not available in this view. Open the page on claude.ai to ask questions."); return; }
  if (ctl) return;
  addMsg("user", q); turns.push({ role: "user", content: q });
  const bubble = addMsg("bot", "Thinking…");
  ctl = new AbortController(); $("#ask-stop").hidden = false; $("#ask-send").disabled = true;
  try {
    const { text } = await sample([{ role: "user", content: RULES + "\n\nWhat the person currently sees:\n" + pageState() },
      { role: "assistant", content: "Understood. I will guide them simply." }, ...turns.slice(-8)],
      { cache: false, signal: ctl.signal, onText: ({ text: t }) => { bubble.textContent = t; $("#log").scrollTop = $("#log").scrollHeight; } });
    turns.push({ role: "assistant", content: text });
  } catch (e) {
    const code = e && e.code;
    bubble.textContent = code === "refused" ? "" : (e && e.text) || "";
    if (!bubble.textContent) bubble.remove();
    if (code !== "cancelled") addMsg("note", ERR[code] || "Something interrupted the answer. Try again.");
    turns.pop();
    if (code === "not_granted" || code === "sampling_disabled") sample = null;
  } finally { ctl = null; $("#ask-stop").hidden = true; $("#ask-send").disabled = false; }
}
$("#ask-form").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#ask-input").value; $("#ask-input").value = ""; ask(q); });
$("#ask-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ask-form").requestSubmit(); } });
$("#ask-stop").addEventListener("click", () => ctl && ctl.abort());

const TOUR = [
  { ws: "grow", tool: "all", sel: "#ws-tabs", title: "One studio", text: "Everything happens here: the room, the generators and what you place. Materials is a library to compare materials." },
  { ws: "grow", tool: "all", sel: "#opt-room", title: "1. Choose the room", text: "Pick one of your rooms, add a ready-made one, or import your own 3D model (.obj) of an exhibition area." },
  { ws: "grow", tool: "all", sel: "#room-zone", title: "2. See the room", text: "The room in 3D, its echo now and with what you placed, and the recommended echo for talking. Drag to orbit." },
  { ws: "grow", tool: "all", sel: "#opt-target", title: "3. Grow for this room", text: "“This room's needs” weights each pitch by how much the room rings too long, so the structures answer the environment. Pick the material next to it." },
  { ws: "grow", tool: "all", sel: "#tools", title: "4. Generators", text: "Surface textures (as freestanding screens), natural growth, felt-sheet hybrids and the sound-grown membrane. The room view tools are at the bottom." },
  { ws: "grow", tool: "all", sel: "#opt-mount", title: "5. Freestanding", text: "Structures grow a holdfast and must lean at least 10° before toppling. Set the size and the budget per piece, then press Grow." },
  { ws: "grow", tool: "all", sel: "#panel-absorbers", title: "6. Place in the room", text: "Open a grown structure and press “Place in this room”: the lab adds as many pieces as the room needs and the 3D view and echo update." },
  { ws: "grow", tool: "membrane", sel: "#panel-sound", title: "7. Sound draws the form", text: "After Biothing's Genware: the room's own resonances (or a recording) can grow a membrane, or cut the flaps of an interference cut-sheet." },
  { ws: "grow", tool: "all", sel: "#room-map-card", title: "8. Where pieces go", text: "A map of the room shows where pieces help most. Layouts A, B and C are drawn from it by chance: proposals to choose from." },
  { ws: "materials", sel: "#panel-materials", title: "9. Materials library", text: "Tick what you are happy to use. The chart compares each material as a plain flat layer." },
  { ws: "grow", tool: "all", sel: "#panel-guide", title: "10. Ask me", text: "I'm here the whole time. Ask anything, in your own words." },
];
let tourAt = -1;
function tour(i) {
  $$(".tour-focus").forEach((x) => x.classList.remove("tour-focus"));
  const box = $("#tour");
  if (i < 0 || i >= TOUR.length) { box.hidden = true; tourAt = -1; return; }
  tourAt = i;
  const step = TOUR[i];
  if (state.ws !== step.ws) setWorkspace(step.ws);
  if (step.tool && state.gtool !== step.tool) setTool(step.tool);
  const target = $(step.sel);
  box.innerHTML = `<span class="kicker">Guided tour · ${i + 1} of ${TOUR.length}</span><h3>${step.title}</h3><p>${step.text}</p>
    <div class="row"><button class="btn small ghost" id="tour-end">Close</button><span><button class="btn small" id="tour-back" ${i === 0 ? "disabled" : ""}>Back</button>
    <button class="btn small primary" id="tour-next">${i === TOUR.length - 1 ? "Finish" : "Next"}</button></span></div>`;
  box.hidden = false;
  $("#tour-end").onclick = () => tour(-1); $("#tour-back").onclick = () => tour(i - 1); $("#tour-next").onclick = () => tour(i + 1);
  if (target) {
    target.classList.add("tour-focus");
    target.scrollIntoView({ block: "nearest" });
    const r = target.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight;
    let top = r.bottom + 10, left = Math.min(Math.max(16, r.left), innerWidth - bw - 16);
    if (top + bh > innerHeight - 10) top = Math.max(10, r.top - bh - 10);
    if (r.left > innerWidth * 0.6) left = Math.max(16, r.left - bw - 12);
    box.style.top = top + "px"; box.style.left = left + "px";
  }
  $("#tour-next").focus();
}
$("#tour-start").onclick = () => tour(0);
$("#tour-start-2").onclick = () => tour(0);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && tourAt >= 0) tour(-1); });
addEventListener("resize", () => { if (tourAt >= 0) tour(tourAt); });

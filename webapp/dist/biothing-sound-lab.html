  sheep_wool_batt: 0xefe6d2, hemp_fibre: 0xc8b48a, coconut_coir: 0x8a5a33, cork_granulate: 0xa8743f, cellulose_fibre: 0xd9d6cf,
  wood_wool: 0xd8bf8c, mycelium: 0xefe9dc, mineral_wool: 0xc9b45a, melamine_foam: 0xf4f4f2,
};
const HARD_COLORS = { rigid_pet: 0x3e4650, birch_plywood: 0xd9b98a, solid_cardboard: 0xa9825a, pla_print: 0xe9efe6, fired_clay: 0xb4583a };
const hex = (n) => "#" + n.toString(16).padStart(6, "0");

// An orbit viewer: drag to orbit, wheel or pinch to zoom. `up` is the scene's vertical axis.
function makeViewer({ up = "z", hud = "Drag to orbit · scroll or pinch to zoom", cls = "viewport" } = {}) {
  const el = document.createElement("div");
  el.className = cls;
  const v = { el, ok: !!T3, root: null, orbit: { theta: -0.9, phi: 1.05, dist: 3, target: [0, 0, 0] } };
  if (!T3) { el.innerHTML = '<div class="fallback">The 3D view could not load here. Everything else still works.</div>'; v.draw = () => {}; return v; }
  const renderer = new T3.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setClearColor(0x0f1012);
  el.appendChild(renderer.domElement);
  el.insertAdjacentHTML("beforeend", `<div class="hud">${hud}</div>`);
  const scene = new T3.Scene(), camera = new T3.PerspectiveCamera(40, 1, 0.01, 3000);
  if (up === "z") camera.up.set(0, 0, 1);
  scene.add(new T3.HemisphereLight(0xffffff, 0x404048, 0.65));
  const sun = new T3.DirectionalLight(0xffffff, 0.8);
  sun.position.set(up === "z" ? 3 : 2, up === "z" ? -2 : 3, up === "z" ? 6 : 4);
  scene.add(sun);
  v.root = new T3.Group();
  scene.add(v.root);
  let raf = 0;
  v.draw = () => {
    if (!el.isConnected) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const w = el.clientWidth, h = el.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
      const o = v.orbit, [tx, ty, tz] = o.target, s = Math.sin(o.phi), c = Math.cos(o.phi);
      if (up === "z") camera.position.set(tx + o.dist * s * Math.cos(o.theta), ty + o.dist * s * Math.sin(o.theta), tz + o.dist * c);
      else camera.position.set(tx + o.dist * s * Math.sin(o.theta), ty + o.dist * c, tz + o.dist * s * Math.cos(o.theta));
      camera.lookAt(tx, ty, tz);
      sun.position.copy(camera.position).add(new T3.Vector3(up === "z" ? 0 : 1, up === "z" ? 0 : 2, up === "z" ? 3 : 0));
      renderer.render(scene, camera);
    });
  };
  v.clear = () => {
    const kill = (o) => { o.children.slice().forEach(kill); if (o.geometry) o.geometry.dispose(); if (o.material) [].concat(o.material).forEach((m) => m.dispose()); };
    v.root.children.slice().forEach((ch) => { kill(ch); v.root.remove(ch); });
  };
  const zoom = (f) => { v.orbit.dist = Math.min(800, Math.max(0.05, v.orbit.dist * f)); v.draw(); };
  const cv = renderer.domElement, pts = new Map();
  let last = null, pinch = 0;
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); last = [e.clientX, e.clientY]; });
  cv.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) zoom(pinch / d); pinch = d; return; }
    v.orbit.theta -= (e.clientX - last[0]) * 0.008;
    v.orbit.phi = Math.min(Math.PI - 0.08, Math.max(0.08, v.orbit.phi - (e.clientY - last[1]) * 0.008));
    last = [e.clientX, e.clientY]; v.draw();
  });
  const upEv = (e) => { pts.delete(e.pointerId); pinch = 0; };
  cv.addEventListener("pointerup", upEv); cv.addEventListener("pointercancel", upEv);
  cv.addEventListener("wheel", (e) => { e.preventDefault(); zoom(Math.exp(e.deltaY * 0.001)); }, { passive: false });
  new ResizeObserver(() => v.draw()).observe(el);
  return v;
}

// Spaces: the room and its absorbers (z up, metres).
const View3D = (() => {
  let v = null, space = null;
  function buildRoom(sp) {
    const look = { floor: [0x6f737a, 0.95], wall: [0xb9bdc4, 0.22], ceiling: [0xd4d7dc, 0.1] };
    for (const tag of ["floor", "wall", "ceiling"]) {
      const pos = [];
      sp.mesh.tris.forEach((t, i) => { if (sp.mesh.tags[i] === tag) for (const p of t) pos.push(...p); });
      if (!pos.length) continue;
      const g = new T3.BufferGeometry(); g.setAttribute("position", new T3.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
      const [color, opacity] = look[tag];
      v.root.add(new T3.Mesh(g, new T3.MeshLambertMaterial({ color, transparent: opacity < 1, opacity, side: T3.DoubleSide, depthWrite: opacity >= 1 })));
      v.root.add(new T3.LineSegments(new T3.EdgesGeometry(g, 25), new T3.LineBasicMaterial({ color: 0x8a8f98 })));
    }
  }
  function buildAbsorbers(sp) {
    if (!state.showAbs) return;
    const { min, max } = sp.info, W = max[0] - min[0], D = max[1] - min[1], H = max[2] - min[2], panel = 1.2;
    for (const pl of sp.placements) {
      if (isForm(pl.family)) {
        const f = formOf(pl.family);
        if (!f || pl.area <= 0) continue;
        const n = Math.max(1, Math.min(Math.round(pl.area), Math.floor(60000 / Math.max(1, f.prims.length / 7)))), step = f.size * 1.4;
        const cols = Math.max(1, Math.floor((W - step) / step) + 1), spots = [];
        for (let k = 0; k < n; k++) {
          const i = k % cols, j = Math.floor(k / cols);
          const x = min[0] + (W - (cols - 1) * step) / 2 + i * step, y = min[1] + step / 2 + 0.5 + j * step;
          spots.push([x, Math.min(y, max[1] - step / 2), f.mount === "hanging" ? max[2] - 0.3 : min[2]]);
        }
        formInstances(f, spots, v.root);
        continue;
      }
      const r = current(pl.family);
      if (!r || pl.area <= 0) continue;
      const n = Math.min(400, Math.ceil(pl.area / (panel * panel))), depth = Math.max(0.03, r.params.depth / 1000);
      const color = r.params.porous ? SOFT_COLORS[r.params.porous] : HARD_COLORS[r.params.rigid];
      const mat = new T3.MeshStandardMaterial({ color, roughness: 0.9 });
      if (isHang(pl.family)) {
        const cols = Math.max(1, Math.round(Math.sqrt((n * W) / D))), rows = Math.ceil(n / cols);
        for (let k = 0; k < n; k++) {
          const m = new T3.Mesh(new T3.BoxGeometry(panel, panel, depth), mat);
          m.position.set(min[0] + ((k % cols + 0.5) / cols) * W, min[1] + ((Math.floor(k / cols) + 0.5) / rows) * D, min[2] + H * 0.82);
          v.root.add(m);
        }
        continue;
      }
      // Panels in rows along each wall, kept clear of the corners, filled from 1.4 m up.
      const gap = 0.2, pitch = panel + gap;
      const walls = [
        { len: W, at: (t) => [min[0] + t, min[1] + depth / 2], rot: 0 },
        { len: D, at: (t) => [max[0] - depth / 2, min[1] + t], rot: Math.PI / 2 },
        { len: W, at: (t) => [max[0] - t, max[1] - depth / 2], rot: 0 },
        { len: D, at: (t) => [min[0] + depth / 2, max[1] - t], rot: Math.PI / 2 },
      ].map((w) => ({ ...w, slots: Math.max(1, Math.floor((w.len - 0.3 + gap) / pitch)) }));
      const rowsMax = Math.max(1, Math.floor((H - 1.4 - 0.2 + 0.15) / (panel + 0.15)));
      let placed = 0;
      for (let row = 0; row < rowsMax && placed < n; row++) {
        for (const w of walls) {
          const start = (w.len - (w.slots * pitch - gap)) / 2 + panel / 2;
          for (let k = 0; k < w.slots && placed < n; k++, placed++) {
            const [x, y] = w.at(start + k * pitch);
            const m = new T3.Mesh(new T3.BoxGeometry(panel, depth, panel), mat);
            m.position.set(x, y, min[2] + 1.4 + panel / 2 + row * (panel + 0.15)); m.rotation.z = w.rot;
            v.root.add(m);
          }
        }
      }
    }
  }
  function rebuild() { v.clear(); buildRoom(space); buildAbsorbers(space); }
  function frame(sp) {
    const { min, max } = sp.info;
    Object.assign(v.orbit, { theta: -0.9, phi: 1.05, target: [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 3],
      dist: Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]) * 1.35 });
  }
  return {
    attach(slot, sp) {
      if (!v) v = makeViewer({ up: "z" });
      slot.replaceWith(v.el);
      if (!v.ok) return;
      const changed = space !== sp;
      space = sp;
      rebuild();
      if (changed) frame(sp);
      v.draw();
    },
    detach() { if (v && v.el.isConnected) v.el.remove(); },
    update() { if (v && v.ok && space) { rebuild(); v.draw(); } },
    preset(k) {
      if (!v || !v.ok || !space) return;
      if (k === "top") Object.assign(v.orbit, { phi: 0.08, theta: -Math.PI / 2 }); else frame(space);
      v.draw();
    },
  };
})();

// Shapes: one 600 x 600 mm module of the grown shape (y up, metres; wall at z = 0, room towards +z).
// The front of resonators, coils and the moss layer is cut away on the left half to show the inside.
const ShapeView = (() => {
  let v = null, shown = null;
  const TILE = 0.6;
  function hashf(i, j, k) { const x = Math.sin(i * 127.1 + j * 311.7 + k * 74.7) * 43758.5453; return x - Math.floor(x); }
  const mat = (color, extra = {}) => new T3.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0, ...extra });
  function box(w, h, d, x, y, z, m) { const b = new T3.Mesh(new T3.BoxGeometry(w, h, d), m); b.position.set(x, y, z); v.root.add(b); return b; }
  // Instanced cubes: cells [[x, y, z, sx, sy, sz], ...]
  function cubes(cells, m) {
    if (!cells.length) return;
    const inst = new T3.InstancedMesh(new T3.BoxGeometry(1, 1, 1), m, cells.length), o = new T3.Object3D();
    cells.forEach(([x, y, z, sx, sy, sz], i) => { o.position.set(x, y, z); o.scale.set(sx, sy, sz); o.updateMatrix(); inst.setMatrixAt(i, o.matrix); });
    v.root.add(inst);
  }
  // A porous block made of voxels: fractions[i] is the solid share of slice i (front first).
  function sponge(fractions, zFront, thick, m, { cutLeft = false, n = 20, axis = "z", y0 = 0 } = {}) {
    const cell = TILE / n, dz = thick / fractions.length, cells = [];
    fractions.forEach((s, k) => {
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if (cutLeft && i < n / 2) continue;
        if (hashf(i, j, k) >= s) continue;
        const a = (i + 0.5) * cell, b = (j + 0.5) * cell, c = zFront - (k + 0.5) * dz;
        cells.push(axis === "z" ? [a, b, c, cell * 0.92, cell * 0.92, dz * 0.92] : [a, y0 + c, b, cell * 0.92, dz * 0.92, cell * 0.92]);
      }
    });
    cubes(cells, m);
  }
  function wall() {
    box(TILE + 0.12, TILE + 0.12, 0.01, TILE / 2, TILE / 2, -0.005, mat(0x55585e));
  }
  // Perforated plate at z in [z0, z0 + t] with dark discs for the holes; only the right half when cut.
  function plate(z0, t, holeMm, porosity, hardColor, cutLeft) {
    const d = holeMm / 1000, spacing = Math.max(d * Math.sqrt(Math.PI / (4 * porosity)), 0.012), n = Math.min(60, Math.floor(TILE / spacing));
    const x0 = cutLeft ? TILE / 2 : 0, w = TILE - x0;
    box(w, TILE, t, x0 + w / 2, TILE / 2, z0 + t / 2, mat(hardColor));
    const disc = new T3.CylinderGeometry(Math.max(d, 0.003) / 2, Math.max(d, 0.003) / 2, 0.002, 12);
    disc.rotateX(Math.PI / 2);
    const holes = [];
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const x = (i + 0.5) * (TILE / n), y = (j + 0.5) * (TILE / n);
      if (x >= x0) holes.push([x, y]);
    }
    const inst = new T3.InstancedMesh(disc, mat(0x15161a), holes.length), o = new T3.Object3D();
    holes.forEach(([x, y], i) => { o.position.set(x, y, z0 + t + 0.0008); o.updateMatrix(); inst.setMatrixAt(i, o.matrix); });
    v.root.add(inst);
  }
  function partitions(depth, spacing, hardColor, x0 = 0) {
    const m = mat(hardColor), n = Math.round(TILE / spacing);
    for (let k = 0; k <= n; k++) {
      const p = k * (TILE / n);
      if (p >= x0 - 1e-9) box(0.003, TILE, depth, p, TILE / 2, depth / 2, m);
      box(TILE - x0, 0.003, depth, x0 + (TILE - x0) / 2, p, depth / 2, m);
    }
  }
  const builders = {
    spikes(p) {
      const soft = mat(SOFT_COLORS[p.porous]), D = p.depth / 1000, taper = 1 - p.base, pitch = TILE / 6;
      if (p.base > 0) box(TILE, TILE, D * p.base, TILE / 2, TILE / 2, (D * p.base) / 2, soft);
      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const z = D * p.base + (D - D * p.base) * (i / 24), t = 1 - z / D;
        const s = taper > 0 ? (t >= taper ? 1 : Math.pow(t / taper, p.taper)) : 1;

      }
      const g = new T3.LatheGeometry(pts, 4);
      g.rotateX(Math.PI / 2); g.rotateZ(Math.PI / 4); g.computeVertexNormals();

        const m = new T3.Mesh(g, soft); m.position.set((i + 0.5) * pitch, (j + 0.5) * pitch, 0); v.root.add(m);
      }
      return "Spikes on a 100 mm grid";
    },
    sponge(p, r) {
      const soft = mat(SOFT_COLORS[p.porous]), D = p.depth / 1000, ds = D * (1 - p.gap);
      sponge(r.extra.fractions, D, ds, soft);
      if (p.gap > 0.02) for (const [x, y] of [[0.1, 0.1], [0.5, 0.1], [0.1, 0.5], [0.5, 0.5]]) box(0.012, 0.012, D * p.gap, x, y, (D * p.gap) / 2, mat(0x888b91));
      return p.gap > 0.02 ? `Sponge on small spacers, ${mm(p.depth * p.gap)} off the wall` : "Sponge against the wall";
    },
    cloud(p, r) {
      const soft = mat(SOFT_COLORS[p.porous]), D = p.depth / 1000, hang = 0.35;
      sponge(r.extra.fractions, hang + D, D, soft, { axis: "y" });
      for (const [x, z] of [[0.1, 0.1], [0.5, 0.1], [0.1, 0.5], [0.5, 0.5]]) box(0.002, TILE * 0.4, 0.002, x, hang + D + TILE * 0.2, z, mat(0xbfc3c9));

    },
    bottles(p) {
      const hard = HARD_COLORS[p.rigid], D = p.depth / 1000, cellSize = 0.1, n = 6, soft = mat(SOFT_COLORS[p.porous]);
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        const d = (i + j) % 2 ? D * p.ratio : D, x = (i + 0.5) * cellSize, y = (j + 0.5) * cellSize;

        if (p.fill > 0.01) box(cellSize * 0.96, cellSize * 0.96, d * p.fill, x, y, D - (d * p.fill) / 2, soft);

      plate(D, p.plate / 1000, p.hole, p.porosity, hard, true);
      return "Plate cut away on the left to show the cavities";
    },
    coil(p, r) {
      const hard = mat(HARD_COLORS[p.rigid]), D = p.depth / 1000, a = Math.max(p.cell / 1000, 0.02), w = p.width / 1000, wall2 = 0.002;
      const n = Math.max(1, Math.floor(TILE / a)), size = TILE / n, lens = r.extra.lengths;

          const front = k % 2 === 1, len = D - w;
          box(size, wall2, len, x0 + size / 2, y0 + k * lane, front ? len / 2 : w + len / 2, hard);
        }

          box(size, size - lane, wall2, x0 + size / 2, y0 + lane + (size - lane) / 2, D + wall2 / 2, hard);
        }

    },
    hybrid(p, r) {
      const hard = HARD_COLORS[p.rigid], D = p.depth / 1000, cav = r.extra.cavity, t = p.plate / 1000;
      partitions(cav, 0.1, hard);
      plate(cav, t, p.hole, p.porosity, hard, false);
      sponge(r.extra.fractions, D, D * p.front, mat(SOFT_COLORS[p.porous]), { cutLeft: true });

    },
  };
  function build(key, r) {
    v.clear();
    if (key !== "cloud") wall();
    const note = builders[key](r.params, r);
    const D = r.params.depth / 1000, h = key === "cloud" ? 0.35 + D + TILE * 0.4 : TILE;
    Object.assign(v.orbit, key === "cloud" ? { target: [TILE / 2, h / 2, TILE / 2], dist: 1.3, theta: 0.7, phi: 1.2 }
      : { target: [TILE / 2, TILE / 2, D / 2], dist: 1.05, theta: -0.8, phi: 1.0 });

  }

    show(slot, key, r) {

      slot.replaceWith(v.el);
      if (!v.ok) return "";
      const sig = key + JSON.stringify(r.params);
      if (shown !== sig) { shown = sig; v.note = build(key, r); }

    detach() { if (v && v.el.isConnected) v.el.remove(); },
  };

// ----------------------------------------------------------------- forms ---
// "Forms": free objects grown by natural rules (hanging or standing), tested in a wave simulator.
const G = window.Growth;
const RULE_KEYS = Object.keys(G.RULES);
Object.assign(ICONS, {
  tree: '<path d="M10 18 V10 M10 10 L5 5 M10 10 L15 5 M5 5 L3 2 M5 5 L7 2 M15 5 L13 2 M15 5 L17 2"/>',
  snow: '<path d="M10 2 V18 M3 6 L17 14 M3 14 L17 6 M10 5 L8 3 M10 5 L12 3 M10 15 L8 17 M10 15 L12 17"/>',
  coral: '<path d="M2 11 C5 7 7 15 10 11 C13 7 15 15 18 11 M10 11 V18"/>',
  shell: '<path d="M10 10 m0 -1 a1 1 0 1 0 1 1 a2.5 2.5 0 1 0 -2.5 2.5 a4.5 4.5 0 1 0 4.5 -4.5 a7 7 0 1 0 -7 7"/>',
  foam: '<circle cx="7" cy="7" r="3"/><circle cx="13" cy="9" r="2.2"/><circle cx="9" cy="13.5" r="2.6"/><circle cx="15" cy="15" r="1.6"/>',
});
const isForm = (key) => typeof key === "string" && key.startsWith("form:");
const formOf = (key) => state.forms.find((f) => "form:" + f.id === key);
const selForm = () => state.forms.find((f) => f.id === state.formSel) || null;
const formBandWeights = () => { const t = E.TARGETS[state.target], w = G.BANDS.map((b) => t[b] || 0), s = w.reduce((a, b) => a + b, 0) || 1; return w.map((x) => x / s); };
// Absorption per object per octave 125-4000 Hz. Only 250-1000 Hz are simulated; 125 Hz is taken as half
// of 250 Hz and the bands above 1 kHz as equal to 1 kHz (porous forms rarely absorb less up there).
const formOct = (f) => [f.area[0] * 0.5, f.area[0], f.area[1], f.area[2], f.area[2], f.area[2]];
const primsOf = (flat) => { const out = []; for (let i = 0; i < flat.length; i += 7) out.push({ a: [flat[i], flat[i + 1], flat[i + 2]], b: [flat[i + 3], flat[i + 4], flat[i + 5]], r: flat[i + 6] }); return out; };
const flatPrims = (prims) => { const f = new Float32Array(prims.length * 7); prims.forEach((p, i) => f.set([...p.a, ...p.b, p.r], i * 7)); return f; };
const baselineScore = (f) => (f.baseline ? f.baseline.reduce((a, x, i) => a + x * formBandWeights()[i], 0) : null);

// Simulations run in background workers so the page stays responsive; inline if workers are unavailable.
const Pool = (() => {
  let workers = null, idle = [], next = 1;
  const queue = [], pending = new Map();
  const glue = `
self.onmessage = (e) => {
  const { id, kind, job } = e.data;
  try {
    let r;
    if (kind === "baseline") r = { area: Growth.panelBaseline(job) };
    else { r = Growth.evaluate(job); const f = new Float32Array(r.prims.length * 7); r.prims.forEach((p, i) => f.set([p.a[0], p.a[1], p.a[2], p.b[0], p.b[1], p.b[2], p.r], i * 7)); r.prims = f; }
    postMessage({ id, r });
  } catch (err) { postMessage({ id, error: String((err && err.message) || err) }); }
};`;
  function init() {
    if (workers) return;
    workers = [];
    try {
      const url = URL.createObjectURL(new Blob([$("#growth-src").textContent, glue], { type: "text/javascript" }));
      const n = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1));
      for (let i = 0; i < n; i++) {
        const w = new Worker(url);
        w.onmessage = (e) => {
          const task = pending.get(e.data.id);
          pending.delete(e.data.id); w.job = null; idle.push(w);
          if (task) e.data.error ? task.reject(new Error(e.data.error)) : task.resolve(e.data.r);
          pump();
        };
        w.onerror = (ev) => {
          ev.preventDefault();
          workers = workers.filter((x) => x !== w); idle = idle.filter((x) => x !== w);
          if (w.job) { pending.delete(w.job.id); queue.unshift(w.job); w.job = null; }
          pump();
        };
        workers.push(w); idle.push(w);
      }
    } catch (e) { workers = []; }
  }
  function inline(task) {
    setTimeout(() => {
      try {
        let r;
        if (task.kind === "baseline") r = { area: G.panelBaseline(task.job) };
        else { r = G.evaluate(task.job); r.prims = flatPrims(r.prims); }
        task.resolve(r);
      } catch (err) { task.reject(err); }
    }, 0);
  }
  function pump() {
    while (queue.length) {
      if (!workers.length) { inline(queue.shift()); continue; }
      const w = idle.shift();
      if (!w) return;
      const task = queue.shift();
      w.job = task; pending.set(task.id, task);
      w.postMessage({ id: task.id, kind: task.kind, job: task.job });
    }
  }
  return { run(kind, job) { init(); return new Promise((resolve, reject) => { queue.push({ id: next++, kind, job, resolve, reject }); pump(); }); } };
})();

async function growForms() {
  if (state.fGrowing) return;
  if (!state.porous.size) { addMsg("note", "Pick at least one soft material in the Materials workspace first."); return; }
  state.fGrowing = true; state.fProgress = 0;
  renderOptbar(); renderStatus();
  const rules = state.fRule === "all" ? RULE_KEYS : [state.fRule];
  const P = rules.length > 1 ? 10 : 14, GENS = rules.length > 1 ? 5 : 9, total = rules.length * (GENS + 1);
  const mats = [...state.porous], weights = formBandWeights(), rand = G.rng(97 + state.fSeed++ * 7919), made = [];
  let steps = 0;
  try {
    for (const rule of rules) {
      const n = G.geneCount(rule);
      let pop = Array.from({ length: P }, () => Array.from({ length: n }, rand)), best = null;
      for (let gen = 0; gen <= GENS; gen++) {
        const res = await Promise.all(pop.map((genes) => {
          const material = mats[Math.min(mats.length - 1, Math.floor(genes[n - 1] * mats.length))], m = E.FELTS[material];
          return Pool.run("evaluate", { rule, genes, mount: state.fMount, size: state.fSize, material: { sigma: m.sigma, density: m.density }, budget: state.fBudget, weights })
            .then((r) => ({ ...r, material }));
        }));
        for (const r of res) if (!best || r.fitness > best.fitness) best = r;
        state.fLive = best; state.fProgress = ++steps / total;
        if (state.ws === "forms") { renderFormsCanvas(); renderStatus(); }
        if (gen < GENS) pop = G.nextGeneration(pop, res.map((r) => r.fitness), rand);
      }
      made.push(addForm(best));
    }
  } catch (err) {
    addMsg("note", "The simulation stopped: " + err.message);
  } finally {
    state.fGrowing = false; state.fLive = null;
  }
  if (made.length) {
    const top = made.sort((a, b) => b.fitness - a.fitness)[0];
    state.formSel = top.id;
    addMsg("note", `Grown. ${made.length > 1 ? `Best rule: ${top.name}` : top.name}: ${fix(top.score, 2)} m² of absorption per piece. Watch the sound under the 3D view.`);
  }
  renderAll();
}
function addForm(r) {
  const same = state.forms.filter((f) => f.rule === r.rule).length;
  const f = { ...r, id: state.fNext++, name: `${G.RULES[r.rule].name} ${same + 1}`, baseline: null };
  state.forms.push(f);
  Pool.run("baseline", { material: { sigma: E.FELTS[f.material].sigma, density: E.FELTS[f.material].density }, mass: f.mass })
    .then((b) => { f.baseline = b.area; if (state.ws === "forms" && !state.fGrowing) { renderFormsCanvas(); renderDock(); } })
    .catch(() => {});
  return f;
}

// A light OBJ: 8-sided tubes for branches, low-poly balls for spheres and joints. Metres, z up.
function formOBJ(f) {
  const v = [], faces = [];
  const tube = (a, b, r) => {
    const d = norm3(sub3(b, a)), u = Math.abs(d[2]) < 0.9 ? norm3(cross3(d, [0, 0, 1])) : norm3(cross3(d, [1, 0, 0])), w = cross3(d, u), base = v.length + 1;
    for (const c of [a, b]) for (let k = 0; k < 8; k++) { const t = (k / 8) * 2 * Math.PI; v.push(add3(c, add3(mul3(u, r * Math.cos(t)), mul3(w, r * Math.sin(t))))); }
    for (let k = 0; k < 8; k++) { const k2 = (k + 1) % 8; faces.push([base + k, base + k2, base + 8 + k2, base + 8 + k]); }
    faces.push([...Array(8).keys()].map((k) => base + 7 - k)); faces.push([...Array(8).keys()].map((k) => base + 8 + k));
  };
  const ball = (c, r) => {
    const base = v.length + 1, n = 8, m = 6;
    for (let i = 0; i <= m; i++) for (let j = 0; j < n; j++) {
      const th = (i / m) * Math.PI, ph = (j / n) * 2 * Math.PI;
      v.push([c[0] + r * Math.sin(th) * Math.cos(ph), c[1] + r * Math.sin(th) * Math.sin(ph), c[2] + r * Math.cos(th)]);
    }
    for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) { const j2 = (j + 1) % n; faces.push([base + i * n + j, base + (i + 1) * n + j, base + (i + 1) * n + j2, base + i * n + j2]); }
  };
  for (const p of primsOf(f.prims)) {
    if (Math.hypot(...sub3(p.b, p.a)) < 1e-6) ball(p.a, p.r); else { tube(p.a, p.b, p.r); if (p.r > 0.012) ball(p.b, p.r); }
  }
  return `# Biothing Sound Lab: ${f.name} (${G.RULES[f.rule].name}), ${f.mount}, metres, z up\n# material: ${E.FELTS[f.material].name}, ${fix(f.mass, 2)} kg\n`
    + v.map((p) => `v ${p[0].toFixed(4)} ${p[1].toFixed(4)} ${p[2].toFixed(4)}`).join("\n") + "\n" + faces.map((q) => "f " + q.join(" ")).join("\n") + "\n";
}
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm3 = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

// Instanced tubes and balls for a form, optionally repeated at several positions (Spaces).
function formInstances(f, positions, parent) {
  const prims = primsOf(f.prims), tubes = [], balls = [];
  for (const p of prims) {
    if (Math.hypot(...sub3(p.b, p.a)) < 1e-6) balls.push(p); else { tubes.push(p); if (p.r > 0.012) balls.push({ a: p.b, b: p.b, r: p.r }); }
  }
  const m = new T3.MeshStandardMaterial({ color: SOFT_COLORS[f.material], roughness: 0.95 }), o = new T3.Object3D(), up = new T3.Vector3(0, 1, 0);
  if (tubes.length) {
    const inst = new T3.InstancedMesh(new T3.CylinderGeometry(1, 1, 1, 8), m, tubes.length * positions.length);
    let i = 0;
    for (const off of positions) for (const p of tubes) {
      const a = new T3.Vector3(p.a[0] + off[0], p.a[1] + off[1], p.a[2] + off[2]), b = new T3.Vector3(p.b[0] + off[0], p.b[1] + off[1], p.b[2] + off[2]), d = b.clone().sub(a), L = d.length();
      o.position.copy(a).add(b).multiplyScalar(0.5); o.quaternion.setFromUnitVectors(up, d.normalize()); o.scale.set(p.r, L, p.r); o.updateMatrix(); inst.setMatrixAt(i++, o.matrix);
    }
    parent.add(inst);
  }
  if (balls.length) {
    const inst = new T3.InstancedMesh(new T3.SphereGeometry(1, 14, 10), m, balls.length * positions.length);
    let i = 0;
    o.quaternion.identity();
    for (const off of positions) for (const p of balls) { o.position.set(p.a[0] + off[0], p.a[1] + off[1], p.a[2] + off[2]); o.scale.set(p.r, p.r, p.r); o.updateMatrix(); inst.setMatrixAt(i++, o.matrix); }
    parent.add(inst);
  }
}

// 3D view of one form with its ceiling or floor, and a person for scale when it stands.
const FormView = (() => {
  let v = null, shown = null;
  function build(f) {
    v.clear();
    formInstances(f, [[0, 0, 0]], v.root);
    const S = f.size, H = G.envelope(S, f.mount).height, grey = new T3.MeshStandardMaterial({ color: 0x55585e, roughness: 1 });
    const slab = new T3.Mesh(new T3.BoxGeometry(S * 1.6, S * 1.6, 0.02), f.mount === "hanging" ? new T3.MeshStandardMaterial({ color: 0x55585e, roughness: 1, transparent: true, opacity: 0.55 }) : grey);
    slab.position.set(0, 0, f.mount === "hanging" ? 0.01 : -0.01);
    v.root.add(slab);
    if (f.mount === "standing") {
      const body = new T3.MeshStandardMaterial({ color: 0x8d9198, roughness: 1 }), x = S / 2 + 0.45;
      const part = (geo, z) => { const m = new T3.Mesh(geo, body); m.rotation.x = Math.PI / 2; m.position.set(x, 0, z); v.root.add(m); };
      part(new T3.CylinderGeometry(0.11, 0.09, 0.85, 12), 0.43);
      part(new T3.CylinderGeometry(0.16, 0.12, 0.65, 12), 1.18);
      const head = new T3.Mesh(new T3.SphereGeometry(0.11, 16, 12), body); head.position.set(x, 0, 1.62); v.root.add(head);
    }
    const midZ = f.mount === "hanging" ? -H / 2 : H / 2;
    Object.assign(v.orbit, { target: [f.mount === "standing" ? 0.25 : 0, 0, midZ], dist: Math.max(S, H) * 2.4, theta: -0.9, phi: f.mount === "hanging" ? 1.85 : 1.2 });
  }
  return {
    show(slot, f) {
      if (!v) v = makeViewer({ up: "z", cls: "viewport shape-view" });
      slot.replaceWith(v.el);
      if (!v.ok) return;
      const sig = f.id + ":" + f.fitness + ":" + f.prims.length;
      if (shown !== sig) { shown = sig; build(f); }
      v.draw();
    },
    detach() { if (v && v.el.isConnected) v.el.remove(); },
  };
})();

// Live wave animation: the same solver as the evaluation, on the slice through the middle of the form.
const FormWave = (() => {
  let sim = null, sig = "", raf = 0, cv = null, svg = null, ctx = null, img = null, peak = 0, curve = [], e0 = 0, tEnd = 0, room = null;
  function setup(f, band) {
    sig = f.id + ":" + band;
    const vox = G.voxelize(primsOf(f.prims), 343.2 / band / 6);
    room = G.roomFor(f.mount);
    sim = G.makeSim(G.slice(vox, 0, 0.5), E.FELTS[f.material].sigma, band, room, f.mount);
    peak = 0; curve = []; e0 = 0; tEnd = sim.burstEnd + 0.2;
  }
  function draw() {
    const { nx, nz, p, s } = sim, d = img.data;
    let frameMax = 0;
    for (let i = 0; i < p.length; i++) frameMax = Math.max(frameMax, Math.abs(p[i]));
    peak = Math.max(peak, frameMax, 1e-9); // fixed to the loudest moment, so the fading shows
    for (let k = 0; k < nz; k++) for (let i = 0; i < nx; i++) {
      const src = i + nx * k, dst = 4 * (i + nx * (nz - 1 - k)), val = p[src] / peak, a = Math.min(1, Math.sqrt(Math.abs(val)));
      let r = 16, g = 17, b = 20;
      if (val > 0) { r += (230 - r) * a; g += (162 - g) * a; b += (60 - b) * a; } else { r += (74 - r) * a; g += (144 - g) * a; b += (226 - b) * a; }
      const m = s[src] * 0.8;
      if (m > 0) { r += (91 - r) * m; g += (182 - g) * m; b += (124 - b) * m; }
      d[dst] = r; d[dst + 1] = g; d[dst + 2] = b; d[dst + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  function drawCurve() {
    if (!svg) return;
    const t0 = sim.burstEnd, X = (t) => 30 + ((t - t0) / (tEnd - t0)) * 262, Y = (db) => 10 + (-db / 30) * 110;
    let s = `<rect x="0" y="0" width="300" height="140" fill="var(--app)"/>`;
    for (const db of [0, -10, -20, -30]) s += `<line x1="30" x2="292" y1="${Y(db)}" y2="${Y(db)}" stroke="var(--line)"/><text x="26" y="${Y(db) + 4}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--mono)">${db}</text>`;
    s += `<line x1="30" x2="292" y1="${Y(0)}" y2="${Y(0)}" stroke="#8a8e96" stroke-dasharray="4 3"/><text x="290" y="${Y(0) - 4}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--sans)">empty room keeps ringing</text>`;
    if (curve.length > 1) s += `<polyline points="${curve.map(([t, db]) => `${X(t).toFixed(1)},${Y(Math.max(-30, db)).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--good)" stroke-width="2"/>`;
    s += `<text x="161" y="136" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--sans)">time → (dB below the start)</text>`;
    svg.innerHTML = s;
  }
  function loop() {
    if (!cv || !cv.isConnected || !sim) return;
    if (sim.t < tEnd) {
      sim.step(Math.max(1, Math.round(tEnd / sim.dt / 420)));
      if (sim.t > sim.burstEnd) {
        const e = sim.energy();
        if (!e0) e0 = e;
        curve.push([sim.t, 10 * Math.log10(Math.max(e / e0, 1e-9))]);
      }
    }
    draw(); drawCurve();
    if (sim.t < tEnd) raf = requestAnimationFrame(loop);
  }
  function bind() {
    cv = $("#wave-canvas"); svg = $("#wave-energy");
    if (!cv || !sim) return false;
    cv.width = sim.nx; cv.height = sim.nz; ctx = cv.getContext("2d"); img = ctx.createImageData(sim.nx, sim.nz);
    return true;
  }
  return {
    start(f, band) {
      if (f.id + ":" + band !== sig || !sim) setup(f, band);
      cancelAnimationFrame(raf);
      if (bind()) loop();
    },
    replay(f, band) { setup(f, band); cancelAnimationFrame(raf); if (bind()) loop(); },
    stop() { cancelAnimationFrame(raf); },
  };
})();

// ------------------------------------------------------------- status bar --
function renderStatus() {
  const s = $("#status");
  if (state.ws === "forms") {
    s.innerHTML = `${state.fGrowing ? `<span>Growing and testing</span><span class="progress"><i style="width:${state.fProgress * 100}%"></i></span>` : `<span>${state.forms.length} forms grown</span>`}
      <span>${state.fMount}</span><span class="mono">${fix(state.fSize, 1)} m · ${state.fBudget} kg</span><span>Wave simulator: 2D slices at 250, 500 and 1000 Hz</span>`;
    return;
  }
  if (state.ws === "spaces") {
    const sp = curSpace();
    s.innerHTML = sp ? `<span>${esc(sp.name)}</span><span class="mono">${fix(spaceVolume(sp), 0)} m³</span><span>Model: statistical (Sabine) reverberation, for comparing options</span>` : "<span>No space selected</span>";
    return;
  }
  const prog = state.growing ? `<span>Growing</span><span class="progress"><i style="width:${state.progress * 100}%"></i></span>` : `<span>${state.results ? "Grown" : "Seeds (not grown yet)"}</span>`;
  s.innerHTML = `${prog}<span>${TARGET_INFO[state.target].label}</span><span class="mono">${mm(state.depth)} · ${state.mass} kg/m²</span>
    <span>Soft layers catch well above ~${hz(E.quarterWave(state.depth))}</span><span>${state.porous.size} soft materials</span>`;
}

// ------------------------------------------------------------------ guide --
const TIPS = {
  shapes: { text: "Set what to quiet, the <strong>depth</strong> and the <strong>material budget</strong> in the bar above, then press <strong>Grow shapes</strong>. Pick any shape to inspect it.",
    chips: ["Why did this shape win?", "How deep should it be?", "How would I make it?"] },
  forms: { text: "Pick a <strong>growth rule</strong> in the toolbar, choose <strong>Hanging</strong> or <strong>Standing</strong>, then press <strong>Grow</strong>. Each candidate is tested with real sound waves.",
    chips: ["Which form works best?", "Why does thickness matter?", "How would I make this form?"] },
  materials: { text: "Tick the materials you like. The chart shows each one as a plain flat layer, so you see the material before any shaping.",
    chips: ["Which material is best for me?", "Explain the chart", "Which are the most natural?"] },
  spaces: { text: "Add your exhibition areas (or import a 3D model), set the finishes and visitors, then place grown shapes. Aim for the <strong>recommended</strong> echo.",
    chips: ["Is my space too echoey?", "How many m² do I need?", "Where should absorbers go?"] },
};
function renderGuideTip() {
  const t = TIPS[state.ws];
  $("#guide-tip").innerHTML = t.text;
  $("#ask-chips").innerHTML = t.chips.map((c) => `<button class="chip" type="button" data-ask="${esc(c)}">${esc(c)}</button>`).join("");
}
document.addEventListener("click", (e) => { const c = e.target.closest("[data-ask]"); if (c) ask(c.dataset.ask); });

const RULES = `You are the friendly guide inside "Biothing Sound Lab", a design tool laid out like a creative-suite app. It grows sound-absorbing shapes inspired by nature (after Alisa Andrasek's Biothing): panel-like shapes in the Shapes workspace, and free hanging or standing objects in the Forms workspace (grown by rules like branching trees, snow crystals, folding coral, spiral shells and foam, each tested in a 2D wave simulator that reads about 25% conservative). It also compares materials, and tests everything in 3D models of exhibition spaces. The person is a designer, not an acoustic engineer.
How to answer:
- Simple, everyday words; explain any technical word in a few words the first time.
- Short: at most about 120 words unless asked for more. Short paragraphs or a few bullets.
- Refer to what is on their screen (workspace, toolbar, options bar, panels: Properties, Layers, Materials, Spaces, Absorbers) and say which control to use.
- The numbers come from simplified physics (porous-material, resonator and tube models; Sabine reverberation). Good for comparing ideas; real objects and rooms should be tested. Mention this only when it matters.
- Answer in the language the person writes in.`;
function pageState() {
  const lines = [`Workspace: ${state.ws}`, `Target: ${TARGET_INFO[state.target].label} (${TARGET_INFO[state.target].example})`,
    `Depth: ${state.depth} mm (soft layers catch above ~${hz(E.quarterWave(state.depth))}); material budget ${state.mass} kg/m2; hanging allowed: ${state.hang ? "yes" : "no"}`,
    `Soft materials: ${[...state.porous].map((k) => E.FELTS[k].name).join(", ") || "none"}`,
    `Hard materials: ${[...state.rigid].map((k) => E.RIGIDS[k].name).join(", ")}`,
    state.results ? "Shapes (grown):" : "Shapes (seeds, not grown yet):"];
  for (const f of families()) { const r = current(f.key); if (r) lines.push(`- ${f.name}: ${scoreText(r)}; ${explain(r).join(" ")}`); }
  if (state.ws === "shapes" && state.tool !== "all") lines.push(`Inspecting: ${E.FAMILY[state.tool].name}`);
  lines.push(`Forms settings: ${state.fMount}, size ${state.fSize} m, material per piece ${state.fBudget} kg, rule ${state.fRule}`);
  for (const f of state.forms) lines.push(`- Form "${f.name}"${f.id === state.formSel ? " (selected)" : ""}: ${f.mount}, ${G.RULES[f.rule].describe(f.genes)} ${E.FELTS[f.material].name}, ${fix(f.mass, 1)} kg; absorption ${f.area.map((a) => fix(a, 2)).join("/")} m2 at 250/500/1000 Hz; ${fix(f.perKg, 2)} m2 per kg${f.baseline ? `; flat panel with the same kg: ${f.baseline.map((a) => fix(a, 2)).join("/")} m2` : ""}`);
  if (state.ranking) lines.push(`Material ranking for ${E.FAMILY[state.ranking.family].name}: ${state.ranking.rows.map((r) => `${E.FELTS[r.params.porous].name} ${pct(r.score)}`).join(", ")}`);
  for (const s of state.spaces) {
    const { res } = spaceCalc(s);
    lines.push(`Space "${s.name}"${s.id === state.spaceId ? " (selected)" : ""}: ${fix(spaceVolume(s), 0)} m3, floor ${R.SURFACES[s.finishes.floor].name}, walls ${R.SURFACES[s.finishes.wall].name}, ceiling ${R.SURFACES[s.finishes.ceiling].name}, ${s.people} visitors; reverberation 500-1000 Hz now ${fix(res.speechRtBefore, 2)} s, with absorbers ${fix(res.speechRtAfter, 2)} s, recommended ${fix(res.target, 2)} s; absorbers: ${s.placements.map((p) => `${p.area} ${isForm(p.family) ? "pieces" : "m2"} ${plName(p.family)}`).join(", ") || "none"}; crowd noise drop ${fix(Math.max(0, res.noiseDrop), 1)} dB`);
  }
  return lines.join("\n");
}
let sample = null, turns = [], ctl = null;
const ERR = { not_granted: "The guide needs your permission to use Claude. Everything else keeps working.", sampling_disabled: "Claude is not available for this account here.",
  rate_limited: "Too many questions at once. Wait a moment, then ask again.", session_expired: "Please sign in to Claude again.", refused: "The guide could not answer that. Try asking differently.",
  empty_completion: "No answer came back. Try a simpler question.", prompt_too_large: "That was too much at once. Ask a shorter question." };
function addMsg(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls; el.textContent = text;
  $("#log").append(el); $("#log").scrollTop = $("#log").scrollHeight;
  return el;
}
async function ask(q) {
  q = (q || "").trim();
  if (!q) return;
  if (!sample) { addMsg("note", "The live guide is not available in this view. Open the page on claude.ai to ask questions."); return; }
  if (ctl) return;
  addMsg("user", q); turns.push({ role: "user", content: q });
  const bubble = addMsg("bot", "Thinking…");
  ctl = new AbortController(); $("#ask-stop").hidden = false; $("#ask-send").disabled = true;
  try {
    const { text } = await sample([{ role: "user", content: RULES + "\n\nWhat the person currently sees:\n" + pageState() },
      { role: "assistant", content: "Understood. I will guide them simply." }, ...turns.slice(-8)],
      { cache: false, signal: ctl.signal, onText: ({ text: t }) => { bubble.textContent = t; $("#log").scrollTop = $("#log").scrollHeight; } });
    turns.push({ role: "assistant", content: text });
  } catch (e) {
    const code = e && e.code;
    bubble.textContent = code === "refused" ? "" : (e && e.text) || "";
    if (!bubble.textContent) bubble.remove();
    if (code !== "cancelled") addMsg("note", ERR[code] || "Something interrupted the answer. Try again.");
    turns.pop();
    if (code === "not_granted" || code === "sampling_disabled") sample = null;
  } finally { ctl = null; $("#ask-stop").hidden = true; $("#ask-send").disabled = false; }
}
$("#ask-form").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#ask-input").value; $("#ask-input").value = ""; ask(q); });
$("#ask-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ask-form").requestSubmit(); } });
$("#ask-stop").addEventListener("click", () => ctl && ctl.abort());

// ------------------------------------------------------------------- tour --
const TOUR = [
  { ws: "shapes", sel: "#ws-tabs", title: "Four workspaces", text: "Shapes grows panel-like absorbers, Forms grows free objects the way nature would, Materials compares materials, Spaces tests everything in 3D models of your exhibition areas." },
  { ws: "shapes", sel: "#opt-target", title: "1. What to quiet", text: "Choose the noise you care about. Exhibition mix balances voices and crowd." },
  { ws: "shapes", sel: "#opt-space", title: "2. Depth and material", text: "Depth decides which pitches can be caught: low pitches need depth. The material budget limits how much each shape may use." },
  { ws: "shapes", sel: "#btn-grow", title: "3. Grow", text: "Every nature-inspired family evolves under the same limits: many variations, keep the best, mix, repeat." },
  { ws: "shapes", sel: "#tools", title: "4. Tools = shape families", text: "Each tool is one family: spikes, sponge, cloud, bottles, coils, moss-on-shell. Click one to inspect it on the artboard." },
  { ws: "shapes", sel: "#panel-layers", title: "5. Layers", text: "The grown shapes, ranked. Click any to open it; Properties explains it in plain words." },
  { ws: "forms", sel: "#tools", title: "6. Forms: growth rules", text: "Not panels: free objects. Each tool is a rule from nature: branching tree, snow crystal, folding coral, spiral shell, foam." },
  { ws: "forms", sel: "#opt-mount", title: "7. Hanging or standing", text: "Choose where the object lives, its size and how much material one piece may use. Then press Grow: every candidate is tested with sound waves." },
  { ws: "materials", sel: "#panel-materials", title: "8. Materials", text: "Tick what you are happy to use. The chart compares each material as a plain flat layer." },
  { ws: "spaces", sel: "#panel-spaces", title: "9. Your spaces", text: "Each exhibition area is its own 3D model. Add a ready-made room, or import an OBJ from Rhino, SketchUp or Blender." },
  { ws: "spaces", sel: "#panel-absorbers", title: "10. Place absorbers", text: "Add grown shapes to the space. The lab tells you how many m² reach the recommended echo, and how much the crowd noise drops." },
  { ws: "spaces", sel: "#panel-guide", title: "11. Ask me", text: "I'm here the whole time. Ask anything, in your own words." },
];
let tourAt = -1;
function tour(i) {
  $$(".tour-focus").forEach((x) => x.classList.remove("tour-focus"));
  const box = $("#tour");
  if (i < 0 || i >= TOUR.length) { box.hidden = true; tourAt = -1; return; }
  tourAt = i;
  const step = TOUR[i];
  if (state.ws !== step.ws) setWorkspace(step.ws);
  const target = $(step.sel);
  box.innerHTML = `<span class="kicker">Guided tour · ${i + 1} of ${TOUR.length}</span><h3>${step.title}</h3><p>${step.text}</p>
    <div class="row"><button class="btn small ghost" id="tour-end">Close</button><span><button class="btn small" id="tour-back" ${i === 0 ? "disabled" : ""}>Back</button>
    <button class="btn small primary" id="tour-next">${i === TOUR.length - 1 ? "Finish" : "Next"}</button></span></div>`;
  box.hidden = false;
  $("#tour-end").onclick = () => tour(-1); $("#tour-back").onclick = () => tour(i - 1); $("#tour-next").onclick = () => tour(i + 1);
  if (target) {
    target.classList.add("tour-focus");
    target.scrollIntoView({ block: "nearest" });
    const r = target.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight;
    let top = r.bottom + 10, left = Math.min(Math.max(16, r.left), innerWidth - bw - 16);
    if (top + bh > innerHeight - 10) top = Math.max(10, r.top - bh - 10);
    if (r.left > innerWidth * 0.6) left = Math.max(16, r.left - bw - 12);
    box.style.top = top + "px"; box.style.left = left + "px";
  }
  $("#tour-next").focus();
}
$("#tour-start").onclick = () => tour(0);
$("#tour-start-2").onclick = () => tour(0);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && tourAt >= 0) tour(-1); });
addEventListener("resize", () => { if (tourAt >= 0) tour(tourAt); });

// ------------------------------------------------------------------- boot --
refreshPreview();
addPreset("gallery"); addPreset("hall");
state.spaceId = state.spaces[0].id;
renderAll();
addMsg("bot", "Hi! I'm your guide. New here? Press “Guided tour” at the top right, or just ask me anything.");
if (window.claude && window.claude.use) {
  window.claude.use("sample").then((s) => { sample = s; });
  window.claude.use("downloads").then((d) => { downloads = d; if (state.ws === "shapes" && state.tool !== "all") renderDock(); });
}
</script>

<title>Biothing Sound Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
/* Layout: a creative-suite workspace. App bar and options bar on top, tools on the left,
   artboard or 3D viewport in the middle, docked panels on the right, status bar below.
   Deliberately one dark theme, like the design tools it borrows from. */
:root {
  --app: #1b1c1e; --panel: #26272a; --panel-2: #2e3034; --raised: #383a40; --line: #3e4147;
  --ink: #e9e9ea; --muted: #a2a5ab; --accent: #4a90e2; --accent-ink: #ffffff; --signal: #e6a23c;
  --good: #5bb67c; --warn: #e3b448; --bad: #e46b5f; --pasteboard: #141517; --artboard: #f3f3f1; --art-ink: #1d1e20;
  --sans: "Source Sans 3", "Segoe UI", system-ui, sans-serif; --mono: "Source Code Pro", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--app); color: var(--ink); font: 14px/1.45 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.kicker { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.app { height: 100%; display: grid; grid-template-columns: 48px minmax(0, 1fr) 340px; grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "bar bar bar" "opt opt opt" "tools canvas dock" "status status status";
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }

/* App bar */
.appbar { grid-area: bar; display: flex; align-items: center; gap: 14px; padding: 6px 12px; background: var(--app); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mark { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, var(--good), var(--accent)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.appname { font-weight: 700; font-size: 15px; }
.tabs { display: flex; gap: 2px; background: var(--panel); border-radius: 8px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--raised); color: var(--ink); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: default; }

/* Options bar */
.optbar { grid-area: opt; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.opt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.opt label { color: var(--muted); white-space: nowrap; }
.opt output { font-family: var(--mono); min-width: 74px; }
select, input[type="number"], input[type="text"] { background: var(--app); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }
input[type="range"] { accent-color: var(--accent); width: 110px; }
input[type="checkbox"] { accent-color: var(--accent); }
.divider { width: 1px; align-self: stretch; background: var(--line); }

/* Tools */
.tools { grid-area: tools; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; }
.tool { width: 36px; height: 36px; border-radius: 6px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); position: relative; }
.tool:hover { background: var(--panel-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.tool svg { width: 20px; height: 20px; }
.tool-sep { width: 24px; height: 1px; background: var(--line); margin: 4px 0; }

/* Canvas */
.canvas { grid-area: canvas; background: var(--pasteboard); overflow: auto; min-width: 0; min-height: 0; padding: 18px; display: grid; gap: 14px; align-content: start; }
.artboard { background: var(--artboard); color: var(--art-ink); border-radius: 2px; box-shadow: 0 2px 18px rgba(0, 0, 0, 0.45); padding: 16px; display: grid; gap: 10px; }
.artboard .muted { color: #5e6168; }
.artboard h2 { font-size: 20px; }
.art-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.art-card { border: 1px solid #d7d8da; border-radius: 4px; background: #fff; padding: 10px; display: grid; gap: 6px; text-align: left; cursor: pointer; color: var(--art-ink); }
.art-card:hover { border-color: var(--accent); }
.art-card svg { width: 100%; height: auto; display: block; }
.art-card .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.pill { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #e7e8ea; color: #4b4e55; white-space: nowrap; }
.pill.win { background: #dbe9fb; color: #1f5fae; }
.pill.hang { background: #fbeed8; color: #8a5a10; }
.pill.seed { background: #ececec; color: #777; }
.big-drawing svg { width: 100%; max-width: 760px; height: auto; display: block; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.chart-scroll { overflow-x: auto; }
.chart-scroll svg { display: block; width: 100%; min-width: 420px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.box { height: 10px; width: 10px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.current td { background: var(--panel-2); }
.status-pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
.status-pill.ok { background: rgba(91, 182, 124, 0.18); color: var(--good); }
.status-pill.warn { background: rgba(227, 180, 72, 0.18); color: var(--warn); }
.status-pill.bad { background: rgba(228, 107, 95, 0.18); color: var(--bad); }
.viewport { position: relative; height: min(56vh, 520px); min-height: 300px; background: #0f1012; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; touch-action: none; }
.viewport canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.shape-view { height: min(52vh, 480px); min-height: 280px; }
.seg { display: inline-flex; border: 1px solid #c9cacd; border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: #fff; color: #44474d; padding: 4px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.row3d { display: flex; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; }
.swatches { display: inline-flex; gap: 12px; flex-wrap: wrap; color: #44474d; }
.swatches span { display: inline-flex; align-items: center; gap: 6px; }
.swatches i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #b9babd; display: inline-block; }
.segd { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.segd button { border: 0; background: var(--app); color: var(--muted); padding: 4px 12px; cursor: pointer; font-weight: 600; }
.segd button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.wave-wrap { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.wave-wrap canvas { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 4px; background: #101114; }
.wave-wrap svg { width: 100%; height: auto; display: block; border-radius: 4px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--raised); }
.rule-thumb { display: grid; place-items: center; height: 40px; color: #2f7d55; }
.rule-thumb svg { width: 22px !important; height: 22px !important; }
.art-card .pill svg { width: 14px; height: 14px; vertical-align: middle; }
@media (max-width: 700px) { .wave-wrap { grid-template-columns: minmax(0, 1fr); } }
.field-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.field-canvas { width: 100%; max-width: 360px; height: auto; display: block; border: 1px solid var(--line); border-radius: 4px; background: #141517; }
.mini-bands { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; height: 46px; align-items: end; }
.mini-bands span { display: grid; grid-template-rows: 1fr auto; height: 100%; align-items: end; text-align: center; }
.mini-bands i { display: block; background: var(--signal); border-radius: 2px 2px 0 0; }
.mini-bands small { color: var(--muted); font-size: 10px; }
@media (max-width: 700px) { .field-pair { grid-template-columns: minmax(0, 1fr); } }
.zone { display: grid; gap: 14px; min-width: 0; }
.cut-preview { width: 100%; max-width: 360px; height: auto; display: block; border: 1px solid var(--line); border-radius: 4px; background: #141517; }
.fam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 10px; }
.fam-item { display: grid; gap: 2px; justify-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--app); color: var(--ink); cursor: pointer; font: inherit; }
.fam-item[aria-pressed="true"] { border-color: var(--accent); background: var(--raised); }
.fam-item small { color: var(--muted); font-size: 11px; }
.silhouette { width: 100%; height: auto; max-height: 130px; }
.primer { margin: 4px 0 6px; }
.primer summary { cursor: pointer; font-weight: 600; }
.primer ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; }
#room-pick { max-width: 150px; }
#f-mat-pick, #mat-pick { max-width: 150px; }
#target { max-width: 130px; }
.optbar.studio { gap: 8px 14px; }
.optbar.studio .divider { display: none; }
.optbar.studio input[type="range"] { width: 80px; }
.optbar.studio .opt output { min-width: 44px; }
.viewport .hud { position: absolute; left: 10px; top: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
.viewport .fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; }
.kpi b { font-family: var(--mono); font-size: 20px; font-weight: 500; }

/* Dock */
.dock { grid-area: dock; background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: minmax(0, 1fr) minmax(250px, 44%); min-height: 0; min-width: 0; }
.dock-panels { overflow-y: auto; min-height: 0; }
details.panel { border-bottom: 1px solid var(--line); }
details.panel > summary { list-style: none; cursor: pointer; padding: 8px 12px; background: var(--panel-2); font-weight: 700; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; display: flex; justify-content: space-between; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: "▾"; color: var(--muted); }
details.panel:not([open]) > summary::after { content: "▸"; }
.panel-body { padding: 10px 12px 14px; display: grid; gap: 10px; }
.hint { color: var(--muted); font-size: 13px; }
ul.plain { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; font-family: var(--mono); }
.layer { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 6px; border-radius: 6px; border: 1px solid transparent; background: transparent; text-align: left; cursor: pointer; width: 100%; }
.layer:hover { background: var(--panel-2); }
.layer[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); }
.layer .thumb { background: var(--artboard); border-radius: 3px; overflow: hidden; }
.layer .thumb svg { width: 64px; height: 40px; display: block; }
.layer small { color: var(--muted); display: block; }
.matrow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start; padding: 5px 2px; cursor: pointer; }
.matrow small { display: block; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12.5px; }
.chip:hover { border-color: var(--accent); }
.bars { display: grid; gap: 5px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 8px; background: var(--app); border-radius: 999px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; background: var(--signal); }
.formgrid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.formgrid select, .formgrid input { width: 100%; min-width: 0; }
.placement { display: grid; grid-template-columns: minmax(0, 1fr) 76px auto; gap: 6px; align-items: center; }
.suggest { border: 1px dashed var(--accent); border-radius: 6px; padding: 8px 10px; display: grid; gap: 6px; }
.space-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; background: transparent; width: 100%; text-align: left; }
.space-item:hover { background: var(--panel-2); }
.space-item[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); }

/* Guide */
.guide { border-top: 1px solid var(--line); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0; background: var(--panel); }
.guide-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel-2); }
.guide-head .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: #0f1a13; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.guide-head h3 { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
.guide-tip { padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.guide-tip strong { color: var(--ink); }
.log { overflow-y: auto; padding: 10px 12px; display: grid; gap: 8px; align-content: start; min-height: 0; }
.msg { padding: 7px 10px; border-radius: 8px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; }
.msg.user { background: var(--raised); justify-self: end; }
.msg.bot { background: var(--app); border: 1px solid var(--line); }
.msg.note { color: var(--muted); font-size: 12.5px; padding: 0; }
.ask { padding: 8px 10px 10px; display: grid; gap: 6px; border-top: 1px solid var(--line); }
.ask form { display: flex; gap: 6px; }
.ask textarea { flex: 1; min-width: 0; resize: none; height: 36px; background: var(--app); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }

/* Status bar */
.statusbar { grid-area: status; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; padding: 4px 12px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
  padding-bottom: max(4px, env(safe-area-inset-bottom, 0px)); }
.progress { width: 120px; height: 5px; background: var(--app); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }

/* Tour */
.tour-focus { position: relative; z-index: 60; outline: 2px solid var(--signal) !important; outline-offset: 2px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); border-radius: 6px; }
.tour { position: fixed; z-index: 70; width: min(340px, calc(100vw - 32px)); background: var(--panel-2); border: 1px solid var(--signal); border-radius: 10px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
.tour .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto;
    grid-template-areas: "bar" "opt" "tools" "canvas" "dock" "status"; padding-left: 0; padding-right: 0; }
  .appbar, .optbar, .statusbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .optbar select { max-width: 100%; }
  input[type="range"] { width: auto; flex: 1 1 120px; }
  .opt output { min-width: 0; }
  .divider { display: none; }
  .tools { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 4px max(16px, env(safe-area-inset-left, 0px)); }
  .tool-sep { width: 1px; height: 24px; margin: 0 4px; }
  .canvas { overflow: visible; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
  .dock { grid-template-rows: auto 460px; border-left: 0; border-top: 1px solid var(--line); }
  .dock-panels { overflow: visible; }
  .tour { left: 16px !important; right: 16px; bottom: max(16px, env(safe-area-inset-bottom, 0px)); top: auto !important; width: auto; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script>/* Biothing Sound Lab engine: browser port of biothing_acoustics/layers.py and forms.py.
 * Kept numerically identical to the Python version (checked by webapp/engine.test.js).
 * Convention exp(+j*omega*t): lossy wavenumbers have a negative imaginary part. */
(function (root) {
  "use strict";

  // ---------------------------------------------------------- complex ----
  const C = (re, im = 0) => ({ re, im });
  const add = (a, b) => C(a.re + b.re, a.im + b.im);
  const sub = (a, b) => C(a.re - b.re, a.im - b.im);
  const mul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
  const scale = (a, k) => C(a.re * k, a.im * k);
  const div = (a, b) => {
    const d = b.re * b.re + b.im * b.im;
    return C((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d);
  };
  const inv = (a) => div(C(1), a);
  const abs2 = (a) => a.re * a.re + a.im * a.im;
  const csqrt = (a) => { // principal branch, like numpy
    const r = Math.hypot(a.re, a.im);
    const re = Math.sqrt((r + a.re) / 2);
    const im = Math.sqrt(Math.max(0, (r - a.re) / 2));
    return C(re, a.im < 0 ? -im : im);
  };
  const csin = (a) => C(Math.sin(a.re) * Math.cosh(a.im), Math.cos(a.re) * Math.sinh(a.im));
  const ccos = (a) => C(Math.cos(a.re) * Math.cosh(a.im), -Math.sin(a.re) * Math.sinh(a.im));
  const ctan = (a) => div(csin(a), ccos(a));
  const ctanh = (a) => {
    const d = Math.cosh(2 * a.re) + Math.cos(2 * a.im);
    return C(Math.sinh(2 * a.re) / d, Math.sin(2 * a.im) / d);
  };
  const J = C(0, 1);

  // --------------------------------------------------------- constants ----
  const RHO0 = 1.204, C0 = 343.2, Z0 = RHO0 * C0;
  const ETA = 1.81e-5, PRANDTL = 0.71, GAMMA = 1.4, K0 = RHO0 * C0 * C0;
  const FREQS = [100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000];
  const N_THETA = 46;
  const THETA = Array.from({ length: N_THETA }, (_, i) => (i / (N_THETA - 1)) * (89 * Math.PI / 180));
  const N_SUB = 14, WALL = 0.002, PARTITION_SPACING = 0.1;

  // Paris weights: trapezoid of sin(2θ), normalised.
  const PARIS = (() => {
    const w = THETA.map((t) => Math.sin(2 * t));
    const h = THETA[1] - THETA[0];
    const tw = w.map((v, i) => v * h * (i === 0 || i === N_THETA - 1 ? 0.5 : 1));
    const total = tw.reduce((a, b) => a + b, 0);
    return tw.map((v) => v / total);
  })();

  // ---------------------------------------------------------- materials ---
  // Indicative values; same table as biothing_acoustics/materials.py.
  const FELTS = {
    pet_felt_light: { name: "Recycled PET felt, light", sigma: 9000, density: 35, cost: 5.0, carbon: 1.6, group: "Recycled", formable: true, note: "Soft and very light. Made from plastic bottles; can be pressed into shapes." },
    pet_felt_medium: { name: "Recycled PET felt, medium", sigma: 20000, density: 60, cost: 5.0, carbon: 1.6, group: "Recycled", formable: true, note: "The everyday acoustic felt. Can be heat-pressed into reliefs." },
    pet_felt_dense: { name: "Recycled PET felt, dense", sigma: 45000, density: 120, cost: 5.5, carbon: 1.6, group: "Recycled", formable: true, note: "Tough surface, best at middle and high pitches." },
    recycled_cotton: { name: "Recycled cotton fibre", sigma: 12000, density: 45, cost: 3.5, carbon: 0.8, group: "Recycled", formable: false, note: "From old clothes. Low carbon; needs fire treatment." },
    wool_felt: { name: "Wool felt", sigma: 25000, density: 100, cost: 14.0, carbon: 10.0, group: "Animal", formable: false, note: "Dense natural felt, beautiful surface, expensive." },
    sheep_wool_batt: { name: "Sheep wool batt", sigma: 6000, density: 25, cost: 8.0, carbon: 1.0, group: "Animal", formable: false, note: "Fluffy wool padding. Excellent absorber; needs a cover fabric." },
    hemp_fibre: { name: "Hemp fibre mat", sigma: 8000, density: 40, cost: 4.0, carbon: 0.5, group: "Plant", formable: false, note: "Fast-growing plant, very low carbon, slightly rough look." },
    coconut_coir: { name: "Coconut coir mat", sigma: 3000, density: 60, cost: 3.0, carbon: 0.4, group: "Plant", formable: false, note: "Coarse husk fibres. Very open: good as a front layer." },
    cork_granulate: { name: "Bonded cork granulate", sigma: 15000, density: 110, cost: 6.0, carbon: 0.3, group: "Plant", formable: true, note: "Cork-oak bark, harvested without cutting the tree. Can be moulded." },
    cellulose_fibre: { name: "Recycled paper cellulose", sigma: 20000, density: 45, cost: 1.5, carbon: 0.3, group: "Plant", formable: true, note: "Very cheap; can be moulded like papier-mache." },
    wood_wool: { name: "Wood wool board", sigma: 1500, density: 400, cost: 1.5, carbon: 0.5, group: "Plant", formable: false, note: "Wood shavings bound with cement. Robust but heavy." },
    mycelium: { name: "Mycelium composite", sigma: 60000, density: 90, cost: 9.0, carbon: 0.6, group: "Fungus", formable: true, note: "Mushroom roots grown in a mould: a literally grown material." },
    mineral_wool: { name: "Stone wool", sigma: 15000, density: 50, cost: 2.5, carbon: 1.3, group: "Mineral & synthetic", formable: false, note: "Melted rock fibres. Does not burn; must be fully covered." },
    melamine_foam: { name: "Melamine foam", sigma: 10000, density: 9, cost: 15.0, carbon: 4.0, group: "Mineral & synthetic", formable: true, note: "Feather-light foam, cuts into any shape. Fossil-based." },
  };
  const RIGIDS = {
    rigid_pet: { name: "Rigid recycled PET", density: 900, cost: 6.0, carbon: 1.8, note: "Same plastic as PET felt: recycles together." },
    birch_plywood: { name: "Birch plywood", density: 680, cost: 3.5, carbon: 0.7, note: "Strong, easy to CNC-cut." },
    solid_cardboard: { name: "Solid recycled cardboard", density: 700, cost: 1.5, carbon: 0.9, note: "Cheap and light, fine for short exhibitions." },
    pla_print: { name: "3D-printed PLA", density: 1240, cost: 25.0, carbon: 3.0, note: "Plant-starch plastic, any shape; slow to print." },
    fired_clay: { name: "Fired clay", density: 1900, cost: 4.0, carbon: 0.4, note: "Like the sound pots built into ancient theatres and medieval churches." },
  };
  const FELT_KEYS = Object.keys(FELTS);
  const RIGID_KEYS = Object.keys(RIGIDS);

  // ------------------------------------------------------------ targets ---
  const TARGETS = {
    voices: { 125: 0.02, 250: 0.10, 500: 0.20, 1000: 0.28, 2000: 0.25, 4000: 0.15 },
    crowd: { 125: 0.15, 250: 0.25, 500: 0.25, 1000: 0.20, 2000: 0.10, 4000: 0.05 },
    exhibition: { 125: 0.085, 250: 0.175, 500: 0.225, 1000: 0.24, 2000: 0.175, 4000: 0.10 },
    low_noise: { 125: 0.35, 250: 0.30, 500: 0.20, 1000: 0.10, 2000: 0.05, 4000: 0.0 },
  };

  function bandWeights(target) {
    const octaves = Object.keys(TARGETS[target]).map(Number).sort((a, b) => a - b);
    const nearest = FREQS.map((f) => {
      let best = octaves[0], d = Infinity;
      for (const o of octaves) { const x = Math.abs(Math.log2(f / o)); if (x < d) { d = x; best = o; } }
      return best;
    });
    const count = {};
    nearest.forEach((o) => { count[o] = (count[o] || 0) + 1; });
    const w = nearest.map((o) => TARGETS[target][o] / count[o]);
    const s = w.reduce((a, b) => a + b, 0);
    return w.map((v) => v / s);
  }

  // ------------------------------------------------------------- media ----
  function miki(f, sigma) {
    const x = f / sigma, a = Math.pow(x, -0.632), b = Math.pow(x, -0.618);
    return { zc: C(Z0 * (1 + 0.070 * a), -Z0 * 0.107 * a), kc: C((2 * Math.PI * f / C0) * (1 + 0.109 * b), -(2 * Math.PI * f / C0) * 0.160 * b) };
  }
  function porousMedium(f, sigma, frameDensity) {
    const w = 2 * Math.PI * f, { zc, kc } = miki(f, sigma);
    let rho = scale(mul(zc, kc), 1 / w);
    const k = div(scale(zc, w), kc);
    if (frameDensity != null) {
      const rt = frameDensity + RHO0;
      rho = div(sub(scale(rho, rt), C(RHO0 * RHO0)), add(rho, C(rt - 2 * RHO0)));
    }
    return { rho, k };
  }
  function mixedMedium(f, sigma, s, frameDensity) {
    s = Math.min(1, Math.max(0, s));
    const p = porousMedium(f, sigma, frameDensity);
    const rho = inv(add(scale(inv(p.rho), s), C((1 - s) / RHO0)));
    const k = inv(add(scale(inv(p.k), s), C((1 - s) / K0)));
    return { rho, k };
  }
  const AIR = { rho: C(RHO0), k: C(K0) };
  function slitMedium(f, width) {
    const w = 2 * Math.PI * f, h = width / 2, rot = C(Math.SQRT1_2, Math.SQRT1_2); // sqrt(j)
    const a = scale(rot, h * Math.sqrt(w * RHO0 / ETA));
    const b = scale(rot, h * Math.sqrt(w * RHO0 * PRANDTL / ETA));
    const rho = div(C(RHO0), sub(C(1), div(ctanh(a), a)));
    const k = div(C(GAMMA * 101325), add(C(1), scale(div(ctanh(b), b), GAMMA - 1)));
    return { rho, k };
  }
  function perforatedPlate(f, d, t, eps) {
    const w = 2 * Math.PI * f, kp = d / 2 * Math.sqrt(w * RHO0 / ETA);
    const r = 32 * ETA * t / (eps * RHO0 * C0 * d * d) * (Math.sqrt(1 + kp * kp / 32) + Math.SQRT2 / 32 * kp * d / t);
    const x = w * t / (eps * C0) * (1 + 1 / Math.sqrt(9 + kp * kp / 2) + 0.85 * d / t);
    return C(Z0 * r, Z0 * x);
  }

  // ----------------------------------------------------- transfer matrices
  function layer(f, theta, m, d) {
    const w = 2 * Math.PI * f, kx = w / C0 * Math.sin(theta);
    let kz = csqrt(sub(scale(div(m.rho, m.k), w * w), C(kx * kx)));
    if (kz.im > 0) kz = C(-kz.re, -kz.im);
    const zz = div(scale(m.rho, w), kz);
    const arg = scale(kz, d), c = ccos(arg), s = csin(arg);
    return [c, mul(J, mul(zz, s)), mul(J, div(s, zz)), c];
  }
  const mmul = (a, b) => [add(mul(a[0], b[0]), mul(a[1], b[2])), add(mul(a[0], b[1]), mul(a[1], b[3])),
    add(mul(a[2], b[0]), mul(a[3], b[2])), add(mul(a[2], b[1]), mul(a[3], b[3]))];
  const stack = (ms) => ms.reduce((acc, m) => (acc ? mmul(acc, m) : m), null);
  const admittanceOn = (m, yb) => div(add(m[2], mul(m[3], yb)), add(m[0], mul(m[1], yb)));
  function alphaFromY(y, theta) {
    const c = Math.cos(theta), zy = scale(y, Z0);
    return Math.min(1, Math.max(0, 1 - abs2(div(sub(C(c), zy), add(C(c), zy)))));
  }
  function alphaFree(m, theta) {
    const z = Z0 / Math.cos(theta);
    const a = add(m[0], scale(m[1], 1 / z)), b = add(scale(m[2], z), m[3]);
    const den = add(a, b);
    const r = div(sub(a, b), den), t = div(C(2), den);
    return Math.min(1, Math.max(0, 1 - abs2(r) - abs2(t)));
  }

  // Random-incidence absorption: perFreq(f) prepares what does not depend on angle
  // and returns the absorption as a function of angle.
  function randomIncidence(perFreq) {
    return FREQS.map((f) => {
      const atAngle = perFreq(f);
      return THETA.reduce((acc, t, i) => acc + PARIS[i] * atAngle(t), 0);
    });
  }

  const mid = () => Array.from({ length: N_SUB }, (_, i) => (i + 0.5) / N_SUB);
  const gradedMedia = (f, sigma, fr, fd) => fr.map((s) => mixedMedium(f, sigma, s, fd));
  const graded = (f, t, media, depth) => stack(media.map((m) => layer(f, t, m, depth / media.length)));

  // --------------------------------------------------------------- models -
  function spikes(p) {
    const felt = FELTS[p.porous], d = p.depth / 1000, taper = 1 - p.base;
    const s = mid().map((z) => (taper > 0 ? (z >= taper ? 1 : Math.pow(z / taper, p.taper)) : 1));
    const alpha = randomIncidence((f) => {
      const media = gradedMedia(f, felt.sigma, s);
      return (t) => alphaFromY(admittanceOn(graded(f, t, media, d), C(0)), t);
    });
    return { alpha, mass: mean(s) * d * felt.density, fractions: s };
  }
  function sponge(p) {
    const felt = FELTS[p.porous], d = p.depth / 1000, ds = d * (1 - p.gap);
    const s = mid().map((z) => p.outer + (p.inner - p.outer) * z);
    const alpha = randomIncidence((f) => {
      const media = gradedMedia(f, felt.sigma, s);
      return (t) => {
        let m = graded(f, t, media, ds);
        if (p.gap > 0) m = mmul(m, layer(f, t, AIR, d * p.gap));
        return alphaFromY(admittanceOn(m, C(0)), t);
      };
    });
    return { alpha, mass: mean(s) * ds * felt.density, fractions: s };
  }
  function cloud(p) {
    const felt = FELTS[p.porous], d = p.depth / 1000;
    const half = mid().map((z) => p.outer + (p.inner - p.outer) * z);
    const s = half.concat(half.slice().reverse());
    const alpha = randomIncidence((f) => {
      const media = gradedMedia(f, felt.sigma, s, felt.density);
      return (t) => 2 * alphaFree(graded(f, t, media, d), t);
    });
    return { alpha, mass: mean(s) * d * felt.density, fractions: s };
  }
  function resonatorZ(f, p, depth, fill, sigma) {
    const plate = perforatedPlate(f, p.hole / 1000, p.plate / 1000, p.porosity);
    const m = mmul(layer(f, 0, porousMedium(f, sigma), depth * fill), layer(f, 0, AIR, depth * (1 - fill)));
    return add(plate, inv(admittanceOn(m, C(0))));
  }
  function bottles(p) {
    const felt = FELTS[p.porous], rigid = RIGIDS[p.rigid], d = p.depth / 1000, depths = [d, d * p.ratio];
    const yf = FREQS.map((f) => depths.reduce((acc, x) => add(acc, scale(inv(resonatorZ(f, p, x, p.fill, felt.sigma)), 0.5)), C(0)));
    const alpha = FREQS.map((f, i) => THETA.reduce((acc, t, j) => acc + PARIS[j] * alphaFromY(yf[i], t), 0));
    const md = mean(depths);
    const mass = p.plate / 1000 * (1 - p.porosity) * rigid.density + p.fill * md * felt.density + 2 / PARTITION_SPACING * md * WALL * rigid.density;
    return { alpha, mass, depths };
  }
  function coil(p) {
    const rigid = RIGIDS[p.rigid], d = p.depth / 1000, w = p.width / 1000, a = p.cell / 1000;
    const lMax = p.coil * a * d / (w + WALL);
    const lengths = [0, 1, 2, 3].map((i) => lMax * (1 - p.grading * i / 3));
    const eps = w / a;
    const yf = FREQS.map((f) => {
      const m = slitMedium(f, w), zt = csqrt(mul(m.rho, m.k)), kt = scale(csqrt(div(m.rho, m.k)), 2 * Math.PI * f);
      const end = C(0, 2 * Math.PI * f * RHO0 * 0.6 * w);
      return lengths.reduce((acc, l) => add(acc, scale(inv(add(scale(div(mul(J, zt), ctan(scale(kt, l))), -1), end)), 0.25 * eps)), C(0));
    });
    const alpha = FREQS.map((f, i) => THETA.reduce((acc, t, j) => acc + PARIS[j] * alphaFromY(yf[i], t), 0));
    const mass = (WALL / (w + WALL) * d * p.coil + 0.002 * (1 - eps)) * rigid.density;
    return { alpha, mass, lengths };
  }
  function hybrid(p) {
    const felt = FELTS[p.porous], rigid = RIGIDS[p.rigid], d = p.depth / 1000, front = d * p.front;
    const s = mid().map((z) => p.outer + (p.inner - p.outer) * z);
    const cavity = Math.max(d - front - p.plate / 1000, 0.001);
    const alpha = randomIncidence((f) => {
      const media = gradedMedia(f, felt.sigma, s), y = inv(resonatorZ(f, p, cavity, 0, felt.sigma));
      return (t) => alphaFromY(admittanceOn(graded(f, t, media, front), y), t);
    });
    const mass = mean(s) * front * felt.density + p.plate / 1000 * (1 - p.porosity) * rigid.density + 2 / PARTITION_SPACING * cavity * WALL * rigid.density;
    return { alpha, mass, fractions: s, cavity };
  }
  const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;

  const DEPTH = ["depth", "depth", [0.15, 1.0]];
  const FAMILIES = [
    { key: "spikes", name: "Spikes and wedges", imitates: "grass, fur, owl-feather velvet", mounting: "wall",
      idea: "Sound slides in between the points and never meets a hard surface to bounce off.",
      genes: [DEPTH, ["base", "float", [0, 0.7]], ["taper", "float", [0.4, 3]], ["porous", "porous"]], model: spikes },
    { key: "sponge", name: "Gradient sponge", imitates: "sea sponge, moss, bone", mounting: "wall",
      idea: "Open and airy at the surface so sound gets in, denser inside so it gets trapped.",
      genes: [DEPTH, ["outer", "float", [0.05, 1]], ["inner", "float", [0.05, 1]], ["gap", "float", [0, 0.6]], ["porous", "porous"]], model: sponge },
    { key: "cloud", name: "Hanging cloud", imitates: "hanging moss, a forest canopy", mounting: "hanging",
      idea: "Hangs free in the air, so it catches sound from both sides.",
      genes: [DEPTH, ["outer", "float", [0.05, 1]], ["inner", "float", [0.05, 1]], ["porous", "porous"]], model: cloud },
    { key: "bottles", name: "Bottle resonators", imitates: "seashells, gourds, hollow stems", mounting: "wall",
      idea: "Air in a small neck bounces on the air in the cavity behind it and swallows a low pitch.",
      genes: [DEPTH, ["hole", "float", [2, 20]], ["plate", "float", [2, 15]], ["porosity", "float", [0.005, 0.2]], ["fill", "float", [0, 1]],
        ["ratio", "float", [0.2, 1]], ["porous", "porous"], ["rigid", "rigid"]], model: bottles },
    { key: "coil", name: "Coiled channels", imitates: "snail shell, the cochlea in your ear", mounting: "wall",
      idea: "A very long, narrow tube folded into a thin object catches low pitches without needing depth.",
      genes: [DEPTH, ["width", "float", [2, 15]], ["cell", "float", [20, 80]], ["grading", "float", [0, 0.9]], ["coil", "float", [0.3, 1]], ["rigid", "rigid"]], model: coil },
    { key: "hybrid", name: "Moss on a shell", imitates: "moss growing on a shell or bark", mounting: "wall",
      idea: "A soft sponge catches the middle and high pitches; bottle cavities behind it catch the low ones.",
      genes: [DEPTH, ["front", "float", [0.2, 0.8]], ["outer", "float", [0.05, 1]], ["inner", "float", [0.05, 1]], ["hole", "float", [2, 20]],
        ["plate", "float", [2, 10]], ["porosity", "float", [0.005, 0.2]], ["porous", "porous"], ["rigid", "rigid"]], model: hybrid },
  ];
  const FAMILY = Object.fromEntries(FAMILIES.map((f) => [f.key, f]));

  // ---------------------------------------------------------- evolution --
  const round = (x, n) => Math.round(x * 10 ** n) / 10 ** n;
  function decode(fam, v, brief) {
    const porous = brief.porous && brief.porous.length ? brief.porous : FELT_KEYS;
    const rigid = brief.rigid && brief.rigid.length ? brief.rigid : RIGID_KEYS;
    const p = {};
    fam.genes.forEach(([name, kind, spec], i) => {
      const u = Math.min(1, Math.max(0, v[i]));
      if (kind === "porous") p[name] = porous[Math.min(Math.floor(u * porous.length), porous.length - 1)];
      else if (kind === "rigid") p[name] = rigid[Math.min(Math.floor(u * rigid.length), rigid.length - 1)];
      else if (kind === "depth") p[name] = round((spec[0] + u * (spec[1] - spec[0])) * brief.maxDepth, 1);
      else p[name] = round(spec[0] + u * (spec[1] - spec[0]), 4);
    });
    return p;
  }
  function assess(fam, params, brief, weights) {
    weights = weights || bandWeights(brief.target);
    const r = fam.model(params);
    const score = r.alpha.reduce((acc, a, i) => acc + a * weights[i], 0);
    const over = r.mass > brief.massBudget;
    const fitness = score - (Math.max(0, r.mass / brief.massBudget - 1) + (over ? 0.1 : 0));
    return { family: fam.key, params, alpha: r.alpha, mass: r.mass, score, fitness, extra: r };
  }

  function rng(seed) { // mulberry32
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A breeder advances one generation per step() call so a page can animate it.
  function breeder(fam, brief, { population = 24, generations = 16, seed = 1, mutation = 0.15, elite = 2 } = {}) {
    const rand = rng(seed + fam.key.length * 101);
    const normal = () => Math.sqrt(-2 * Math.log(1 - rand())) * Math.cos(2 * Math.PI * rand());
    const n = fam.genes.length, weights = bandWeights(brief.target), archive = new Map();
    let pop = Array.from({ length: population }, () => Array.from({ length: n }, rand));
    let gen = 0, best = null;
    const evaluate = (v) => {
      const p = decode(fam, v, brief), key = JSON.stringify(p);
      if (!archive.has(key)) {
        const r = assess(fam, p, brief, weights);
        archive.set(key, r);
        if (!best || r.fitness > best.fitness) best = r;
      }
      return archive.get(key).fitness;
    };
    const tournament = (fit) => {
      let bi = Math.floor(rand() * fit.length);
      for (let k = 1; k < 3; k++) { const i = Math.floor(rand() * fit.length); if (fit[i] > fit[bi]) bi = i; }
      return bi;
    };
    return {
      get best() { return best; },
      get generation() { return gen; },
      get done() { return gen > generations; },
      generations,
      step() {
        const fit = pop.map(evaluate);
        gen += 1;
        if (gen > generations) return best;
        const order = fit.map((f, i) => i).sort((a, b) => fit[b] - fit[a]);
        const next = order.slice(0, elite).map((i) => pop[i].slice());
        while (next.length < population) {
          const a = pop[tournament(fit)], b = pop[tournament(fit)];
          next.push(a.map((x, i) => {
            let g = rand() < 0.5 ? x : b[i];
            if (rand() < mutation) g = Math.min(1, Math.max(0, g + 0.15 * normal()));
            if (rand() < mutation / 5) g = rand();
            return g;
          }));
        }
        pop = next;
        return best;
      },
    };
  }

  // Plain flat layer on a wall: the fair way to compare materials on their own.
  function flatLayer(key, thicknessMm) {
    const felt = FELTS[key], d = thicknessMm / 1000;
    const alpha = randomIncidence((f) => {
      const m = porousMedium(f, felt.sigma);
      return (t) => alphaFromY(admittanceOn(layer(f, t, m, d), C(0)), t);
    });
    return { alpha, mass: d * felt.density };
  }

  const quarterWave = (depthMm) => C0 / (4 * depthMm / 1000);

  const Engine = { FREQS, TARGETS, FELTS, RIGIDS, FAMILIES, FAMILY, N_SUB, bandWeights, decode, assess, breeder, flatLayer, quarterWave };
  if (typeof module !== "undefined" && module.exports) module.exports = Engine;
  else root.Engine = Engine;
})(this);
</script>
<script>/* Biothing Sound Lab rooms: exhibition spaces as 3D meshes, and their reverberation.
 * Statistical room acoustics (Sabine): good for comparing options in a space,
 * not a substitute for a ray-tracing study of a specific hall. */
(function (root) {
  "use strict";

  const OCTAVES = [125, 250, 500, 1000, 2000, 4000];
  // Air absorption 4m (1/m) at 20 C, 50 % RH (from ISO 9613-1 attenuation).
  const AIR_4M = [0.0004, 0.0012, 0.0026, 0.0045, 0.009, 0.027];
  // Equivalent absorption area per standing visitor, m2 (typical values).

  if (typeof module !== "undefined" && module.exports) module.exports = Rooms;

// ----------------------------------------------------------------- charts --
function lineChart(series, { yMax = 1, weights = null, w = 680, h = 250 } = {}) {
  const L = 46, Rr = 12, T = 12, B = 44, fx = (f) => L + (Math.log(f / 100) / Math.log(50)) * (w - L - Rr);
  const fy = (a) => T + (1 - Math.min(a, yMax) / yMax) * (h - T - B);
  const bands = [[100, 250, "#22262d", "Low rumble"], [250, 1000, "#1f2a24", "Body of the voice"], [1000, 5000, "#2b2720", "Clarity and consonants"]];
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Absorption by pitch">`;
  for (const [a, b, c, label] of bands) {
    s += `<rect x="${fx(a)}" y="${T}" width="${fx(b) - fx(a)}" height="${h - T - B}" fill="${c}"/>`;
    s += `<text x="${(fx(a) + fx(b)) / 2}" y="${h - 6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--sans)">${label}</text>`;
  }
  if (weights) {
    const max = Math.max(...weights);
    E.FREQS.forEach((f, i) => { const bh = (weights[i] / max) * 30; s += `<rect x="${fx(f) - 5}" y="${h - B - bh}" width="10" height="${bh}" fill="var(--signal)" opacity="0.35"/>`; });
  }
  const step = yMax > 1 ? 0.5 : 0.25;
  for (let v = 0; v <= yMax + 1e-9; v += step) {
    s += `<line x1="${L}" x2="${w - Rr}" y1="${fy(v)}" y2="${fy(v)}" stroke="var(--line)"/>`;
    s += `<text x="${L - 6}" y="${fy(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${yMax > 1 ? v.toFixed(1) : Math.round(v * 100) + "%"}</text>`;
  }
  for (const f of [100, 250, 500, 1000, 2000, 5000]) s += `<text x="${fx(f)}" y="${h - B + 15}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">${hz(f)}</text>`;
  for (const sr of series) {
    const pts = sr.alpha.map((a, i) => `${fx(E.FREQS[i]).toFixed(1)},${fy(a).toFixed(1)}`).join(" ");
    s += `<polyline points="${pts}" fill="none" stroke="${sr.color}" stroke-width="${sr.bold ? 3 : 1.8}" ${sr.dashed ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`;
  }
  return s + "</svg>";
}
function rtChart(res, w = 680, h = 240) {
  const L = 46, Rr = 12, T = 14, B = 34, n = R.OCTAVES.length, gw = (w - L - Rr) / n;
  const max = Math.max(1, ...res.rtBefore, res.target * 1.3);
  const y = (v) => T + (1 - v / max) * (h - T - B);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Reverberation time before and after">`;
  const step = max > 4 ? 1 : 0.5;
  for (let v = 0; v <= max + 1e-9; v += step) {
    s += `<line x1="${L}" x2="${w - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`;
    s += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${v.toFixed(1)} s</text>`;
  }
  R.OCTAVES.forEach((f, i) => {
    const x = L + gw * i, bw = gw * 0.32;
    s += `<rect x="${x + gw * 0.16}" y="${y(res.rtBefore[i])}" width="${bw}" height="${h - B - y(res.rtBefore[i])}" fill="#6a6e76"/>`;
    s += `<rect x="${x + gw * 0.52}" y="${y(res.rtAfter[i])}" width="${bw}" height="${h - B - y(res.rtAfter[i])}" fill="var(--accent)"/>`;
    s += `<text x="${x + gw / 2}" y="${h - B + 15}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">${hz(f)}</text>`;
  });
  s += `<line x1="${L}" x2="${w - Rr}" y1="${y(res.target)}" y2="${y(res.target)}" stroke="var(--signal)" stroke-width="2" stroke-dasharray="6 4"/>`;
  s += `<text x="${w - Rr}" y="${y(res.target) - 5}" text-anchor="end" font-size="11" fill="var(--signal)" font-family="var(--sans)">recommended ${res.target.toFixed(2)} s</text>`;
  return s + "</svg>";
}

// --------------------------------------------------------------- drawings --
// Cross-sections on the artboard: wall on the left, room on the right, sound arriving from the right.
const ART = { muted: "#6b6e75", felt: "#2f7d55", hard: "#7c8088", sound: "#c27d14", bg: "#eeeeec", ink: "#1d1e20" };
function hash(i, j) { const x = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return x - Math.floor(x); }
function texture(x0, x1, y0, y1, density, pal, seed = 0) {
  let s = "";
  for (let x = x0 + 1.5; x < x1 - 0.5; x += 4.2) for (let y = y0 + 1.5; y < y1 - 0.5; y += 4.2) {
    if (hash(Math.round(x * 10) + seed, Math.round(y * 10)) < density) s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.25" fill="${pal.felt}"/>`;
  }
  return s;
}
function drawForm(key, p, extra, maxDepth, { pal = ART, ruler = false, title = "" } = {}) {
  const W = 240, H = 150, X0 = 22, SPAN = 180, Y0 = ruler ? 20 : 14, Y1 = 136, sc = SPAN / maxDepth, X = (d) => X0 + d * sc;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title || key)} cross-section" xmlns="http://www.w3.org/2000/svg">`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="${pal.bg}"/>`;
  if (ruler) {
    const stepMm = maxDepth <= 120 ? 10 : maxDepth <= 250 ? 25 : 50;
    for (let d = 0; d <= maxDepth + 1e-6; d += stepMm) {
      const major = Math.round(d / stepMm) % 2 === 0;
      s += `<line x1="${X(d)}" x2="${X(d)}" y1="0" y2="${major ? 6 : 3.5}" stroke="${pal.muted}" stroke-width="0.6"/>`;
      if (major) s += `<text x="${X(d) + 1}" y="12" font-size="5.5" fill="${pal.muted}" font-family="monospace">${Math.round(d)}</text>`;
    }
  }
  const wall = () => {
    let w = `<rect x="6" y="${Y0 - 4}" width="${X0 - 6}" height="${Y1 - Y0 + 8}" fill="${pal.hard}" opacity="0.3"/>`;
    for (let y = Y0; y < Y1; y += 7) w += `<line x1="6" y1="${y + 7}" x2="${X0}" y2="${y}" stroke="${pal.hard}" stroke-width="0.8"/>`;
    return w;
  };
  const arrow = (x, dir = -1) => `<path d="M${x} 78 h${dir * 14} m${-dir * 5} -5 l${dir * 5} 5 l${-dir * 5} 5" fill="none" stroke="${pal.sound}" stroke-width="2" stroke-linecap="round"/>`;
  const plate = (xa, thick, holeMm, cells) => {
    const t = Math.max(2, thick * sc), hh = Math.max(1.6, holeMm * sc);
    let r = `<rect x="${xa}" y="${Y0}" width="${t}" height="${Y1 - Y0}" fill="${pal.hard}"/>`;
    for (let c = 0; c < cells; c++) {
      const cy0 = Y0 + ((Y1 - Y0) / cells) * c;
      for (const fr of [0.33, 0.67]) r += `<rect x="${xa - 0.5}" y="${cy0 + fr * ((Y1 - Y0) / cells) - hh / 2}" width="${t + 1}" height="${hh}" fill="${pal.bg}"/>`;
    }
    return r;
  };
  if (key === "spikes") {
    s += wall();
    const n = 3, pitch = (Y1 - Y0) / n, D = p.depth, taper = 1 - p.base;
    for (let k = 0; k < n; k++) {
      const cy = Y0 + pitch * (k + 0.5), top = [], bot = [];
      for (let i = 0; i <= 40; i++) {
        const z = i / 40, f = taper > 0 ? (z >= taper ? 1 : Math.pow(z / taper, p.taper)) : 1, x = X(D * (1 - z)), hw = (f * pitch) / 2;
        top.push(`${x.toFixed(1)},${(cy - hw).toFixed(1)}`); bot.push(`${x.toFixed(1)},${(cy + hw).toFixed(1)}`);
      }
      s += `<polygon points="${top.join(" ")} ${X0},${(cy - pitch / 2).toFixed(1)} ${X0},${(cy + pitch / 2).toFixed(1)} ${bot.reverse().join(" ")}" fill="${pal.felt}" opacity="0.88"/>`;
    }
    s += arrow(W - 6);
  } else if (key === "sponge") {
    s += wall();
    const D = p.depth, ds = D * (1 - p.gap), fr = extra.fractions;
    fr.forEach((v, i) => { s += texture(X(D - ((i + 1) / fr.length) * ds), X(D - (i / fr.length) * ds), Y0, Y1, v, pal, i); });
    if (p.gap > 0.02) s += `<text x="${(X0 + X(D * p.gap)) / 2}" y="${Y1 + 10}" text-anchor="middle" font-size="8" fill="${pal.muted}" font-family="sans-serif">air</text>`;
    s += arrow(W - 6);
  } else if (key === "hybrid") {
    s += wall();
    const D = p.depth, fd = D * p.front, cav = extra.cavity * 1000, fr = extra.fractions;
    for (let c = 1; c < 4; c++) s += `<line x1="${X0}" x2="${X(cav)}" y1="${Y0 + ((Y1 - Y0) / 4) * c}" y2="${Y0 + ((Y1 - Y0) / 4) * c}" stroke="${pal.hard}" stroke-width="1"/>`;
    s += plate(X(cav), p.plate, p.hole, 4);
    fr.forEach((v, i) => { s += texture(X(D - ((i + 1) / fr.length) * fd), X(D - (i / fr.length) * fd), Y0, Y1, v, pal, i); });
    s += arrow(W - 6);
  } else if (key === "cloud") {
    const D = p.depth, cx = X0 + SPAN / 2, w = D * sc, xa = cx - w / 2, fr = extra.fractions;
    s += `<line x1="4" x2="${W - 4}" y1="${Y0 - 8}" y2="${Y0 - 8}" stroke="${pal.hard}" stroke-width="2"/><line x1="${cx}" x2="${cx}" y1="${Y0 - 8}" y2="${Y0 + 4}" stroke="${pal.hard}"/>`;
    fr.forEach((v, i) => { s += texture(xa + (i / fr.length) * w, xa + ((i + 1) / fr.length) * w, Y0 + 4, Y1 - 4, v, pal, i); });
    s += arrow(W - 6) + arrow(6, 1);
  } else if (key === "bottles") {
    s += wall();
    const D = p.depth, cells = 4, ch = (Y1 - Y0) / cells, depths = [D, D * p.ratio];
    for (let c = 0; c < cells; c++) {
      const y0 = Y0 + ch * c, d = depths[c % 2], back = D - d;
      if (back > 0.5) s += `<rect x="${X0}" y="${y0}" width="${back * sc}" height="${ch}" fill="${pal.hard}" opacity="0.4"/>`;
      if (p.fill > 0.01) s += texture(X(D - d * p.fill), X(D), y0 + 1, y0 + ch - 1, 0.8, pal, c);
      if (c) s += `<line x1="${X0}" x2="${X(D)}" y1="${y0}" y2="${y0}" stroke="${pal.hard}" stroke-width="1.2"/>`;
    }
    s += plate(X(D), p.plate, p.hole, cells) + arrow(W - 6);
  } else if (key === "coil") {
    s += wall();
    const D = p.depth, cells = 4, ch = (Y1 - Y0) / cells, lens = extra.lengths.map((l) => l * 1000);
    for (let c = 0; c < cells; c++) {
      const y0 = Y0 + ch * c, nL = Math.max(1, Math.ceil(lens[c] / D)), lh = (ch - 4) / nL;
      let path = `M${X(D)} ${y0 + 2 + lh / 2}`, left = lens[c];
      for (let k = 0; k < nL && left > 0; k++) {
        const run = Math.min(D, left), y = y0 + 2 + lh * (k + 0.5);
        path += ` H${(k % 2 === 0 ? X(D - run) : X(run)).toFixed(1)}`;
        left -= run;
        if (left > 0 && k + 1 < nL) path += ` V${(y + lh).toFixed(1)}`;
      }
      s += `<rect x="${X0}" y="${y0}" width="${D * sc}" height="${ch}" fill="${pal.hard}" opacity="0.16"/>`;
      s += `<path d="${path}" fill="none" stroke="${pal.felt}" stroke-width="${Math.max(1, Math.min(lh * 0.6, p.width * sc))}" stroke-linejoin="round"/>`;
      if (c) s += `<line x1="${X0}" x2="${X(D)}" y1="${y0}" y2="${y0}" stroke="${pal.hard}"/>`;
    }
    s += arrow(W - 6);
  }
  if (!ruler) s += `<text x="${W - 4}" y="${H - 4}" text-anchor="end" font-size="8" fill="${pal.muted}" font-family="monospace">${Math.round(maxDepth)} mm scale</text>`;
  return s + "</svg>";
}

// ------------------------------------------------------------ explanations -
const helmholtz = (holeMm, plateMm, porosity, depthM) => (343.2 / (2 * Math.PI)) * Math.sqrt(porosity / ((plateMm / 1000 + 0.85 * holeMm / 1000) * depthM));
function explain(r) {
  const p = r.params, m = p.porous ? E.FELTS[p.porous].name.toLowerCase() : null, out = [];
  if (r.family === "spikes") {
    out.push(`${mm(p.depth)} deep in ${m}: a ${mm(p.depth * p.base)} solid base, then spikes ${mm(p.depth * (1 - p.base))} long that taper ${p.taper > 1.5 ? "to sharp points" : p.taper < 0.8 ? "only near the tip" : "evenly"}.`);
  } else if (r.family === "sponge") {
    out.push(`${mm(p.depth * (1 - p.gap))} of ${m}${p.gap > 0.02 ? `, standing ${mm(p.depth * p.gap)} off the wall with air behind` : " against the wall"}.`);
    out.push(`${pct(p.outer)} solid at the surface, ${pct(p.inner)} at the back: ${p.outer < p.inner - 0.1 ? "airy outside, dense inside, like moss" : p.outer > p.inner + 0.1 ? "a denser skin over an airy core" : "even all through"}.`);
  } else if (r.family === "cloud") {
    out.push(`A ${mm(p.depth)} hanging layer of ${m}, ${pct(p.outer)} solid at the faces and ${pct(p.inner)} in the middle. Both faces work.`);
  } else if (r.family === "bottles") {
    out.push(`A ${mm(p.plate)} ${E.RIGIDS[p.rigid].name.toLowerCase()} plate with ${fix(p.hole)} mm holes (${pct(p.porosity)} open).`);
    out.push(`Cavities ${mm(p.depth)} and ${mm(p.depth * p.ratio)} deep, ${pct(p.fill)} filled with ${m}; they ring at about ${hz(helmholtz(p.hole, p.plate, p.porosity, p.depth / 1000))} and ${hz(helmholtz(p.hole, p.plate, p.porosity, (p.depth * p.ratio) / 1000))}.`);
  } else if (r.family === "coil") {
    const ls = r.extra.lengths;
    out.push(`Four channels ${fix(p.width)} mm wide folded inside ${mm(p.depth)} of ${E.RIGIDS[p.rigid].name.toLowerCase()}.`);
    out.push(`Unfolded: ${ls.map((l) => Math.round(l * 100) + " cm").join(", ")}. Each catches one low pitch: ${ls.map((l) => hz(343.2 / (4 * l))).join(", ")}.`);
  } else if (r.family === "hybrid") {
    out.push(`${mm(p.depth * p.front)} of ${m} sponge (${pct(p.outer)} → ${pct(p.inner)} solid) in front of a ${mm(p.plate)} plate with ${fix(p.hole)} mm holes.`);
    out.push(`Behind it, a ${mm(r.extra.cavity * 1000)} air cavity that rings at about ${hz(helmholtz(p.hole, p.plate, p.porosity, r.extra.cavity))}.`);
  }
  out.push(`${fix(r.mass, 2)} kg of material per m²${r.mass > state.mass ? " (over your budget)" : ""}.`);
  return out;
}
const isHang = (key) => E.FAMILY[key].mounting === "hanging";
const scoreText = (r) => (isHang(r.family) ? `${r.score.toFixed(2)} m²/m²` : `${pct(Math.min(1, r.score))} caught`);
const rankedWall = () => families().filter((f) => !isHang(f.key)).map((f) => current(f.key)).filter(Boolean).sort((a, b) => b.fitness - a.fitness);

function materialsCanvas() {

function bindDock() {

const toggle = (set, k) => (set.has(k) ? set.delete(k) : set.add(k));

// --------------------------------------------------------------- growing ---
async function grow() {
  if (state.growing || !state.porous.size) return;
  state.growing = true; state.ranking = null; state.progress = 0; updateOutputs();
  const b = brief(), fams = families();
  const breeders = fams.map((f) => E.breeder(f, b, { population: 24, generations: 16, seed: state.seed }));
  state.seed += 1;
  const partial = [];
  while (breeders.some((x) => !x.done)) {
    for (const br of breeders) if (!br.done) br.step();
    state.results = breeders.map((br) => br.best).filter(Boolean);
    state.progress = Math.min(1, breeders[0].generation / breeders[0].generations);
    renderCanvas(); renderStatus();
    if (gmode() === "shapes") renderDock();
    await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
  }
  state.results = breeders.map((br) => br.best);
  state.growing = false; state.progress = 1;
  updateOutputs(); renderAll();
  addMsg("note", `Grown. Best on the wall: ${E.FAMILY[rankedWall()[0].family].name}. Click any shape to inspect it.`);
}

async function rankMaterials(key) {
  const fam = E.FAMILY[key], mats = [...state.porous], out = [], btn = $("#rank-mats");
  for (let i = 0; i < mats.length; i++) {
    if (btn) { btn.disabled = true; btn.textContent = `Trying ${i + 1}/${mats.length}…`; }
    const br = E.breeder(fam, { ...brief(), porous: [mats[i]] }, { population: 16, generations: 10, seed: 7 });
    while (!br.done) br.step();
    out.push(br.best);
    await new Promise((r) => setTimeout(r, 0));
  }
  state.ranking = { family: key, rows: out.sort((a, b) => b.fitness - a.fitness) };
  if (gmode() === "shapes" && state.tool === key) renderDock();
}

// ---------------------------------------------------------------- spaces ---
function makeSpace(name, mesh, finishes, people, kind, size) {
  const sp = { id: state.nextId++, name, mesh, info: R.analyze(mesh), finishes: { ...finishes }, people, kind, size, volumeOverride: null, placements: [] };
  state.spaces.push(sp);
  state.spaceId = sp.id;
  return sp;
}
function addPreset(key) {
  const p = R.PRESETS.find((x) => x.key === key);
  makeSpace(p.name, R.boxMesh(...p.size), { floor: p.floor, wall: p.wall, ceiling: p.ceiling }, p.people, "box", p.size.slice());
  renderAll();
}
function importOBJ(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const mesh = R.parseOBJ(String(reader.result), { yUp: state.yUp });
      const sp = makeSpace(file.name.replace(/\.obj$/i, ""), mesh, { floor: "concrete", wall: "plasterboard", ceiling: "plaster" }, 50, "import");
      const a = sp.info.areas;
      addMsg("note", `Imported “${sp.name}”: ${fix(sp.info.volume, 0)} m³, floor ${fix(a.floor, 0)} m², walls ${fix(a.wall, 0)} m², ceiling ${fix(a.ceiling, 0)} m².` +
        (a.floor < 0.05 * sp.info.total ? " The floor looks tiny: if the model came from Blender or SketchUp, tick “Model is Y-up” and import again." : ""));
      renderAll();
    } catch (err) { addMsg("note", "Could not read that file: " + err.message + " Export the room as OBJ with closed surfaces."); }
  };
  reader.readAsText(file);
  $("#import-file").value = "";
}
const curSpace = () => state.spaces.find((s) => s.id === state.spaceId);
const spaceVolume = (sp) => sp.volumeOverride || sp.info.volume;
function effAlpha(sp, pl) {
  if (isForm(pl.family)) return formOct(formOf(pl.family));
  const oct = R.thirdToOctave(current(pl.family).alpha);
  return isHang(pl.family) ? oct : oct.map((a, i) => Math.max(0, a - R.SURFACES[sp.finishes.wall].alpha[i]));
}
function spaceCalc(sp) {
  const space = { volume: spaceVolume(sp), areas: sp.info.areas, finishes: sp.finishes, people: sp.people };
  const abs = sp.placements.filter(plValid).map((pl) => ({ area: pl.area, alpha: effAlpha(sp, pl) }));
  return { space, res: R.reverb(space, abs), abs };
}
const plValid = (pl) => (isForm(pl.family) ? !!formOf(pl.family) : !!current(pl.family));
const plName = (key) => (isForm(key) ? (formOf(key) ? formOf(key).name : "removed form") : E.FAMILY[key].name);
function verdict(rt, target) {
  if (rt > target * 1.2) return ["bad", "too echoey"];
  if (rt < target * 0.7) return ["warn", "very dry"];
  return ["ok", "good"];
}
function addPlacement(sp, family) {
  const { space, abs } = spaceCalc(sp);
  const need = R.areaNeeded(space, effAlpha(sp, { family }), abs);
  sp.placements.push({ family, area: Math.max(1, Math.round(need || 10)) });
}

// "12 m² + 4 pieces": shapes are counted in m², grown forms in pieces.
function absText(sp) {
  const m2 = sp.placements.filter((p) => !isForm(p.family)).reduce((a, p) => a + p.area, 0);
  const pcs = sp.placements.filter((p) => isForm(p.family)).reduce((a, p) => a + p.area, 0);
  return [m2 || !pcs ? `${fix(m2, 0)} m²` : "", pcs ? `${fix(pcs, 0)} piece${pcs === 1 ? "" : "s"}` : ""].filter(Boolean).join(" + ") + " of absorbers";
}

// ---------------------------------------------------------------- 3D view --
const T3 = window.THREE;
// Representative colours of the real materials, used in every 3D view.
const SOFT_COLORS = {
  pet_felt_light: 0x9aa7b4, pet_felt_medium: 0x6f7f91, pet_felt_dense: 0x4f5d6e, recycled_cotton: 0xe6e1d8, wool_felt: 0xa89f94,
  sheep_wool_batt: 0xefe6d2, hemp_fibre: 0xc8b48a, coconut_coir: 0x8a5a33, cork_granulate: 0xa8743f, cellulose_fibre: 0xd9d6cf,
  wood_wool: 0xd8bf8c, mycelium: 0xefe9dc, mineral_wool: 0xc9b45a, melamine_foam: 0xf4f4f2,

const HARD_COLORS = { rigid_pet: 0x3e4650, birch_plywood: 0xd9b98a, solid_cardboard: 0xa9825a, pla_print: 0xe9efe6, fired_clay: 0xb4583a };
const hex = (n) => "#" + n.toString(16).padStart(6, "0");

// An orbit viewer: drag to orbit, wheel or pinch to zoom. `up` is the scene's vertical axis.
function makeViewer({ up = "z", hud = "Drag to orbit · scroll or pinch to zoom", cls = "viewport" } = {}) {
  const el = document.createElement("div");
  el.className = cls;
  const v = { el, ok: !!T3, root: null, orbit: { theta: -0.9, phi: 1.05, dist: 3, target: [0, 0, 0] } };
  if (!T3) { el.innerHTML = '<div class="fallback">The 3D view could not load here. Everything else still works.</div>'; v.draw = () => {}; return v; }
  const renderer = new T3.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setClearColor(0x0f1012);
  el.appendChild(renderer.domElement);
  el.insertAdjacentHTML("beforeend", `<div class="hud">${hud}</div>`);
  const scene = new T3.Scene(), camera = new T3.PerspectiveCamera(40, 1, 0.01, 3000);
  if (up === "z") camera.up.set(0, 0, 1);
  scene.add(new T3.HemisphereLight(0xffffff, 0x404048, 0.65));
  const sun = new T3.DirectionalLight(0xffffff, 0.8);
  sun.position.set(up === "z" ? 3 : 2, up === "z" ? -2 : 3, up === "z" ? 6 : 4);
  scene.add(sun);
  v.root = new T3.Group();
  scene.add(v.root);
  let raf = 0;
  v.draw = () => {
    if (!el.isConnected) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const w = el.clientWidth, h = el.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
      const o = v.orbit, [tx, ty, tz] = o.target, s = Math.sin(o.phi), c = Math.cos(o.phi);
      if (up === "z") camera.position.set(tx + o.dist * s * Math.cos(o.theta), ty + o.dist * s * Math.sin(o.theta), tz + o.dist * c);
      else camera.position.set(tx + o.dist * s * Math.sin(o.theta), ty + o.dist * c, tz + o.dist * s * Math.cos(o.theta));
      camera.lookAt(tx, ty, tz);
      sun.position.copy(camera.position).add(new T3.Vector3(up === "z" ? 0 : 1, up === "z" ? 0 : 2, up === "z" ? 3 : 0));
      renderer.render(scene, camera);
    });
  };
  v.clear = () => {
    const kill = (o) => { o.children.slice().forEach(kill); if (o.geometry) o.geometry.dispose(); if (o.material) [].concat(o.material).forEach((m) => m.dispose()); };
    v.root.children.slice().forEach((ch) => { kill(ch); v.root.remove(ch); });
  };
  const zoom = (f) => { v.orbit.dist = Math.min(800, Math.max(0.05, v.orbit.dist * f)); v.draw(); };
  const cv = renderer.domElement, pts = new Map();
  let last = null, pinch = 0;
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); last = [e.clientX, e.clientY]; });
  cv.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) zoom(pinch / d); pinch = d; return; }
    v.orbit.theta -= (e.clientX - last[0]) * 0.008;
    v.orbit.phi = Math.min(Math.PI - 0.08, Math.max(0.08, v.orbit.phi - (e.clientY - last[1]) * 0.008));
    last = [e.clientX, e.clientY]; v.draw();
  });
  const upEv = (e) => { pts.delete(e.pointerId); pinch = 0; };
  cv.addEventListener("pointerup", upEv); cv.addEventListener("pointercancel", upEv);
  cv.addEventListener("wheel", (e) => { e.preventDefault(); zoom(Math.exp(e.deltaY * 0.001)); }, { passive: false });
  new ResizeObserver(() => v.draw()).observe(el);
  return v;
}

// Spaces: the room and its absorbers (z up, metres).
const View3D = (() => {
  let v = null, space = null;
  function buildRoom(sp) {
    const look = { floor: [0x6f737a, 0.95], wall: [0xb9bdc4, 0.22], ceiling: [0xd4d7dc, 0.1] };
    for (const tag of ["floor", "wall", "ceiling"]) {
      const pos = [];
      sp.mesh.tris.forEach((t, i) => { if (sp.mesh.tags[i] === tag) for (const p of t) pos.push(...p); });
      if (!pos.length) continue;
      const g = new T3.BufferGeometry(); g.setAttribute("position", new T3.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
      const [color, opacity] = look[tag];
      v.root.add(new T3.Mesh(g, new T3.MeshLambertMaterial({ color, transparent: opacity < 1, opacity, side: T3.DoubleSide, depthWrite: opacity >= 1 })));
      v.root.add(new T3.LineSegments(new T3.EdgesGeometry(g, 25), new T3.LineBasicMaterial({ color: 0x8a8f98 })));
    }
  }
  function buildAbsorbers(sp) {
    if (!state.showAbs) return;
    const { min, max } = sp.info, W = max[0] - min[0], D = max[1] - min[1], H = max[2] - min[2], panel = 1.2;
    const lay = roomLayout(sp);
    let li = 0;
    for (const pl of sp.placements) {
      if (isForm(pl.family)) {
        const f = formOf(pl.family);
        if (!f || pl.area <= 0) continue;
        const n = Math.max(1, Math.min(Math.round(pl.area), Math.floor(60000 / Math.max(1, G.count(f.prims))))), step = f.size * 1.4;
        const cols = Math.max(1, Math.floor((W - step) / step) + 1), spots = [];
        for (let k = 0; k < n; k++) {
          const zs = f.mount === "hanging" ? max[2] - 0.3 : min[2];
          if (lay && li < lay.spots.length) { const [sx, sy] = lay.spots[li++]; spots.push([min[0] + sx, min[1] + sy, zs]); continue; }
          const i = k % cols, j = Math.floor(k / cols);
          const x = min[0] + (W - (cols - 1) * step) / 2 + i * step, y = min[1] + step / 2 + 0.5 + j * step;
          spots.push([x, Math.min(y, max[1] - step / 2), f.mount === "hanging" ? max[2] - 0.3 : min[2]]);
        }
        formInstances(f, spots, v.root);
        continue;
      }
      const r = current(pl.family);
      if (!r || pl.area <= 0) continue;
      const n = Math.min(400, Math.ceil(pl.area / (panel * panel))), depth = Math.max(0.03, r.params.depth / 1000);
      const color = r.params.porous ? SOFT_COLORS[r.params.porous] : HARD_COLORS[r.params.rigid];
      const mat = new T3.MeshStandardMaterial({ color, roughness: 0.9 });
      if (isHang(pl.family)) {
        const cols = Math.max(1, Math.round(Math.sqrt((n * W) / D))), rows = Math.ceil(n / cols);
        for (let k = 0; k < n; k++) {
          const m = new T3.Mesh(new T3.BoxGeometry(panel, panel, depth), mat);
          m.position.set(min[0] + ((k % cols + 0.5) / cols) * W, min[1] + ((Math.floor(k / cols) + 0.5) / rows) * D, min[2] + H * 0.82);
          v.root.add(m);
        }
        continue;
      }
      // Panels in rows along each wall, kept clear of the corners, filled from 1.4 m up.
      const gap = 0.2, pitch = panel + gap;
      const walls = [
        { len: W, at: (t) => [min[0] + t, min[1] + depth / 2], rot: 0 },
        { len: D, at: (t) => [max[0] - depth / 2, min[1] + t], rot: Math.PI / 2 },
        { len: W, at: (t) => [max[0] - t, max[1] - depth / 2], rot: 0 },
        { len: D, at: (t) => [min[0] + depth / 2, max[1] - t], rot: Math.PI / 2 },
      ].map((w) => ({ ...w, slots: Math.max(1, Math.floor((w.len - 0.3 + gap) / pitch)) }));
      const rowsMax = Math.max(1, Math.floor((H - 1.4 - 0.2 + 0.15) / (panel + 0.15)));
      let placed = 0;
      for (let row = 0; row < rowsMax && placed < n; row++) {
        for (const w of walls) {
          const start = (w.len - (w.slots * pitch - gap)) / 2 + panel / 2;
          for (let k = 0; k < w.slots && placed < n; k++, placed++) {
            const [x, y] = w.at(start + k * pitch);
            const m = new T3.Mesh(new T3.BoxGeometry(panel, depth, panel), mat);
            m.position.set(x, y, min[2] + 1.4 + panel / 2 + row * (panel + 0.15)); m.rotation.z = w.rot;
            v.root.add(m);
          }
        }
      }
    }
  }
  function rebuild() { v.clear(); buildRoom(space); buildAbsorbers(space); }
  function frame(sp) {
    const { min, max } = sp.info;
    Object.assign(v.orbit, { theta: -0.9, phi: 1.05, target: [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 3],
      dist: Math.hypot(max[0] - min[0], max[1] - min[1], max[2] - min[2]) * 1.35 });
  }
  return {
    attach(slot, sp) {
      if (!v) v = makeViewer({ up: "z" });
      slot.replaceWith(v.el);
      if (!v.ok) return;
      const changed = space !== sp;
      space = sp;
      rebuild();
      if (changed) frame(sp);
      v.draw();
    },
    detach() { if (v && v.el.isConnected) v.el.remove(); },
    update() { if (v && v.ok && space) { rebuild(); v.draw(); } },
    preset(k) {
      if (!v || !v.ok || !space) return;
      if (k === "top") Object.assign(v.orbit, { phi: 0.08, theta: -Math.PI / 2 }); else frame(space);
      v.draw();
    },
  };
})();

// Shapes: one 600 x 600 mm module of the grown shape (y up, metres; wall at z = 0, room towards +z).
// The front of resonators, coils and the moss layer is cut away on the left half to show the inside.
const ShapeView = (() => {
  let v = null, shown = null;
  const TILE = 0.6;
  function hashf(i, j, k) { const x = Math.sin(i * 127.1 + j * 311.7 + k * 74.7) * 43758.5453; return x - Math.floor(x); }
  const mat = (color, extra = {}) => new T3.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0, ...extra });
  function box(w, h, d, x, y, z, m) { const b = new T3.Mesh(new T3.BoxGeometry(w, h, d), m); b.position.set(x, y, z); v.root.add(b); return b; }
  // Instanced cubes: cells [[x, y, z, sx, sy, sz], ...]
  function cubes(cells, m) {
    if (!cells.length) return;
    const inst = new T3.InstancedMesh(new T3.BoxGeometry(1, 1, 1), m, cells.length), o = new T3.Object3D();
    cells.forEach(([x, y, z, sx, sy, sz], i) => { o.position.set(x, y, z); o.scale.set(sx, sy, sz); o.updateMatrix(); inst.setMatrixAt(i, o.matrix); });
    v.root.add(inst);
  }
  // A porous block made of voxels: fractions[i] is the solid share of slice i (front first).
  function sponge(fractions, zFront, thick, m, { cutLeft = false, n = 20, axis = "z", y0 = 0 } = {}) {
    const cell = TILE / n, dz = thick / fractions.length, cells = [];
    fractions.forEach((s, k) => {
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if (cutLeft && i < n / 2) continue;
        if (hashf(i, j, k) >= s) continue;
        const a = (i + 0.5) * cell, b = (j + 0.5) * cell, c = zFront - (k + 0.5) * dz;
        cells.push(axis === "z" ? [a, b, c, cell * 0.92, cell * 0.92, dz * 0.92] : [a, y0 + c, b, cell * 0.92, dz * 0.92, cell * 0.92]);
      }
    });
    cubes(cells, m);
  }
  function wall() {
    box(TILE + 0.12, TILE + 0.12, 0.01, TILE / 2, TILE / 2, -0.005, mat(0x55585e));
  }
  // Perforated plate at z in [z0, z0 + t] with dark discs for the holes; only the right half when cut.
  function plate(z0, t, holeMm, porosity, hardColor, cutLeft) {
    const d = holeMm / 1000, spacing = Math.max(d * Math.sqrt(Math.PI / (4 * porosity)), 0.012), n = Math.min(60, Math.floor(TILE / spacing));
    const x0 = cutLeft ? TILE / 2 : 0, w = TILE - x0;
    box(w, TILE, t, x0 + w / 2, TILE / 2, z0 + t / 2, mat(hardColor));
    const disc = new T3.CylinderGeometry(Math.max(d, 0.003) / 2, Math.max(d, 0.003) / 2, 0.002, 12);
    disc.rotateX(Math.PI / 2);
    const holes = [];
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const x = (i + 0.5) * (TILE / n), y = (j + 0.5) * (TILE / n);
      if (x >= x0) holes.push([x, y]);
    }
    const inst = new T3.InstancedMesh(disc, mat(0x15161a), holes.length), o = new T3.Object3D();
    holes.forEach(([x, y], i) => { o.position.set(x, y, z0 + t + 0.0008); o.updateMatrix(); inst.setMatrixAt(i, o.matrix); });
    v.root.add(inst);
  }
  function partitions(depth, spacing, hardColor, x0 = 0) {
    const m = mat(hardColor), n = Math.round(TILE / spacing);
    for (let k = 0; k <= n; k++) {
      const p = k * (TILE / n);

    }
  }
  const builders = {
    spikes(p) {
      const soft = mat(SOFT_COLORS[p.porous]), D = p.depth / 1000, taper = 1 - p.base, pitch = TILE / 6;
      if (p.base > 0) box(TILE, TILE, D * p.base, TILE / 2, TILE / 2, (D * p.base) / 2, soft);
      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const z = D * p.base + (D - D * p.base) * (i / 24), t = 1 - z / D;
        const s = taper > 0 ? (t >= taper ? 1 : Math.pow(t / taper, p.taper)) : 1;

      }
      const g = new T3.LatheGeometry(pts, 4);
      g.rotateX(Math.PI / 2); g.rotateZ(Math.PI / 4); g.computeVertexNormals();

        const m = new T3.Mesh(g, soft); m.position.set((i + 0.5) * pitch, (j + 0.5) * pitch, 0); v.root.add(m);
      }

    },
    sponge(p, r) {
      const soft = mat(SOFT_COLORS[p.porous]), D = p.depth / 1000, ds = D * (1 - p.gap);
      sponge(r.extra.fractions, D, ds, soft);
      if (p.gap > 0.02) for (const [x, y] of [[0.1, 0.1], [0.5, 0.1], [0.1, 0.5], [0.5, 0.5]]) box(0.012, 0.012, D * p.gap, x, y, (D * p.gap) / 2, mat(0x888b91));
      return p.gap > 0.02 ? `Sponge on small spacers, ${mm(p.depth * p.gap)} off the wall` : "Sponge against the wall";
    },
    cloud(p, r) {
      const soft = mat(SOFT_COLORS[p.porous]), D = p.depth / 1000, hang = 0.35;

    bottles(p) {

      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {

    coil(p, r) {

    hybrid(p, r) {

    Object.assign(v.orbit, key === "cloud" ? { target: [TILE / 2, h / 2, TILE / 2], dist: 1.3, theta: 0.7, phi: 1.2 }

    return note;
  }
  return {
    show(slot, key, r) {

      slot.replaceWith(v.el);
      if (!v.ok) return "";
      const sig = key + JSON.stringify(r.params);

    detach() { if (v && v.el.isConnected) v.el.remove(); },

const isForm = (key) => typeof key === "string" && key.startsWith("form:");

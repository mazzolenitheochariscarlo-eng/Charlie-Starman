    const { text } = await sample([{ role: "user", content: RULES + "\n\nWhat the person currently sees:\n" + pageState() },
      { role: "assistant", content: "Understood. I will guide them simply." }, ...turns.slice(-8)],
      { cache: false, signal: ctl.signal, onText: ({ text: t }) => { bubble.textContent = t; $("#log").scrollTop = $("#log").scrollHeight; } });
    turns.push({ role: "assistant", content: text });
  } catch (e) {
    const code = e && e.code;
    bubble.textContent = code === "refused" ? "" : (e && e.text) || "";
    if (!bubble.textContent) bubble.remove();
    if (code !== "cancelled") addMsg("note", ERR[code] || "Something interrupted the answer. Try again.");
    turns.pop();
    if (code === "not_granted" || code === "sampling_disabled") sample = null;
  } finally { ctl = null; $("#ask-stop").hidden = true; $("#ask-send").disabled = false; }
}
$("#ask-form").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#ask-input").value; $("#ask-input").value = ""; ask(q); });
$("#ask-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ask-form").requestSubmit(); } });
$("#ask-stop").addEventListener("click", () => ctl && ctl.abort());

// ------------------------------------------------------------------- tour --
const TOUR = [
  { ws: "grow", tool: "all", sel: "#ws-tabs", title: "Three workspaces", text: "Structures grows natural structures, Materials compares materials, Spaces tests everything in 3D models of your exhibition areas." },
  { ws: "grow", tool: "all", sel: "#tools", title: "1. One toolbar, every generator", text: "From the top: surface textures (panels and screens), natural growth (tree, snow, coral, shell, foam), felt-sheet hybrids, and at the bottom the sound-grown membrane." },
  { ws: "grow", tool: "all", sel: "#opt-target", title: "2. What to quiet", text: "Choose the noise you care about, and the material in the menu next to it: one material, or the best of the ones you ticked." },
  { ws: "grow", tool: "all", sel: "#opt-mount", title: "3. Freestanding", text: "Free forms grow a holdfast (roots, feet or a plinth) and must lean at least 10° before toppling. Set the size and the budget per piece, then press Grow." },
  { ws: "grow", tool: "allsurf", sel: "#opt-space", title: "4. The bar follows the tool", text: "For surface textures it asks for depth and budget per m² instead: depth decides which pitches can be caught." },
  { ws: "grow", tool: "membrane", sel: "#panel-sound", title: "5. Sound draws the form", text: "After Biothing's Genware: choose a sound (your target, a recording, or a room's resonances). Where the air moves most, the membrane grows denser. Keep forms you like in the seed library." },
  { ws: "grow", tool: "all", sel: "#panel-forms", title: "6. Everything you grow", text: "Grown free forms and surface textures are listed in the panels on the right. Click any to open it; Properties explains it in plain words." },
  { ws: "materials", sel: "#panel-materials", title: "7. Materials", text: "Tick what you are happy to use. The chart compares each material as a plain flat layer." },
  { ws: "spaces", sel: "#panel-spaces", title: "8. Your spaces", text: "Each exhibition area is its own 3D model. Add a ready-made room, or import an OBJ from Rhino, SketchUp or Blender." },
  { ws: "spaces", sel: "#panel-absorbers", title: "9. Place absorbers", text: "Add grown structures to the space. The lab tells you how much reaches the recommended echo, and how much the crowd noise drops." },
  { ws: "spaces", sel: "#panel-guide", title: "10. Ask me", text: "I'm here the whole time. Ask anything, in your own words." },
];
let tourAt = -1;
function tour(i) {
  $$(".tour-focus").forEach((x) => x.classList.remove("tour-focus"));
  const box = $("#tour");
  if (i < 0 || i >= TOUR.length) { box.hidden = true; tourAt = -1; return; }
  tourAt = i;
  const step = TOUR[i];
  if (state.ws !== step.ws) setWorkspace(step.ws);
  if (step.tool && state.gtool !== step.tool) setTool(step.tool);
  const target = $(step.sel);
  box.innerHTML = `<span class="kicker">Guided tour · ${i + 1} of ${TOUR.length}</span><h3>${step.title}</h3><p>${step.text}</p>
    <div class="row"><button class="btn small ghost" id="tour-end">Close</button><span><button class="btn small" id="tour-back" ${i === 0 ? "disabled" : ""}>Back</button>
    <button class="btn small primary" id="tour-next">${i === TOUR.length - 1 ? "Finish" : "Next"}</button></span></div>`;
  box.hidden = false;
  $("#tour-end").onclick = () => tour(-1); $("#tour-back").onclick = () => tour(i - 1); $("#tour-next").onclick = () => tour(i + 1);
  if (target) {
    target.classList.add("tour-focus");
    target.scrollIntoView({ block: "nearest" });
    const r = target.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight;
    let top = r.bottom + 10, left = Math.min(Math.max(16, r.left), innerWidth - bw - 16);
    if (top + bh > innerHeight - 10) top = Math.max(10, r.top - bh - 10);
    if (r.left > innerWidth * 0.6) left = Math.max(16, r.left - bw - 12);
    box.style.top = top + "px"; box.style.left = left + "px";
  }
  $("#tour-next").focus();
}
$("#tour-start").onclick = () => tour(0);
$("#tour-start-2").onclick = () => tour(0);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && tourAt >= 0) tour(-1); });
addEventListener("resize", () => { if (tourAt >= 0) tour(tourAt); });

// ------------------------------------------------------------------- boot --
refreshPreview();
addPreset("gallery"); addPreset("hall");
state.spaceId = state.spaces[0].id;
renderAll();
addMsg("bot", "Hi! I'm your guide. New here? Press “Guided tour” at the top right, or just ask me anything.");
if (window.claude && window.claude.use) {
  window.claude.use("sample").then((s) => { sample = s; });
  window.claude.use("downloads").then((d) => { downloads = d; if (gmode() === "shapes" && state.tool !== "all") renderDock(); });
}
</script>

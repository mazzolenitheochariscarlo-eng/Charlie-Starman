// Iterative radix-2 FFT (in place); N must be a power of two.
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (-2 * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ar = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, ai = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k + len / 2] = re[i + k] - ar; im[i + k + len / 2] = im[i + k] - ai; re[i + k] += ar; im[i + k] += ai;
        [cr, ci] = [cr * wr - ci * wi, cr * wi + ci * wr];
      }
    }
  }
}

// Reads a sound file: its rhythm (tempo and how strong the beat is), its loudest 0.3 s resampled
// to the wave solver's time step (that is what drives the field), and its octave-band balance.
async function loadSound(file) {
  if (!file) return;
  state.gw.busy = true;
  renderDock();
  try {
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const audio = await new Ctx(1, 2, 44100).decodeAudioData(await file.arrayBuffer());
    const sr = audio.sampleRate, n = Math.min(audio.length, sr * 60), x = new Float32Array(n);
    for (let c = 0; c < audio.numberOfChannels; c++) { const d = audio.getChannelData(c); for (let i = 0; i < n; i++) x[i] += d[i] / audio.numberOfChannels; }
    const hop = Math.round(sr * 0.02), frames = Math.max(1, Math.floor(n / hop)), env = new Float32Array(frames);
    for (let f = 0; f < frames; f++) { let e = 0; for (let i = f * hop; i < Math.min(n, (f + 1) * hop); i++) e += x[i] * x[i]; env[f] = Math.sqrt(e / hop); }
    const on = env.map((v, i) => Math.max(0, v - (i ? env[i - 1] : 0))), mean = on.reduce((a, b) => a + b, 0) / frames, oc = on.map((v) => v - mean);
    const ac = (lag) => { let s = 0; for (let i = lag; i < frames; i++) s += oc[i] * oc[i - lag]; return s; };
    const a0 = ac(0) || 1;
    let bestLag = 0, best = -Infinity;
    for (let lag = 15; lag <= 75 && lag < frames; lag++) { const v = ac(lag); if (v > best) { best = v; bestLag = lag; } }
    const strength = Math.max(0, Math.min(1, (best / a0) * 2)), bpm = bestLag && strength > 0.05 ? 60 / (bestLag * 0.02) : 0;
    const win = 15;
    let pk = -1, pkAt = 0;
    for (let f = 0; f + win <= frames; f++) { let s = 0; for (let k = 0; k < win; k++) s += env[f + k]; if (s > pk) { pk = s; pkAt = f; } }
    const dt = G.solverStep(), start = pkAt * hop, len = Math.round(0.3 / dt), sig = new Float32Array(len), stepS = sr * dt;
    for (let i = 0; i < len; i++) {
      const a = Math.floor(start + i * stepS), b = Math.min(n, Math.floor(start + (i + 1) * stepS));
      let s = 0;
      for (let j = a; j < b; j++) s += x[j];
      sig[i] = b > a ? s / (b - a) : 0;
    }
    let peak = 1e-9;
    for (const v of sig) peak = Math.max(peak, Math.abs(v));
    for (let i = 0; i < len; i++) sig[i] /= peak;
    const N = 8192, re = new Float32Array(N), im = new Float32Array(N);
    for (let i = 0; i < N; i++) { const j = start + i; re[i] = (j < n ? x[j] : 0) * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1))); }
    fft(re, im);
    const bands = [125, 250, 500, 1000, 2000, 4000].map((fc) => {
      let e = 0;
      for (let k = Math.floor((fc / Math.SQRT2 / sr) * N); k <= Math.ceil((fc * Math.SQRT2 / sr) * N) && k < N / 2; k++) e += re[k] * re[k] + im[k] * im[k];
      return e;
    });
    const bmax = Math.max(...bands) || 1;
    state.gw.file = { name: file.name, duration: audio.duration, signal: sig, bpm, strength, bands: bands.map((b) => b / bmax) };
    state.gw.source = "file"; state.gw.field = null;
    addMsg("note", `Listened to “${file.name}”: ${bpm ? `about ${Math.round(bpm)} beats per minute` : "no clear beat"}, loudest around ${hz([125, 250, 500, 1000, 2000, 4000][bands.indexOf(bmax)])}.`);
  } catch (err) {
    addMsg("note", "Could not read that sound file. Try a WAV or MP3 recording.");
  } finally {
    state.gw.busy = false;
  }
  renderDock();
  if (gmode() === "forms") renderFormsCanvas();
}

// Heat map of a field (dark = calm air, yellow = where the air moves most), with membrane cells on top.
function drawField(cv, field, parts, width, height, mount) {
  if (!cv || !field) return;
  const W = 240, Hp = Math.max(60, Math.round((240 * height) / width)), { nx, nz, data } = field;
  cv.width = W; cv.height = Hp;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(W, Hp), stops = [[20, 21, 24], [47, 125, 85], [230, 195, 74]];
  for (let y = 0; y < Hp; y++) for (let x = 0; x < W; x++) {
    const u = (x / (W - 1)) * (nx - 1), v = (1 - y / (Hp - 1)) * (nz - 1), i = Math.min(nx - 2, Math.floor(u)), k = Math.min(nz - 2, Math.floor(v)), fu = u - i, fv = v - k;
    const q = (a, b) => data[a + nx * b], f = (q(i, k) * (1 - fu) + q(i + 1, k) * fu) * (1 - fv) + (q(i, k + 1) * (1 - fu) + q(i + 1, k + 1) * fu) * fv;
    const t = Math.max(0, Math.min(1, f)) * 2, a = stops[Math.min(1, Math.floor(t))], b = stops[Math.min(2, Math.floor(t) + 1)], w = t - Math.floor(t), d = 4 * (x + W * y);
    img.data[d] = a[0] + (b[0] - a[0]) * w; img.data[d + 1] = a[1] + (b[1] - a[1]) * w; img.data[d + 2] = a[2] + (b[2] - a[2]) * w; img.data[d + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);

  ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 1;
  for (const p of parts) {
    if (!G.isSheet(p) || p.structure) continue;
    const z = p.c[2] + (G.hung(mount) ? height : 0), hu = Math.hypot(p.u[0], p.u[1]), hv = Math.hypot(...p.v);
    const px = (p.c[0] / width + 0.5) * W, py = (1 - z / height) * Hp, sx = (hu / width) * W, sy = (hv / height) * Hp;
    ctx.strokeRect(px - sx, py - sy, 2 * sx, 2 * sy);

}

// The cut-sheet's laser-cutter file: red lines cut, blue and green lines are scored hinges
// (blue: the flap folds to the front, green: to the back). Units are millimetres.
function cutSVG(f, preview = false) {
  const P = f.cutPlan, W = P.L * 1000, Hh = P.H * 1000, X = (s2) => ((s2 + P.L / 2) * 1000).toFixed(1), Y = (z) => (Hh - z * 1000).toFixed(1);
  let cuts = "", front = "", back = "", fills = "";
  for (const c of P.cells) {
    if (!c.w) continue;
    const l = c.s - c.w / 2, r = c.s + c.w / 2, b = c.z - c.h / 2, t = c.z + c.h / 2;
    const hinge = c.side ? `M${X(l)} ${Y(t)} L${X(l)} ${Y(b)} ` : `M${X(l)} ${Y(t)} L${X(r)} ${Y(t)} `;
    cuts += c.side ? `M${X(l)} ${Y(t)} L${X(r)} ${Y(t)} L${X(r)} ${Y(b)} L${X(l)} ${Y(b)} ` : `M${X(l)} ${Y(t)} L${X(l)} ${Y(b)} L${X(r)} ${Y(b)} L${X(r)} ${Y(t)} `;
    if (c.dir < 0) back += hinge; else front += hinge;
    if (preview) fills += `<rect x="${X(l)}" y="${Y(t)}" width="${(c.w * 1000).toFixed(1)}" height="${(c.h * 1000).toFixed(1)}" fill="#e6c34a" fill-opacity="${Math.min(0.85, 0.15 + c.open / 1.4).toFixed(2)}"/>`;
  }
  const sw = preview ? 5 : 0.2, dash = preview ? "14 8" : "4 2";
  const body = `${fills}<rect x="0" y="0" width="${W.toFixed(1)}" height="${Hh.toFixed(1)}" fill="${preview ? "var(--app)" : "none"}" fill-opacity="${preview ? 0.4 : 0}" stroke="#ff0000" stroke-width="${sw}"/>
<path d="${cuts}" fill="none" stroke="#ff0000" stroke-width="${sw}"/><path d="${front}" fill="none" stroke="#0000ff" stroke-width="${sw}" stroke-dasharray="${dash}"/><path d="${back}" fill="none" stroke="#00aa00" stroke-width="${sw}" stroke-dasharray="${dash}"/>`;
  if (preview) return `<svg viewBox="-10 -10 ${W + 20} ${Hh + 20}" class="cut-preview" role="img" aria-label="Cut pattern of the sheet">${body}</svg>`;
  return `<?xml version="1.0" encoding="UTF-8"?>
<!-- Biothing Sound Lab: ${esc(f.name)}. ${esc(E.FELTS[f.material].name)}, ${Math.round(P.t * 1000)} mm, sheet ${Math.round(W)} x ${Math.round(Hh)} mm laid flat (bend it to its plan curve after cutting).
     Red: cut (${fix(P.cutLength, 1)} m). Blue: score on the front, flap folds forward. Green: score on the back, flap folds backward. ${P.flaps} flaps. -->
<svg xmlns="http://www.w3.org/2000/svg" width="${W.toFixed(1)}mm" height="${Hh.toFixed(1)}mm" viewBox="0 0 ${W.toFixed(1)} ${Hh.toFixed(1)}">
${body}
</svg>
`;
}

function renderGuideTip() {
  const t = TIPS[gmode()];
  $("#guide-tip").innerHTML = t.text;
  $("#ask-chips").innerHTML = t.chips.map((c) => `<button class="chip" type="button" data-ask="${esc(c)}">${esc(c)}</button>`).join("");
}
document.addEventListener("click", (e) => { const c = e.target.closest("[data-ask]"); if (c) ask(c.dataset.ask); });

const RULES = `You are the friendly guide inside "Biothing Sound Lab", a design tool laid out like a creative-suite app. It grows sound-absorbing shapes inspired by nature (after Alisa Andrasek's Biothing): all of them in one Structures workspace: surface textures (panel-like families) and free objects. The product must be freestanding: standing forms grow a holdfast (splayed roots or a plinth) and must lean 10 degrees before toppling. Forms come from natural rules (branching tree, snow crystal, folding coral, spiral shell, foam) or sheet hybrids (felt sheets arranged as a leaf canopy, mushroom gills, pine cone or twisted lamellae), or the Sound-grown membrane after Biothing's Genware (a sound source, either the target sound, an uploaded recording or a room's resonances, becomes a field of air motion; a cellular felt membrane grows denser where air moves most and the field is updated by what has grown over three rounds). A seed library keeps genomes the designer likes and starts new growth from them (after Malafouris's essay on Genware as a "library of seeds" changed by what grows); it can be saved and loaded at the next venue. Further ideas from Andrasek's AA lecture "Material Potency": the Interference cut-sheet (after her New Museum ceiling, where wave interference was cut into flat laser-cut sheets that gravity bent into 3D): one flat felt sheet with three-sided flap cuts, larger and more open where the room's sound field is strong; each flap sags under its own weight depending on the felt's density and thickness (top hinges sag, side hinges hold), and it exports an SVG cut file. "Grow a speech skin": a second, finer growth of felt tufts on a grown form, drawn by the speech-band sound (one behaviour grown on another, like her tower and its skin). "Grow 6 variants": a family whose genes move within brackets of elasticity around the parent, all different but one nature, like dunes in one desert. "Where pieces help most": a probability map of the room plan (low pitches: room standing waves at ear height, since felt works where air moves; speech: a band 0.4-1.6 m from the walls) from which layouts A, B, C are drawn by chance, after her tower project's probabilistic programme. Positions do not change the Sabine echo numbers. Every generator can grow as a wall (a double-sided partition that joins edge to edge with others, standing on the ground on feet or hung from the ceiling on cables), as a single freestanding module, or as a ceiling piece hanging overhead, or all three in one run; seeds are kept per place. In the room, wall modules form partitions across the room with passages at the ends. Every single generator opens as a graph like Grasshopper or nTop: nodes Seed and place (mount, size, random seed), Field (from sound: target sound, recording, room resonances; or drawn: attractor point, gradient, rings, two interfering waves, noise), the rule's own values grouped as Cell / Response to the field / Holdfast, Material, and Evolve (population, generations, mutation, start from seeds). Each value can be dragged (live 3D preview), locked, or given a range for evolution; Test runs the wave simulator on the exact form; Keep adds it; Watch it grow replays the order it grew in. Pattern and lattice generators: Voronoi cells (open cells, funnels, stepped web), Felt petals on sunflower spirals, Slotted felt strips (egg-crate with a strip cut file), Strut lattice (cubic, body-centred, octet, diamond, honeycomb; printed, graded, wavy, felt balls in cells), Minimal surface TPMS (gyroid, Schwarz P, diamond; printed shell with felt in one labyrinth), Spatial lattice (a printed lattice filling a column-into-canopy or a cloud, like Biothing's robotically printed pergola), Cellular automata (3D neighbour rules over generations: coral, sponge, crystal), Liquid bioform (blended blobs, or pulls stretched out of a slab after Ross Lovegrove's Liquid Table Bioform, as a heat-formed felt shell with holes). Printed struts and shells barely absorb because their gaps are far too big to rub the air; felt does the absorbing. A third tab, Structures, is a gallery: every surface texture and growth rule grown three ways (on a wall, freestanding, from the ceiling), with middle values or random generations; clicking a picture opens that generation in the Studio's graph. When asked about Biothing, explain simply: grow, don't draw; simple local rules give rich results; differentiation within one nature; material computation; the environment steers growth; a garden of seeds; the designer guides like a gardener. Everything is tested in a 2D wave simulator that reads about 25% conservative. Everything happens in one Studio mode around the selected room (a ready-made room or the user's OBJ model): it is shown in 3D, structures are grown and placed in it, and its echo and crowd noise update. The target "This room's needs" weights each pitch by how much the room rings too long there. A Materials tab compares materials. The person is a designer, not an acoustic engineer.
How to answer:
- Simple, everyday words; explain any technical word in a few words the first time.
- Short: at most about 120 words unless asked for more. Short paragraphs or a few bullets.
- Refer to what is on their screen (workspace, toolbar, options bar, panels: Properties, Layers, Materials, Spaces, Absorbers) and say which control to use.
- The numbers come from simplified physics (porous-material, resonator and tube models; Sabine reverberation). Good for comparing ideas; real objects and rooms should be tested. Mention this only when it matters.
- Answer in the language the person writes in.`;
function pageState() {
  const lines = [`Workspace: ${state.ws === "grow" ? `Studio (one mode: the selected room in 3D, generators, placement), tool ${state.gtool}` : state.ws}`, `Target: ${TARGET_INFO[state.target].label} (${TARGET_INFO[state.target].example})`,
    `Soft materials: ${[...state.porous].map((k) => E.FELTS[k].name).join(", ") || "none"}`,
    `Hard materials: ${[...state.rigid].map((k) => E.RIGIDS[k].name).join(", ")}`,
  ];
  if (gmode() === "shapes" && state.tool !== "all") lines.push(`Inspecting: ${E.FAMILY[state.tool].name}`);
  lines.push(`Sound source for membranes: ${gwLabel()}${state.gw.field ? " (field computed)" : ""}${state.gw.file ? `; file ${state.gw.file.name}, ${Math.round(state.gw.file.bpm)} BPM` : ""}; seed library: ${Object.entries(state.seeds).map(([k, l]) => `${l.length} ${k}`).join(", ") || "empty"}`);
  lines.push(`Forms settings: ${state.allMounts ? "growing a wall, a freestanding module and a ceiling piece at once" : MOUNT_NAME[state.fMount].toLowerCase()}, evolution ${state.evo.pop} x ${state.evo.gens} generations, mutation ${pct(state.evo.mutation)}, seed ${state.evo.seed}, size ${state.fSize} m, material per piece ${state.fBudget} kg, rule ${state.fRule}; material choice: ${state.matPick === "auto" ? "best of the ticked materials" : E.FELTS[state.matPick].name}`);
  for (const f of state.forms) lines.push(`- ${f.kind === "surface" ? "Surface texture as a freestanding screen" : "Free form"} "${f.name}"${f.id === state.formSel ? " (selected)" : ""}: ${f.mount}, ${describeOf(f)} ${E.FELTS[f.material].name}, ${fix(f.mass, 1)} kg; absorption ${f.area.map((a) => fix(a, 2)).join("/")} m2 at 250/500/1000 Hz; ${fix(f.perKg, 2)} m2 per kg${f.stance ? `; freestanding on ${stanceText(f)}, tips at ${fix(f.stance.angle, 0)} degrees (${f.stance.ok ? "stable" : "unstable"})` : ""}${f.baseline ? `; flat panel with the same kg: ${f.baseline.map((a) => fix(a, 2)).join("/")} m2` : ""}`);
  for (const f of state.forms) {
    if (f.cutPlan) lines.push(`  "${f.name}" cut-sheet: ${f.cutPlan.flaps} flaps, ${fix(f.cutPlan.cutLength, 1)} m of cuts, ${Math.round(f.cutPlan.t * 1000)} mm felt, ${f.cutPlan.side ? "side" : "top"} hinges, flaps close ${pct(f.cutPlan.droop)} under their weight`);
    if (f.skin) lines.push(`  "${f.name}" has a speech skin of ${f.skinCount} felt tufts`);
    if (state.families[f.id]) lines.push(`  "${f.name}" has a family of ${state.families[f.id].ids.length} variants (±${Math.round(state.families[f.id].elasticity * 100)}%)`);
  }
  if (state.ws === "atlas") lines.push(`Structures page: a gallery of every generator grown for a wall, freestanding and from the ceiling (${state.atlas.mode === "middle" ? "every value in the middle" : "random generations, seed " + state.atlas.seed}), felt ${E.FELTS[state.atlas.felt].name}; mechanisms: ${galleryKeys().map((k) => `${isSurf(k) ? E.FAMILY[k].name : G.RULES[k].name} (${MECH[k] ? MECH[k][0] : ""})`).join(", ")}`);
  const lsp = curSpace(), lay = lsp && roomLayout(lsp);
  if (lay && lay.spots.length) lines.push(`Room layout ${"ABC"[lsp.layoutOpt || 0]} in ${lsp.name}: ${lay.spots.length} pieces placed from the probability map, ${fix(lay.gain, 2)}x better spots than an even spread`);
  if (state.ranking) lines.push(`Material ranking for ${E.FAMILY[state.ranking.family].name}: ${state.ranking.rows.map((r) => `${E.FELTS[r.params.porous].name} ${pct(r.score)}`).join(", ")}`);
  for (const s of state.spaces) {
    const { res } = spaceCalc(s);
    lines.push(`Space "${s.name}"${s.id === state.spaceId ? " (selected)" : ""}: ${fix(spaceVolume(s), 0)} m3, floor ${R.SURFACES[s.finishes.floor].name}, walls ${R.SURFACES[s.finishes.wall].name}, ceiling ${R.SURFACES[s.finishes.ceiling].name}, ${s.people} visitors; reverberation 500-1000 Hz now ${fix(res.speechRtBefore, 2)} s, with absorbers ${fix(res.speechRtAfter, 2)} s, recommended ${fix(res.target, 2)} s; absorbers: ${s.placements.map((p) => `${p.area} ${isForm(p.family) ? "pieces" : "m2"} ${plName(p.family)}`).join(", ") || "none"}; crowd noise drop ${fix(Math.max(0, res.noiseDrop), 1)} dB`);
  }
  return lines.join("\n");
}
let sample = null, turns = [], ctl = null;
const ERR = { not_granted: "The guide needs your permission to use Claude. Everything else keeps working.", sampling_disabled: "Claude is not available for this account here.",
  rate_limited: "Too many questions at once. Wait a moment, then ask again.", session_expired: "Please sign in to Claude again.", refused: "The guide could not answer that. Try asking differently.",
  empty_completion: "No answer came back. Try a simpler question.", prompt_too_large: "That was too much at once. Ask a shorter question." };
function addMsg(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls; el.textContent = text;
  $("#log").append(el); $("#log").scrollTop = $("#log").scrollHeight;
  return el;
}
async function ask(q) {
  q = (q || "").trim();
  if (!q) return;
  if (!sample) { addMsg("note", "The live guide is not available in this view. Open the page on claude.ai to ask questions."); return; }
  if (ctl) return;
  addMsg("user", q); turns.push({ role: "user", content: q });
  const bubble = addMsg("bot", "Thinking…");
  ctl = new AbortController(); $("#ask-stop").hidden = false; $("#ask-send").disabled = true;
  try {
    const { text } = await sample([{ role: "user", content: RULES + "\n\nWhat the person currently sees:\n" + pageState() },
      { role: "assistant", content: "Understood. I will guide them simply." }, ...turns.slice(-8)],
      { cache: false, signal: ctl.signal, onText: ({ text: t }) => { bubble.textContent = t; $("#log").scrollTop = $("#log").scrollHeight; } });
    turns.push({ role: "assistant", content: text });
  } catch (e) {
    const code = e && e.code;
    bubble.textContent = code === "refused" ? "" : (e && e.text) || "";
    if (!bubble.textContent) bubble.remove();
    if (code !== "cancelled") addMsg("note", ERR[code] || "Something interrupted the answer. Try again.");
    turns.pop();
    if (code === "not_granted" || code === "sampling_disabled") sample = null;
  } finally { ctl = null; $("#ask-stop").hidden = true; $("#ask-send").disabled = false; }
}
$("#ask-form").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#ask-input").value; $("#ask-input").value = ""; ask(q); });
$("#ask-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ask-form").requestSubmit(); } });
$("#ask-stop").addEventListener("click", () => ctl && ctl.abort());

// ------------------------------------------------------------------- tour --
const TOUR = [
  { ws: "grow", tool: "all", sel: "#ws-tabs", title: "One studio", text: "Everything happens here: the room, the generators and what you place. Materials is a library to compare materials." },
  { ws: "grow", tool: "all", sel: "#opt-room", title: "1. Choose the room", text: "Pick one of your rooms, add a ready-made one, or import your own 3D model (.obj) of an exhibition area." },
  { ws: "grow", tool: "all", sel: "#room-zone", title: "2. See the room", text: "The room in 3D, its echo now and with what you placed, and the recommended echo for talking. Drag to orbit." },
  { ws: "grow", tool: "all", sel: "#opt-target", title: "3. Grow for this room", text: "“This room's needs” weights each pitch by how much the room rings too long, so the structures answer the environment. Pick the material next to it." },
  { ws: "grow", tool: "all", sel: "#tools", title: "4. Generators", text: "Surface textures (as freestanding screens), natural growth, felt-sheet hybrids and the sound-grown membrane. The room view tools are at the bottom." },
  { ws: "grow", tool: "all", sel: "#opt-mount", title: "5. Wall, freestanding or ceiling", text: "A wall is a double-sided partition, on the ground or hung; freestanding is a single module; ceiling pieces hang overhead. All 3 grows one of each. Pieces on the ground must lean 10° before toppling." },
  { ws: "grow", tool: "voronoi", sel: ".graph", title: "6. The graph", text: "Like Grasshopper: every value of a generator is a slider. Drag one and the piece regrows; lock what you like, then Test or Evolve within your ranges." },
  { ws: "grow", tool: "all", sel: "#panel-absorbers", title: "7. Place in the room", text: "Open a grown structure and press “Place in this room”: the lab adds as many pieces as the room needs and the 3D view and echo update." },
  { ws: "grow", tool: "membrane", sel: "#panel-sound", title: "8. Sound draws the form", text: "After Biothing's Genware: the room's own resonances (or a recording) can grow a membrane, or cut the flaps of an interference cut-sheet." },
  { ws: "grow", tool: "all", sel: "#room-map-card", title: "9. Where pieces go", text: "A map of the room shows where pieces help most. Layouts A, B and C are drawn from it by chance: proposals to choose from." },
  { ws: "atlas", sel: "#tab-atlas", title: "10. Compare structures", text: "A gallery of every generator grown for a wall, freestanding and from the ceiling. Click one to open it in the Studio." },
  { ws: "materials", sel: "#panel-materials", title: "11. Materials library", text: "Tick what you are happy to use. The chart compares each material as a plain flat layer." },
  { ws: "grow", tool: "all", sel: "#panel-guide", title: "12. Ask me", text: "I'm here the whole time. Ask anything, in your own words." },
];
let tourAt = -1;
function tour(i) {
  $$(".tour-focus").forEach((x) => x.classList.remove("tour-focus"));
  const box = $("#tour");
  if (i < 0 || i >= TOUR.length) { box.hidden = true; tourAt = -1; return; }
  tourAt = i;
  const step = TOUR[i];
  if (state.ws !== step.ws) setWorkspace(step.ws);
  if (step.tool && state.gtool !== step.tool) setTool(step.tool);
  const target = $(step.sel);
  box.innerHTML = `<span class="kicker">Guided tour · ${i + 1} of ${TOUR.length}</span><h3>${step.title}</h3><p>${step.text}</p>
    <div class="row"><button class="btn small ghost" id="tour-end">Close</button><span><button class="btn small" id="tour-back" ${i === 0 ? "disabled" : ""}>Back</button>
    <button class="btn small primary" id="tour-next">${i === TOUR.length - 1 ? "Finish" : "Next"}</button></span></div>`;
  box.hidden = false;
  $("#tour-end").onclick = () => tour(-1); $("#tour-back").onclick = () => tour(i - 1); $("#tour-next").onclick = () => tour(i + 1);
  if (target) {
    target.classList.add("tour-focus");
    target.scrollIntoView({ block: "nearest" });
    const r = target.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight;
    let top = r.bottom + 10, left = Math.min(Math.max(16, r.left), innerWidth - bw - 16);
    if (top + bh > innerHeight - 10) top = Math.max(10, r.top - bh - 10);
    if (r.left > innerWidth * 0.6) left = Math.max(16, r.left - bw - 12);
    box.style.top = top + "px"; box.style.left = left + "px";
  }
  $("#tour-next").focus();
}
$("#tour-start").onclick = () => tour(0);
$("#tour-start-2").onclick = () => tour(0);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && tourAt >= 0) tour(-1); });
addEventListener("resize", () => { if (tourAt >= 0) tour(tourAt); });

// ------------------------------------------------------------------- boot --
refreshPreview();
addPreset("gallery"); addPreset("hall");
updateRoomTarget();
state.spaceId = state.spaces[0].id;
renderAll();
addMsg("bot", "Hi! I'm your guide. New here? Press “Guided tour” at the top right, or just ask me anything.");
if (window.claude && window.claude.use) {
  window.claude.use("sample").then((s) => { sample = s; });
  window.claude.use("downloads").then((d) => { downloads = d; renderDock(); });
}
</script>
